cheduling, coordination with other projects, benchmarks/history, baselining, and variance analysis.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Prepare a schedule per the selected development approach • Coordinate with other projects and operations • Estimate tasks (milestones, dependencies, story points) • Utilize benchmarks and historical data • Create the schedule • Baseline it • Execute the schedule management plan • Analyze schedule variation.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Build sequence (predictive):<\/strong> define activities (from work packages) → sequence (network diagram) → estimate durations → develop schedule → baseline.\n- <strong>Dependencies:<\/strong>\n  - <strong>Mandatory<\/strong> (hard logic — physics/contract), <strong>Discretionary<\/strong> (preferred order — your flexibility reserve), <strong>External<\/strong> (outside parties), <strong>Internal<\/strong>.\n  - Relationship types: <strong>FS<\/strong> (finish-to-start, the default), SS, FF, SF (rare). <strong>Lead<\/strong> = accelerate successor (overlap); <strong>lag<\/strong> = imposed wait (curing concrete).\n- <strong>Critical path method (CPM):<\/strong> longest path through the network = shortest possible project duration; activities on it have <strong>zero total float<\/strong>. <strong>Total float<\/strong> = how long an activity can slip without moving the project end (LS − ES); <strong>free float<\/strong> = slip without delaying the next activity. Forward pass gives ES/EF; backward pass gives LS/LF. Near-critical paths deserve monitoring too.\n- <strong>Compression (when the date must come in):<\/strong>\n  - <strong>Crashing<\/strong> — add resources/cost to critical-path activities (cheapest crash-cost-per-time-saved first). Trades <strong>cost<\/strong>.\n  - <strong>Fast-tracking<\/strong> — overlap activities normally sequential. Trades <strong>risk<\/strong> (rework).\n  - Only compressing the <strong>critical path<\/strong> shortens the project.\n- <strong>Coordinate beyond your project:<\/strong> shared resources, cross-project dependencies, operational blackout windows (e.g., retail code freeze) — integrate external milestones into your schedule and communicate through program/portfolio channels.\n- <strong>Use history and benchmarks:<\/strong> past actuals, industry benchmarks, and team velocity trump gut feel; estimate with three-point/PERT where uncertainty is high; beware padding — visible contingency (schedule reserve) beats hidden buffers.\n- <strong>Baseline &amp; manage:<\/strong> the approved schedule baseline is the yardstick; execution follows the schedule management plan (update cycle, tools, thresholds); <strong>analyze variation<\/strong> — SPI/SV (from II-6), milestone slippage, trend analysis — determine cause, forecast, act (corrective action or change request).\n- <strong>Agile scheduling:<\/strong> relative estimation in <strong>story points<\/strong> (planning poker builds shared understanding); <strong>velocity<\/strong> (points/sprint) forecasts empirically: remaining points ÷ velocity ≈ sprints left; <strong>burndown<\/strong> (work remaining) and <strong>burnup<\/strong> (work done vs. total — shows scope growth) charts; kanban flow metrics (cycle time, throughput); roadmap and release plan give longer horizons without fake precision.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Must finish 3 weeks earlier, cost is available\" → <strong>crash<\/strong>; \"…no extra budget\" → <strong>fast-track<\/strong> (accept risk); either way, only on the critical path, via change control if the baseline moves.\n- Float questions: an activity with 5 days total float slips 7 → project end slips 2 (and the critical path may shift).\n- Agile forecast questions: divide remaining backlog by average velocity — resist \"just work faster.\"\n- A dependency on another project slips → assess impact on your critical path, coordinate at the right level, adjust with proper process.<\/p>", "cards": [{"front": "Critical path", "back": "Longest path; zero float; defines project duration"}, {"front": "Total vs. free float", "back": "Slip without delaying project end vs. next activity"}, {"front": "FS/SS/FF/SF", "back": "Dependency relationship types; FS is default"}, {"front": "Lead / lag", "back": "Overlap successor / imposed wait"}, {"front": "Crashing", "back": "Add cost to shorten critical path"}, {"front": "Fast-tracking", "back": "Overlap sequential work; adds rework risk"}, {"front": "Velocity", "back": "Story points completed per sprint; empirical forecast basis"}, {"front": "Burndown / burnup", "back": "Remaining work / completed vs. total (exposes scope change)"}, {"front": "Milestone", "back": "Zero-duration significant point/decision"}], "prompts": ["Define total float and free float; what is the float on the critical path?", "Crash vs. fast-track: what each trades, when each is chosen.", "Backlog holds 120 points; velocity averages 24; how many sprints remain, and what caveats accompany the forecast?", "Give one example each of mandatory, discretionary, and external dependency.", "Why does a burnup chart reveal what a burndown can hide?"], "questions": [{"stem": "The sponsor needs the launch two weeks earlier. The critical path runs through activities that cannot overlap for safety reasons, but additional certified technicians are available at a cost. What should the PM do?", "options": ["Fast-track the critical-path activities", "Evaluate crashing the critical path — adding technicians where they genuinely shorten durations — and submit the cost/schedule trade-off through change control", "Reduce testing scope to save time", "Start non-critical activities earlier"], "answer": 1, "rationale": "Overlap is barred (no fast-tracking), resources exist → crashing, with cost impact through proper approval. A violates the safety constraint; C cuts quality; D doesn't shorten the project (non-critical work doesn't drive the end date)."}, {"stem": "An agile team's burndown looks flat while the burnup shows completed work rising steadily. The MOST likely explanation is:", "options": ["The team has stopped delivering", "Scope is being added to the sprint/release at roughly the pace work completes", "Velocity is miscalculated", "The definition of done is too strict"], "answer": 1, "rationale": "Burnup separates the total-scope line from the done line: rising scope offsets rising completion, flattening remaining-work. A contradicts the burnup; C/D are speculative without evidence."}, {"stem": "Activity D has 4 days of total float. Its owner reports a 6-day delay. The critical path previously ran elsewhere. What is the immediate consequence?", "options": ["No impact — D has float", "The project finish slips 6 days", "The project finish slips ~2 days, and the critical path may now run through D — reanalyze the network", "Free float absorbs the difference"], "answer": 2, "rationale": "<p>Delay beyond total float pushes the end date by the excess (6 − 4 = 2) and can re-route the critical path; the PM re-runs the analysis, then acts. A ignores the overrun; B ignores the float; D confuses float types.<\/p>\n<hr />"}]}, {"id": "II_9", "kind": "task", "dom": "d2", "code": "II-9", "label": "II-9 · Evaluate Project Status", "nav": "II-9 Evaluate Project Status", "title": "Evaluate Project Status", "prose": "<p><strong>🎯 Why this matters.<\/strong> You can't manage what you can't see. This task is the project's instrument panel: metrics, artifacts, progress assessment, and status communication — done continuously and tailored.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Develop project metrics, analysis, and reconciliation • Identify and tailor needed artifacts • Help ensure artifacts are created, reviewed, updated, documented • Help ensure artifact accessibility • Assess current progress • Measure, analyze, update metrics • Communicate status • Continually assess artifact-management effectiveness.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Metrics that matter:<\/strong> choose measures tied to objectives and decisions — schedule (SPI, milestone variance, cycle time), cost (CPI, burn rate), scope/delivery (velocity, throughput, requirements stability), quality (defect density, escaped defects), risk (exposure trend), value/benefits (adoption, satisfaction), team health. Balance <strong>leading indicators<\/strong> (predict — velocity trend, risk burndown) with <strong>lagging<\/strong> (confirm — actual cost, delivered benefits). Beware <strong>vanity metrics<\/strong> (look good, inform nothing) and metric gaming (what you measure is what you get — Goodhart's law); reconcile data across sources so one version of truth exists.\n- <strong>Artifacts, tailored:<\/strong> only maintain artifacts that earn their keep in this context — a two-person internal effort doesn't need the artifact set of a regulated program. Typical set: charter/vision, plan or roadmap+backlog, registers (risk, stakeholder, issues, lessons), baselines or release plan, status/dashboards, decision log. Tailoring is explicit ECO language: <em>identify and tailor needed artifacts<\/em>.\n- <strong>Artifact hygiene:<\/strong> created → reviewed → updated → documented, with version control and named owners; <strong>accessible<\/strong> to those who need them (shared repository, permissions, discoverability — an unread register is decoration). Periodically ask: is our artifact management still effective, or are we feeding zombie documents?\n- <strong>Assess progress honestly:<\/strong> compare actuals to baseline/forecast (EVM — II-6), inspect increments (agile reviews), walk the board, examine trends not snapshots. Percent-complete claims deserve skepticism (the 90%-done syndrome); prefer objective completion criteria (done/not-done against definition of done, milestones passed).\n- <strong>Communicate status:<\/strong> right altitude per audience (I-8): dashboards for executives (RAG status, trends, forecasts, decisions needed), detail for the team; visual, current, honest — including bad news with options.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Predictive:<\/em> performance reviews against baselines; variance and trend analysis; forecast updates (EAC).\n- <em>Agile:<\/em> empirical status — the working increment is the primary measure of progress; boards, burn charts, and reviews broadcast state continuously.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Reports say 90% complete for three cycles\" → dig into <strong>objective measures<\/strong> and root causes — don't accept subjective percentages.\n- \"Stakeholders each hold different numbers\" → <strong>reconcile to a single trusted source<\/strong> and fix the data flow, not just this report.\n- Artifact answers: tailor to context; more documents ≠ more control.<\/p>", "cards": [{"front": "Leading vs. lagging indicator", "back": "Predicts outcomes vs. confirms results"}, {"front": "Vanity metric", "back": "Impressive but decision-useless number"}, {"front": "RAG status", "back": "Red/Amber/Green summary — pair with trend and forecast"}, {"front": "Decision log", "back": "Record of decisions, rationale, owners — kills re-litigation"}, {"front": "90% syndrome", "back": "Subjective progress stalls near-done; use objective criteria"}, {"front": "Single source of truth", "back": "One reconciled data set behind all reporting"}], "prompts": ["Name three leading and three lagging indicators you'd track on your current project.", "What makes an artifact worth keeping? What kills its value?", "Why is a working increment stronger evidence than a status report?", "Two dashboards disagree on spend. Sequence your response."], "questions": [{"stem": "A workstream has reported \"on track — 85–90% complete\" for four consecutive weeks while downstream teams say inputs haven't arrived. What should the PM do FIRST?", "options": ["Mark the workstream red and inform the sponsor", "Review objective completion evidence with the workstream lead (done deliverables vs. criteria), identify the real status and root cause, then update reporting and act on impacts", "Extend the workstream's deadline to relieve pressure", "Require daily written status from the lead"], "answer": 1, "rationale": "<p>Replace subjective percentages with objective evidence, find the cause, then correct status and plan. A reports before verifying; C acts without diagnosis; D adds reporting burden, not truth.<\/p>\n<hr />"}]}, {"id": "II_10", "kind": "task", "dom": "d2", "code": "II-10", "label": "II-10 · Manage Project Closure", "nav": "II-10 Manage Project Closure", "title": "Manage Project Closure", "prose": "<p><strong>🎯 Why this matters.<\/strong> Closure converts a delivered output into an operating capability and organizational learning — and protects everyone by formally ending obligations. Projects (and phases) also close early when the value case dies; closing well then is a success, not a failure.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Obtain stakeholder approval of project completion • Determine criteria to successfully close the project or phase • Validate readiness for transition (to operations or next phase) • Conclude closing activities (final lessons learned/retrospectives, procurement, financials, resources).<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Closure criteria first:<\/strong> define what \"closable\" means before the end — acceptance criteria met and signed, exit criteria per phase gate, contractual completion terms, benefits-measurement handover in place. In agile, \"done\" is continuous, but release/project closure still needs explicit completion definition.\n- <strong>Formal acceptance:<\/strong> obtain documented approval from the customer/sponsor against agreed criteria. Verbal \"looks fine\" is a trap; get it in writing.\n- <strong>Transition readiness:<\/strong> operations must be able to <em>run<\/em> the deliverable — training done, documentation/runbooks delivered, support model and SLAs in place, warranty/hypercare period defined, data migrated, access transferred. A transition checklist and readiness review protect against the \"thrown over the wall\" failure.\n- <strong>Administrative closure bundle:<\/strong>\n  - <strong>Procurements:<\/strong> verify all contract obligations met, resolve claims, final payments, close contracts, archive records, final vendor evaluations.\n  - <strong>Financials:<\/strong> final cost reconciliation, close cost codes, return unused reserves, report final financial performance.\n  - <strong>Resources:<\/strong> release people gracefully (with recognition and feedback), return equipment/facilities.\n  - <strong>Knowledge:<\/strong> final lessons learned / project retrospective; update the register and <strong>archive to OPAs<\/strong>; index artifacts so future projects can find them (link to I-7, III-6).\n  - <strong>Benefits:<\/strong> confirm the benefits-realization plan owner and measurement schedule (value is often proven after closure — II-3).\n- <strong>Early termination:<\/strong> when governance kills a project (value collapse, strategy change), execute the same closure discipline — document state, formally close contracts and finances, capture lessons; never just abandon.\n- <strong>Phase closure:<\/strong> each phase-gate close is a mini-closure: validate exit criteria, decide continue/change/stop, capture lessons now (not just at the end).<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Project done, team already reassigned, what was missed?\" → <strong>formal acceptance, lessons learned, contract/financial closure, archiving<\/strong> — closure steps are favorite \"what did the PM forget\" material.\n- Closure <strong>order logic:<\/strong> confirm acceptance/completion criteria → transition → close procurements/finances → lessons → release resources → archive → celebrate.\n- Cancelled project → still perform closure (document, close contracts, lessons learned).<\/p>", "cards": [{"front": "Formal acceptance", "back": "Documented customer/sponsor sign-off against criteria"}, {"front": "Transition readiness", "back": "Ops can run it: training, docs, support model, hypercare"}, {"front": "Administrative closure", "back": "Contracts, finances, resources, records, lessons — all concluded"}, {"front": "Final lessons learned / retrospective", "back": "Capture and archive knowledge to OPAs"}, {"front": "Early termination", "back": "Governance-directed stop — still requires full closure"}, {"front": "Hypercare", "back": "Elevated post-launch support window"}], "prompts": ["List six items on your administrative-closure checklist from memory.", "Why is closing a cancelled project non-optional? Name three exposures if skipped.", "What evidence proves \"transition readiness\"? Give four items.", "When are lessons learned captured on a healthy project? (Trick: not only at closure.)"], "questions": [{"stem": "The deliverable passed all acceptance tests and users are live. The sponsor says \"great, we're done — release the team.\" What should the PM do?", "options": ["Release the team immediately as instructed", "Explain the remaining closure work — formal acceptance sign-off, transition/hypercare confirmation, contract and financial closure, lessons learned, archiving — and complete it before releasing resources", "Keep the full team until benefits are realized", "Hand closure to the PMO and exit"], "answer": 1, "rationale": "Live-in-production ≠ closed; the closure bundle protects the organization and captures learning. A skips obligations; C misreads benefits ownership (post-project owner measures); D abdicates PM accountability."}, {"stem": "Governance terminates your project at 60% complete after a strategic pivot. What should the PM do?", "options": ["Archive current files and disband", "Negotiate to finish the nearest milestone first", "Execute structured early closure: document the state of work, formally close contracts (per termination clauses) and financials, capture lessons learned, transition any usable partial deliverables, and release resources properly", "Appeal the decision to the sponsor"], "answer": 2, "rationale": "<p>Early termination gets full closure discipline — contracts especially (termination clauses, settlement). A is abandonment; B and D resist a governance decision the PM should implement professionally (after ensuring the decision was informed).<\/p>\n<hr />"}]}, {"id": "gridII", "kind": "prose", "dom": "d2", "label": "Domain II — Rapid Recall Grid", "nav": "Rapid recall grid", "html": "<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>One-line essence<\/th>\n<th>Signature tool/technique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Integrate<\/td>\n<td>Size it, choose approach, one coherent living plan<\/td>\n<td>Approach selection factors, PERT, hybrid design<\/td>\n<\/tr>\n<tr>\n<td>2 Scope<\/td>\n<td>Define, agree, break down; guard the boundary<\/td>\n<td>WBS/100% rule, backlog, RTM, DoD<\/td>\n<\/tr>\n<tr>\n<td>3 Value<\/td>\n<td>Prioritize, deliver, and prove value continuously<\/td>\n<td>Business case, MVP, cost of delay, benefits plan<\/td>\n<\/tr>\n<tr>\n<td>4 Resources<\/td>\n<td>Right people/things, right time; optimize flow<\/td>\n<td>Leveling vs. smoothing, RACI, stable teams<\/td>\n<\/tr>\n<tr>\n<td>5 Procurement<\/td>\n<td>Buy smart; contracts allocate risk; manage vendors<\/td>\n<td>Contract-type slider, BATNA, SOW<\/td>\n<\/tr>\n<tr>\n<td>6 Finance<\/td>\n<td>Fund, reserve, track, forecast, govern variances<\/td>\n<td>EVM formulas, contingency vs. management reserve<\/td>\n<\/tr>\n<tr>\n<td>7 Quality<\/td>\n<td>Prevent &gt; inspect; CoQ incl. sustainability<\/td>\n<td>Fishbone, Pareto, control charts, DoD<\/td>\n<\/tr>\n<tr>\n<td>8 Schedule<\/td>\n<td>Sequence, baseline, compress wisely, forecast empirically<\/td>\n<td>CPM/float, crash vs. fast-track, velocity/burn charts<\/td>\n<\/tr>\n<tr>\n<td>9 Status<\/td>\n<td>Honest instruments, tailored artifacts, one truth<\/td>\n<td>Leading/lagging metrics, dashboards, EVM<\/td>\n<\/tr>\n<tr>\n<td>10 Closure<\/td>\n<td>Accept, transition, conclude, learn — always<\/td>\n<td>Closure checklist, lessons to OPAs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "domIII", "kind": "prose", "dom": "d3", "label": "Domain III — Business Environment", "nav": "Domain III overview", "html": "<h2>Advance Organizer — The Story of This Domain<\/h2>\n<p>Business Environment situates the project inside the organization and the world. You set up <strong>governance<\/strong> (Task 1) and keep the project <strong>compliant<\/strong> (2); you handle change through <strong>change control<\/strong> (3) and clear the road of <strong>impediments and issues<\/strong> (4); you manage <strong>risk<\/strong> end-to-end (5) and drive <strong>continuous improvement<\/strong> (6); and you connect the project to its context — supporting <strong>organizational change<\/strong> (7) and scanning the <strong>external environment<\/strong> (8). Arc: <em>rules → obstacles → uncertainty → learning → context.<\/em><\/p>"}, {"id": "III_1", "kind": "task", "dom": "d3", "code": "III-1", "label": "III-1 · Define and Establish Project Governance", "nav": "III-1 Define and Establish Project Governance", "title": "Define and Establish Project Governance", "prose": "<p><strong>🎯 Why this matters.<\/strong> Governance is the decision-making architecture: who decides what, against which criteria, escalated how. Without it, every exception becomes a negotiation; with it, the project moves fast within clear guardrails.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Describe and establish structure, rules, procedures, reporting, ethics, and policies using OPAs • Define success metrics • Outline governance escalation paths and thresholds.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>What governance covers (PMBOK 8 Governance Performance Domain):<\/strong> decision rights and authority levels, steering committee/board composition and cadence, stage-gate or review structure, policies and ethics standards, reporting requirements, change-control authority, tolerances/thresholds. Build it from <strong>OPAs<\/strong> — org governance frameworks, templates, methodologies — tailored to project size/risk.\n- <strong>Success metrics defined up front:<\/strong> governance needs objective yardsticks — delivery metrics (schedule/cost/scope), quality metrics, and <strong>value/benefit metrics<\/strong> aligned to the 2026 success definition. Ambiguous success criteria = ungovernable project.\n- <strong>Escalation paths and thresholds:<\/strong> define <em>in advance<\/em> which variances the PM handles (tolerance), which go to the sponsor, which to the steering committee — e.g., \"PM may approve schedule changes ≤5 days; beyond that, CCB.\" Thresholds convert drama into routine: breach → analysis → escalate with options → decision recorded.\n- <strong>Ethics:<\/strong> governance embeds the PMI Code of Ethics pillars — <strong>responsibility, respect, fairness, honesty<\/strong>. Report truthfully, avoid conflicts of interest, never falsify, respect confidentiality. Ethics questions have zero-tolerance answers: the ethical option wins even at project cost.\n- <strong>Governance in agile:<\/strong> lighter but real — product owner decision rights, definition of done as a quality policy, release governance, spending guardrails per increment; governance enables flow rather than gating everything.\n- <strong>Predictive extras (PMBOK 8 notes additional considerations):<\/strong> phase gates as formal governance checkpoints, baselined tolerances, formal CCB structures.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Who should decide X?\" → follow the <strong>documented escalation thresholds<\/strong>; the PM decides inside tolerance, escalates with analysis and options beyond it.\n- \"Sponsor asks you to adjust the numbers to look better\" → refuse; report accurately (honesty pillar). Always.\n- Setting up a project in a weak-process organization → <strong>draw on OPAs and establish governance early<\/strong>, don't improvise per incident.<\/p>", "cards": [{"front": "Project governance", "back": "Framework of decision rights, oversight, policies, reporting"}, {"front": "Steering committee", "back": "Senior decision body for escalations and major changes"}, {"front": "Tolerance / threshold", "back": "Variance band the PM may manage before escalating"}, {"front": "Phase gate", "back": "Formal continue/change/stop review between phases"}, {"front": "PMI Code of Ethics", "back": "Responsibility, respect, fairness, honesty"}, {"front": "Decision rights", "back": "Explicit map of who may decide what"}], "prompts": ["Name six elements a governance framework should specify.", "What are the four PMI ethics pillars? Give one behavior per pillar.", "Why must success metrics be set at governance setup rather than at closure?", "Cost variance hits 12% against a 10% escalation threshold — script your next steps."], "questions": [{"stem": "Kicking off a strategic project in a division with no formal PM practices, the PM's BEST first governance move is to:", "options": ["Adopt the full corporate methodology unmodified", "Use organizational process assets as the base and tailor a governance framework — decision rights, reporting, thresholds, gate structure — proportionate to the project's size and risk, agreed with the sponsor", "Skip governance to stay agile", "Let the steering committee design governance after the first incident"], "answer": 1, "rationale": "ECO enabler verbatim: establish structure/rules/reporting via OPAs, tailored, with defined escalation. A ignores tailoring; C confuses agility with anarchy; D is governance-by-crisis."}, {"stem": "The sponsor asks the PM to hold back a known compliance risk from the steering pack \"until we have a fix.\" What should the PM do?", "options": ["Comply — the sponsor owns stakeholder communication", "Report the risk accurately through the defined governance reporting, while working the mitigation with the sponsor", "Report it anonymously to the committee chair", "Delay one cycle to attempt a fix first"], "answer": 1, "rationale": "<p>Honesty and defined reporting duties are non-negotiable; transparency and mitigation are not mutually exclusive. A, D suppress material information; C dodges professional accountability.<\/p>\n<hr />"}]}, {"id": "III_2", "kind": "task", "dom": "d3", "code": "III-2", "label": "III-2 · Plan and Manage Project Compliance", "nav": "III-2 Plan and Manage Project Compliance", "title": "Plan and Manage Project Compliance", "prose": "<p><strong>🎯 Why this matters.<\/strong> Compliance failures don't just cost rework — they cost licenses, lawsuits, safety, and reputations. 2026 lists security, health &amp; safety, <strong>sustainability<\/strong>, and regulatory compliance explicitly.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Confirm compliance requirements (security, H&amp;S, sustainability, regulatory) • Classify compliance categories • Determine potential threats to compliance • Use methods to support compliance • Analyze consequences of noncompliance • Determine approach/actions to address needs • Measure the extent of compliance.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Confirm requirements early:<\/strong> inventory every applicable obligation — laws/regulations (privacy like GDPR, industry rules, environmental law), standards (ISO, safety codes), contractual commitments, internal policies (security, ethics), and <strong>sustainability commitments<\/strong> (emissions, waste, labor practices). Consult legal/compliance experts; ignorance is not a defense.\n- <strong>Classify into categories<\/strong> (security, H&amp;S, environmental/sustainability, financial/regulatory, data privacy, quality/certification) so each gets an owner, method, and measurement — classification turns a scary blob into manageable workstreams.\n- <strong>Threats to compliance:<\/strong> where could we drift? — process shortcuts under schedule pressure, vendor noncompliance flowing up to you, scope changes that trigger new obligations, new regulation mid-project (III-8 link). Treat compliance threats as risks in the register (III-5) with responses.\n- <strong>Methods to support compliance:<\/strong> embed requirements into quality plans and the definition of done (II-7), training and awareness, audits and inspections, traceability documentation, segregation of duties, tollgates/sign-offs, automated checks (e.g., security scanning), and flow-down clauses in contracts (II-5).\n- <strong>Consequences analysis:<\/strong> quantify what noncompliance costs — fines, stop-work orders, criminal exposure, contract termination, injuries, reputational harm — this powers prioritization (compliance work rarely loses a cost-of-delay contest, see II-3 Q1).\n- <strong>Measure compliance:<\/strong> audit results, findings open/closed, control test pass rates, incident counts, certification status — reported through governance (III-1). \"Are we compliant?\" must be answerable with evidence at any time.\n- <strong>When you discover noncompliance:<\/strong> contain/stop the affected work if needed, assess scope and consequences, notify per legal/governance obligations, remediate root cause, document. Never conceal, never \"fix quietly\" where disclosure is required.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Discovering a violation → <strong>assess and address through proper channels immediately<\/strong> — options that delay, hide, or \"wait for the audit\" are wrong.\n- New regulation announced mid-project → <strong>analyze applicability and impact<\/strong>, then update plans/backlog through change control (bridges III-8 and III-3).\n- Deadline pressure vs. safety/compliance step → compliance wins; present schedule alternatives instead (see II-7 Q2 pattern).<\/p>", "cards": [{"front": "Compliance requirement", "back": "Obligation from law, regulation, standard, contract, or policy"}, {"front": "Compliance category", "back": "Grouping (security, H&amp;S, sustainability, privacy…) enabling ownership and measurement"}, {"front": "Audit", "back": "Structured, evidence-based examination of conformance"}, {"front": "Flow-down clause", "back": "Contract term passing your compliance duties to suppliers"}, {"front": "Noncompliance consequence analysis", "back": "Quantified downside: fines, stop-work, liability, reputation"}, {"front": "Tollgate / sign-off", "back": "Mandatory checkpoint proving obligations met before proceeding"}], "prompts": ["Name the four compliance areas the 2026 ECO calls out, plus two more common categories.", "List five methods that <em>support<\/em> compliance during execution.", "You discover a data-privacy breach in a vendor's handling of project data — sequence your first four actions.", "How do compliance requirements physically enter the quality plan and the definition of done?"], "questions": [{"stem": "During execution, a team member reveals that a required environmental assessment was skipped to save time in an earlier phase. What should the PM do FIRST?", "options": ["Continue — the phase already passed its gate", "Assess the compliance breach's scope and consequences, halt affected work if warranted, and initiate remediation and required notifications through governance/legal channels", "Document it in lessons learned for future projects", "Ask the team member to keep it confidential while a fix is explored"], "answer": 1, "rationale": "Active noncompliance = assess, contain, remediate, disclose per obligations. A/C normalize a violation; D is concealment — an ethics breach compounding the compliance breach."}, {"stem": "Your project spans three countries with differing data-residency laws. The BEST planning action is to:", "options": ["Apply the strictest country's rules to everything to be safe", "Confirm and classify each jurisdiction's requirements with legal/compliance experts, design the solution and processes to meet each, embed checks into quality/DoD, and define compliance metrics and audit points", "Store data centrally and address objections if raised", "Delegate the entire topic to the vendor"], "answer": 1, "rationale": "<p>The full enabler chain: confirm → classify → methods → measure. A can be a valid tactic but is chosen <em>after<\/em> analysis (it may be impossible where laws conflict or is needlessly costly); C is negligent; D — accountability can't be outsourced (flow-down helps, ownership remains).<\/p>\n<hr />"}]}, {"id": "III_3", "kind": "task", "dom": "d3", "code": "III-3", "label": "III-3 · Manage and Control Changes", "nav": "III-3 Manage and Control Changes", "title": "Manage and Control Changes", "prose": "<p><strong>🎯 Why this matters.<\/strong> Change is certain; chaos is optional. This task tests the discipline of the change process — and knowing which change process the approach implies.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Execute the change control process • Communicate the status of proposed changes • Implement approved changes • Update project documentation to reflect changes.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>The predictive change flow (know it as a reflex):<\/strong>\n  1. Change identified → documented as a <strong>change request<\/strong> (anyone can raise one).\n  2. <strong>Assess impact<\/strong> across scope, schedule, cost, quality, resources, risk, procurement — the PM's analysis duty <em>before<\/em> any decision.\n  3. Decision by the defined authority (<strong>CCB<\/strong>/sponsor per governance thresholds — III-1): approve / reject / defer.\n  4. <strong>Communicate the decision and status<\/strong> to the requester and affected stakeholders (an ECO enabler in its own right — silent change logs breed shadow expectations).\n  5. <strong>Implement<\/strong> approved changes; update baselines, plans, and documents (<strong>change log<\/strong>, requirements docs, schedules, registers) so the paper matches reality.\n- <strong>Change request flavors:<\/strong> corrective action (realign to plan), preventive action (avert deviation), defect repair, and updates.\n- <strong>Sources of change:<\/strong> stakeholder requests, risk responses, regulation (III-2/III-8), errors/omissions, value re-prioritization (II-3).\n- <strong>Agile change:<\/strong> change is welcomed structurally — new/changed needs go to the <strong>product owner<\/strong>, who reprioritizes the <strong>backlog<\/strong>; within a sprint, the sprint goal is protected (urgent items wait for the next sprint or, exceptionally, the PO renegotiates scope with the team). No CCB for product scope — but budget/timeline/contract-level changes may still ride formal governance.\n- <strong>Hybrid:<\/strong> define explicitly which changes follow which path — a favorite source of real-world (and exam) confusion.\n- <strong>The cardinal sins:<\/strong> implementing changes without approval, skipping impact analysis, verbally approving scope, forgetting to update documents/baselines, not telling affected stakeholders.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Sponsor/customer demands an immediate change → even for the sponsor: <strong>document, assess impact, route to the proper authority<\/strong> — the PM never bypasses the process, and never flatly refuses either.\n- \"Team already built the change a stakeholder asked for directly\" → stop the bypass, assess the impact now, take it through change control, and coach on the process.\n- \"Emergency in production\" → many orgs define an expedited/emergency change path — use the <em>defined<\/em> fast lane, then complete documentation; improvised bypass is still wrong.<\/p>", "cards": [{"front": "Change request", "back": "Formal proposal to modify baselines/documents/deliverables"}, {"front": "CCB", "back": "Change control board — the decision authority per governance"}, {"front": "Impact analysis", "back": "Cross-constraint assessment before any change decision"}, {"front": "Change log", "back": "Status record of all requests: raised, assessed, decided, implemented"}, {"front": "Corrective vs. preventive action", "back": "Fix a deviation vs. prevent one"}, {"front": "Sprint goal protection", "back": "In-sprint scope stability; changes enter via backlog"}], "prompts": ["Recite the five-step predictive change flow.", "Who approves what? Relate change authority to governance thresholds.", "How does a \"changed requirement\" travel in scrum vs. in a predictive baseline?", "Name the four change-request flavors and an example of each."], "questions": [{"stem": "The client's operations head emails a developer asking for an \"urgent small tweak,\" and the developer implements it the same day. The PM discovers it a week later. What should the PM do FIRST?", "options": ["Revert the change immediately", "Assess the implemented change's impact on scope, schedule, cost, quality, and risk; then process it retroactively through change control and reinforce the process with the team and client", "Discipline the developer", "Inform the CCB that no action is needed since the client requested it"], "answer": 1, "rationale": "Reality first: understand what the change did, then regularize it through the process and fix the bypass behavior. A may cause harm without analysis; C blames before fixing the system; D whitewashes a control failure."}, {"stem": "The CCB approves a scope change adding two weeks and $40k. What must the PM do NEXT?", "options": ["Wait for the sponsor to announce it", "Update the affected baselines, plans, and documents; communicate the change and its impacts to affected stakeholders; and direct implementation of the change", "Reopen the business case", "Log it and revisit at the next status meeting"], "answer": 1, "rationale": "<p>Approved → implement + update documentation + communicate status: the ECO's exact enabler trio after decision. A/D let documents and stakeholders drift from reality; C is only needed if value viability is in question.<\/p>\n<hr />"}]}, {"id": "III_4", "kind": "task", "dom": "d3", "code": "III-4", "label": "III-4 · Remove Impediments and Manage Issues", "nav": "III-4 Remove Impediments and Manage Issues", "title": "Remove Impediments and Manage Issues", "prose": "<p><strong>🎯 Why this matters.<\/strong> Impediments quietly tax the team's throughput; issues are risks come true. The servant-leader PM hunts both relentlessly — prioritizing, intervening, and looping stakeholders in.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Evaluate the impact of impediments • Prioritize and highlight impediments • Determine and apply an intervention strategy • Reassess continually so team impediments/obstacles/blockers are addressed • Recognize when a risk becomes an issue • Collaborate with relevant stakeholders to resolve issues.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Vocabulary triangle (test favorite):<\/strong>\n  - <strong>Risk<\/strong> — <em>uncertain<\/em> future event that may affect objectives (may be negative or positive).\n  - <strong>Issue<\/strong> — a <em>current<\/em> problem, happening now, needing resolution.\n  - <strong>Impediment / blocker / obstacle<\/strong> — anything slowing (impediment) or fully stopping (blocker) the team's progress; a species of issue focused on team flow.\n  - The moment a risk <strong>materializes<\/strong>, it becomes an <strong>issue<\/strong>: execute the planned response (if any), log it in the <strong>issue log<\/strong>, assign an owner and due date, and manage to closure. Update the risk register accordingly.\n- <strong>Make impediments visible:<\/strong> surfaced at daily standups, on an impediment board/issue log — hiding blockers is the anti-pattern; the environment must make raising them safe (psychological safety again).\n- <strong>Evaluate and prioritize:<\/strong> impact on sprint goal/critical path/value, number of people blocked, time sensitivity, escalation cost. Not all impediments deserve immediate PM firepower — triage.\n- <strong>Intervention strategies by type:<\/strong> resolve directly (approvals, tooling, access), negotiate across teams (dependencies, shared resources), coach the team to self-resolve (skill/process issues), or <strong>escalate<\/strong> to the level that owns the constraint (organizational policy, funding) — escalation with analysis and options is a legitimate tool once the PM's authority is exhausted, not a failure.\n- <strong>Reassess continually:<\/strong> blocked items re-checked daily; issue log reviewed at a set cadence; aging issues escalate automatically; watch for repeat impediments — a recurring blocker is a <strong>process problem<\/strong> (root cause → continuous improvement, III-6).\n- <strong>Collaborate on resolution:<\/strong> issues touching stakeholders get resolved <em>with<\/em> them — jointly agree the approach, owner, and timeline; communicate progress until closed.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"A risk in the register just occurred\" → <strong>execute the planned risk response; it is now an issue<\/strong> — log, own, resolve. If no response was planned: workaround now, then root-cause and register updates.\n- \"Team blocked by another department's approval for a week\" → the PM intervenes (negotiate/escalate the dependency), rather than telling the team to wait or work around it unsafely.\n- Same impediment third sprint running → fix the <strong>system<\/strong> (retrospective → process change), not the instance.<\/p>", "cards": [{"front": "Risk vs. issue", "back": "Uncertain future vs. present problem"}, {"front": "Impediment / blocker", "back": "Slows / fully stops team progress"}, {"front": "Issue log", "back": "Live record: issue, owner, priority, actions, due date, status"}, {"front": "Workaround", "back": "Unplanned response to a materialized risk with no planned response"}, {"front": "Escalation", "back": "Raising to the authority owning the constraint — with analysis and options"}, {"front": "Impediment board", "back": "Visible list keeping blockers unignorable"}], "prompts": ["Define risk, issue, impediment, blocker — one line each — and the transition event between the first two.", "What fields belong in an issue-log entry?", "When is escalation the <em>right<\/em> answer? What must accompany it?", "A blocker recurs every sprint. Contrast the wrong response with the right one."], "questions": [{"stem": "A supplier-delay risk in your register (with a planned alternate-supplier response) has just occurred. What should the PM do FIRST?", "options": ["Add the delay to the issue log and convene a brainstorming session for solutions", "Execute the planned risk response (engage the alternate supplier), log the issue with an owner, and update the risk register and stakeholders", "Submit a change request to extend the schedule", "Escalate to the sponsor for direction"], "answer": 1, "rationale": "That's exactly why responses are pre-planned; recognize the risk→issue transition and act on the plan, with logging and communication. A re-solves a solved problem; C may follow <em>if<\/em> impact analysis warrants; D escalates what the plan already covers."}, {"stem": "The team has been blocked for four days awaiting security approval from another department; the sprint goal is at risk. The PM has emailed twice with no reply. What NEXT?", "options": ["Tell the team to proceed without approval to protect the sprint", "Directly engage the approving manager (call/meet) to negotiate expedited review; if unresolved, escalate promptly through the defined path with impact analysis", "Move the blocked stories to the next sprint and continue", "Raise it in the retrospective at sprint end"], "answer": 1, "rationale": "<p>Intervene actively and escalate through the defined path when direct negotiation stalls — with impact stated. A violates compliance/security; C surrenders the goal before exhausting intervention; D reflects instead of acting.<\/p>\n<hr />"}]}, {"id": "III_5", "kind": "task", "dom": "d3", "code": "III-5", "label": "III-5 · Plan and Manage Risk", "nav": "III-5 Plan and Manage Risk", "title": "Plan and Manage Risk", "prose": "<p><strong>🎯 Why this matters.<\/strong> Risk management is uncertainty management — the difference between projects that get surprised and projects that get options. 2026 flags security and sustainability risks explicitly.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify risks • Analyze risks • Monitor and control risks • Develop a risk management plan • Maintain a risk register (e.g., poor IT security) • Execute the risk management plan (e.g., responses for security and sustainability risks) • Communicate risk-impact status.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Risk = uncertainty that matters:<\/strong> an uncertain event/condition that, if it occurs, affects objectives — <strong>threats<\/strong> (negative) <em>and<\/em> <strong>opportunities<\/strong> (positive). Individual risks vs. <strong>overall project risk<\/strong> (the whole project's uncertainty exposure). Distinguish risk <strong>appetite/tolerance/thresholds<\/strong> (how much uncertainty stakeholders will accept — set in the risk management plan and governance).\n- <strong>Risk management plan:<\/strong> methodology, roles, funding (ties to reserves — II-6), timing/cadence, risk categories (<strong>RBS<\/strong> — risk breakdown structure: technical, external, organizational, PM…; add security and sustainability categories per 2026), probability-impact definitions and the P×I matrix, reporting formats.\n- <strong>Identify — everyone, continuously:<\/strong> brainstorming, interviews, checklists/prompt lists (e.g., PESTLE for external — political, economic, social, technological, legal, environmental), assumptions-and-constraints analysis (each assumption is a risk in disguise), SWOT, lessons learned, expert judgment. Write risks in cause–event–effect form (\"Because X, Y may occur, leading to Z\"). Log in the <strong>risk register<\/strong> (risk, causes, owners, scores, responses, triggers, status) — a living document.\n- <strong>Qualitative analysis (always):<\/strong> score probability × impact; rank; assess urgency, detectability, proximity; heat-map the register; watchlist the low ones.\n- <strong>Quantitative analysis (large/complex projects, selectively):<\/strong> numeric modeling of combined risk — <strong>EMV<\/strong> (probability × monetary impact; sums support contingency sizing and decision trees), Monte Carlo simulation (schedule/cost outcome distributions), sensitivity analysis (tornado diagram — which risks move outcomes most).\n- <strong>Response strategies (memorize both sets):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Threats<\/th>\n<th>Opportunities<\/th>\n<th>Essence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Avoid<\/strong><\/td>\n<td><strong>Exploit<\/strong><\/td>\n<td>Eliminate uncertainty / make it certain<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer<\/strong><\/td>\n<td><strong>Share<\/strong><\/td>\n<td>Shift/allocate to third party (insurance, contract) / partner to capture<\/td>\n<\/tr>\n<tr>\n<td><strong>Mitigate<\/strong><\/td>\n<td><strong>Enhance<\/strong><\/td>\n<td>Reduce P or I / increase P or I<\/td>\n<\/tr>\n<tr>\n<td><strong>Accept<\/strong><\/td>\n<td><strong>Accept<\/strong><\/td>\n<td>Take it (passively, or actively with contingency)<\/td>\n<\/tr>\n<tr>\n<td><strong>Escalate<\/strong><\/td>\n<td><strong>Escalate<\/strong><\/td>\n<td>Beyond project scope/authority → program/portfolio owns it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Every non-accepted risk gets an <strong>owner<\/strong> and defined <strong>trigger conditions<\/strong>; responses can carry <strong>secondary risks<\/strong> (new risks the response creates) and leave <strong>residual risk<\/strong>.\n- <strong>Monitor &amp; control:<\/strong> track triggers, execute responses when warranted, reassess scores, identify new risks at a defined rhythm (risk reviews; every iteration in agile), audit response effectiveness, watch reserve burn vs. risk burn-down. Risk → issue transition handled per III-4.\n- <strong>Communicate:<\/strong> risk exposure, top risks, trend, and response status reported per governance — plain language, decision-oriented (\"here's what we need from you\").\n- <strong>Agile risk:<\/strong> short iterations <em>are<\/em> risk management (fast feedback shrinks uncertainty); risk-adjusted backlog (tackle risky/spike items early), spikes (time-boxed experiments to kill uncertainty), risk burndown charts, retros surface emergent risks.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Buy insurance / add penalty clause / outsource risky work → <strong>transfer<\/strong>. Choose a proven design over novel → <strong>avoid<\/strong> or <strong>mitigate<\/strong> (eliminated vs. reduced — read carefully). Add contingency time/money and proceed → <strong>active acceptance<\/strong>.\n- EMV mini-math: 30% × −$50k = −$15k exposure; sum EMVs to sanity-check contingency.\n- \"New risk identified late in the project\" → analyze and respond via the process — never \"too late to bother.\"\n- Positive-risk stems (\"chance to finish early and win a bonus\") → apply the opportunity strategies, don't force threat vocabulary.<\/p>", "cards": [{"front": "Risk register", "back": "Living log: risks, owners, scores, responses, triggers, status"}, {"front": "RBS", "back": "Risk breakdown structure — category hierarchy for identification"}, {"front": "P×I matrix", "back": "Qualitative prioritization heat map"}, {"front": "EMV", "back": "Probability × impact in money; feeds contingency and decision trees"}, {"front": "Monte Carlo", "back": "Simulation producing outcome probability distributions"}, {"front": "Avoid/Transfer/Mitigate/Accept/Escalate", "back": "Threat strategies"}, {"front": "Exploit/Share/Enhance/Accept/Escalate", "back": "Opportunity strategies"}, {"front": "Secondary vs. residual risk", "back": "Created by the response vs. remaining after it"}, {"front": "Trigger", "back": "Pre-defined condition indicating a risk is materializing"}, {"front": "Spike (agile)", "back": "Time-boxed investigation to reduce uncertainty"}], "prompts": ["Recite both five-strategy sets and pair each threat strategy with its opportunity mirror.", "A risk register entry needs which minimum fields?", "EMV drill: 20% chance of −$80k, 50% chance of −$10k, 25% chance of +$40k — total exposure? <em>(−16k −5k +10k = −$11k)<\/em>", "How do short iterations function as a risk-management mechanism?", "Distinguish secondary from residual risk with one example each."], "questions": [{"stem": "Your data-center build faces a 15% probability of a six-week permit delay costing $120,000. The team proposes paying a $10,000 expediting fee that historically cuts the probability to 3%. This response is:", "options": ["Transfer, because money changes hands", "Mitigation — spending to reduce probability; EMV improves from −$18,000 to −$3,600, justifying the $10,000 fee", "Avoidance, because the delay is prevented", "Active acceptance with contingency"], "answer": 1, "rationale": "Probability reduced (not eliminated, not shifted to a third party): mitigation, and the EMV math shows the fee pays for itself. A misreads transfer (no third party bears the risk); C would require elimination; D would mean no action beyond reserves."}, {"stem": "In sprint planning, the team flags deep uncertainty about whether a third-party API can meet latency needs — the architecture depends on it. What is the BEST agile risk response?", "options": ["Assume it works and adjust later if not", "Schedule a time-boxed spike early to test the API against latency requirements before committing the architecture", "Transfer the risk by making the vendor contractually liable", "Document the risk and revisit at the next quarterly review"], "answer": 1, "rationale": "A spike attacks the riskiest assumption earliest and cheapest — agile's native uncertainty killer. A is passive acceptance of a foundational risk; C compensates for failure but doesn't make the architecture work; D lets a proximate risk age."}, {"stem": "A geopolitical development threatens the supply of a component used by your project and by four others in the portfolio. The PM's BEST action is to:", "options": ["Mitigate independently by over-ordering stock", "Escalate the risk to program/portfolio management for a coordinated response, while managing project-level exposure per the risk plan", "Accept the risk — geopolitics exceeds project control", "Transfer via a fixed-price supply contract"], "answer": 1, "rationale": "<p>Beyond project authority and shared across the portfolio → escalate (the fifth strategy) to the owning level; the project still tracks its own exposure. A sub-optimizes and may worsen scarcity; C confuses \"can't control cause\" with \"can't respond\"; D may help but is a decision better coordinated portfolio-wide.<\/p>\n<hr />"}]}, {"id": "III_6", "kind": "task", "dom": "d3", "code": "III-6", "label": "III-6 · Continuous Improvement", "nav": "III-6 Continuous Improvement", "title": "Continuous Improvement", "prose": "<p><strong>🎯 Why this matters.<\/strong> Organizations that learn compound; those that don't repeat. This compact task makes the PM a steward of lessons learned and process evolution — including updating the OPAs everyone else inherits.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Utilize lessons learned • Help ensure continuous improvement processes are updated • Update organizational process assets (OPAs).<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Lessons learned as a cycle, not a ceremony:<\/strong> <em>capture<\/em> throughout (register, retrospectives, post-incident reviews) → <em>apply<\/em> within the same project (change how the next phase/sprint runs) → <em>archive<\/em> to OPAs at phase/project close → <em>consume<\/em> at the start of new work (search OPAs before planning). A lesson unapplied is trivia.\n- <strong>Improvement mechanisms:<\/strong> <strong>retrospectives<\/strong> every iteration (what went well / what didn't / what we'll change — with one or two committed, owned improvement actions, reviewed next time), <strong>PDCA/kaizen<\/strong> loops, quality-review findings (II-7), value-stream thinking (remove waste), experiments with measures.\n- <strong>Keep the improvement process itself current:<\/strong> review whether retrospectives still produce change, whether templates/checklists reflect what the org now knows, whether metrics still drive the right behavior; refresh formats when they go stale (a retro that's a ritual has died).\n- <strong>Update OPAs:<\/strong> feed improved templates, estimating data (actuals!), checklists, risk libraries, vendor evaluations, and lessons into the organizational repository — the PM's gift to every future project. This closes the loop with I-7 (knowledge transfer) and II-10 (closure archiving).<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Retrospectives happen but nothing changes\" → <strong>make improvement actions explicit, owned, and reviewed<\/strong> — treat them as backlog items.\n- \"Where should the PM look before planning estimates for a new project?\" → <strong>OPAs / historical information / lessons learned<\/strong> first.\n- Improvements to <em>organizational<\/em> processes beyond your authority → propose through the PMO/governance, don't unilaterally rewrite the methodology.<\/p>", "cards": [{"front": "Retrospective", "back": "Regular team inspect-and-adapt session producing owned actions"}, {"front": "Kaizen", "back": "Culture of small continuous improvements"}, {"front": "PDCA", "back": "Plan–Do–Check–Act loop"}, {"front": "OPA update", "back": "Feeding templates, actuals, lessons back to the org repository"}, {"front": "Lessons-learned cycle", "back": "Capture → apply → archive → consume"}], "prompts": ["Trace one lesson through the full cycle with a concrete example.", "What makes a retrospective action real rather than performative? (Three attributes.)", "Name six OPA items a closing project should refresh."], "questions": [{"stem": "Reviewing three sprints of retrospective notes, the PM sees the same two improvement ideas raised each time, never implemented. What should the PM do?", "options": ["Stop holding retrospectives until the team is ready to change", "Facilitate the team to convert the recurring ideas into specific, owned, time-boxed improvement actions — tracked visibly (e.g., in the backlog) and reviewed at the next retrospective", "Implement the ideas personally to save team time", "Report the team's resistance to the sponsor"], "answer": 1, "rationale": "<p>Continuous improvement requires actions with owners and follow-up; visibility creates accountability. A abandons the mechanism; C removes team ownership (servant leadership violation); D punishes instead of enabling.<\/p>\n<hr />"}]}, {"id": "III_7", "kind": "task", "dom": "d3", "code": "III-7", "label": "III-7 · Support Organizational Change", "nav": "III-7 Support Organizational Change", "title": "Support Organizational Change", "prose": "<p><strong>🎯 Why this matters.<\/strong> Projects don't just build things — they change how people work. A technically perfect deliverable that nobody adopts delivers zero value; and changes in the organization around you can reshape your project overnight. This task looks both ways.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Assess organizational culture • Evaluate the impact of organizational change on the project and determine required actions.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Direction 1 — the project changes the organization:<\/strong> your deliverable lands in a culture. Assess readiness: leadership sponsorship strength, history with change, capacity (change saturation?), attitudes of affected groups. Support adoption with change-management practice: build the why (vision — I-1), engage impacted stakeholders early (I-4), communicate relentlessly (I-8), train and support, celebrate quick wins, reinforce until the new way sticks. Frameworks worth recognizing: <strong>ADKAR<\/strong> (Awareness, Desire, Knowledge, Ability, Reinforcement — individual change) and <strong>Kotter's 8 steps<\/strong> (urgency → coalition → vision → communicate → empower/remove barriers → short-term wins → consolidate → anchor in culture). The PM typically <em>supports<\/em> organizational change management alongside sponsors/OCM specialists — but on many projects, the PM is the de facto change agent.\n- <strong>Culture assessment:<\/strong> power distance and hierarchy, risk attitude, communication norms, decision styles, incentive structures — culture determines which engagement, leadership, and rollout tactics will work (I-3's situational logic applied at org scale). \"Culture eats strategy for breakfast\" is exam-relevant folklore: plans that ignore culture fail.\n- <strong>Direction 2 — the organization changes around the project:<\/strong> reorganizations, leadership turnover, mergers, new strategy, policy shifts. The PM: identify the change → <strong>evaluate impact<\/strong> on sponsorship, resources, priorities, stakeholders, scope/value case → determine required actions (re-confirm sponsorship, update stakeholder register and engagement plan, re-align vision, adjust plans through change control, or re-test the business case — II-3/III-8) → communicate.\n- <strong>Adoption is a benefit precondition:<\/strong> usage/adoption metrics belong in the benefits measurement system (II-3); \"delivered but not adopted\" is a value failure the PM should see coming and act on (training, champions, incentives, feedback loops).<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Users resist the new system\" → <strong>engage to understand resistance causes and address them<\/strong> (awareness? ability? incentives?) — not \"mandate usage,\" not \"that's operations' problem.\"\n- \"Your sponsor left in a reorg\" → <strong>secure new sponsorship quickly<\/strong> and re-confirm priorities/expectations — an unsponsored project is a dying project.\n- Kotter/ADKAR recognition questions: match the described action to the model stage (e.g., \"publicize an early success\" = short-term wins / Reinforcement).<\/p>", "cards": [{"front": "Organizational change management (OCM)", "back": "Discipline of moving people to a future way of working"}, {"front": "ADKAR", "back": "Awareness, Desire, Knowledge, Ability, Reinforcement"}, {"front": "Kotter's 8 steps", "back": "Urgency → coalition → vision → communicate → empower → wins → consolidate → anchor"}, {"front": "Change readiness / saturation", "back": "Capacity of the org to absorb this (and every other) change"}, {"front": "Adoption metrics", "back": "Usage measures proving the change stuck — benefit precondition"}], "prompts": ["Recite ADKAR and Kotter (order matters) and give a project action per element/step.", "Name five things to examine in a culture assessment and how each alters your approach.", "Your organization announces a merger mid-project. List the impact areas you'd evaluate.", "Why is adoption a project concern rather than \"someone else's problem after go-live\"?"], "questions": [{"stem": "Pilot users of your new procurement system are reverting to the old spreadsheets. Training was delivered and the system works to spec. What should the PM do FIRST?", "options": ["Ask management to disable the old spreadsheets", "Investigate the resistance with the pilot users — where in the adoption chain it breaks (awareness, desire, ability, reinforcement) — and address the actual causes with targeted actions", "Re-run the same training program", "Log the behavior as an operations issue post-handover"], "answer": 1, "rationale": "<p>Diagnose the human change failure before choosing a lever — the block may be desire (incentives), ability (workflow fit), or reinforcement (managers not supporting it). A forces before understanding (may be right <em>later<\/em>); C repeats a lever that already failed; D abandons value realization.<\/p>\n<hr />"}]}, {"id": "III_8", "kind": "task", "dom": "d3", "code": "III-8", "label": "III-8 · Evaluate External Business Environment Changes", "nav": "III-8 Evaluate External Business Environment Changes", "title": "Evaluate External Business Environment Changes", "prose": "<p><strong>🎯 Why this matters.<\/strong> Projects live in weather: regulation, technology, markets, and geopolitics shift mid-flight. The PM who scans continuously reprioritizes early — the one who doesn't gets reprioritized by events.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Survey changes to the external environment (e.g., regulations, technology, geopolitical, market) • Assess and prioritize the impact on project scope/backlog based on those changes • Continually review the external environment for scope/backlog impacts.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Scan systematically:<\/strong> a lightweight, recurring practice — <strong>PESTLE<\/strong> (Political, Economic, Social, Technological, Legal, Environmental) as the classic frame; sources include regulator publications, industry news, analyst reports, supplier/customer signals, and expert stakeholders. Frequency scales with environmental volatility (a fintech project scans faster than a warehouse build).\n- <strong>Assess and prioritize impact:<\/strong> for each detected change, ask — does it affect our <strong>compliance obligations<\/strong> (III-2)? our <strong>business case/value<\/strong> (II-3)? our <strong>risks<\/strong> (III-5)? our <strong>scope/backlog priorities<\/strong>? our suppliers, costs, schedule? Quantify where possible; classify: act now / monitor / no impact. Not every headline deserves a change request — disciplined triage prevents thrash.\n- <strong>Act through the proper channel:<\/strong> regulatory change → compliance plan + change control; market shift → business-case review with sponsor, backlog reprioritization; technology disruption → options analysis (adopt, wait, pivot); geopolitical/supply shock → risk responses, procurement strategy revisit (II-5), possibly escalation to portfolio (III-5 Q3 pattern).\n- <strong>Make it continuous:<\/strong> standing agenda item in governance/risk reviews; assumption log revisited (external assumptions age fastest); backlog refinement includes an environment check in volatile domains. The enabler's word \"continually\" is the point — this is a loop, not an event.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"New regulation announced affecting your deliverable\" → <strong>assess applicability and impact first<\/strong>, then update compliance requirements and plans/backlog through change control — not instant panic-rework, not \"wait until it's enforced.\"\n- \"Competitor/market news mid-project\" → <strong>evaluate business-case impact with stakeholders<\/strong> (II-3 pattern), reprioritize by value.\n- Stems that reward the PM for <em>having a scanning mechanism<\/em> (assumption reviews, PESTLE checks) over heroic late reactions.<\/p>", "cards": [{"front": "PESTLE", "back": "Political, Economic, Social, Technological, Legal, Environmental scan"}, {"front": "Environmental scanning", "back": "Recurring survey of external changes relevant to the project"}, {"front": "Assumption log review", "back": "Re-testing aging external assumptions — early-warning habit"}, {"front": "Impact triage", "back": "Act now / monitor / no impact classification of external changes"}, {"front": "Business-case re-validation", "back": "Testing whether external change broke the value equation"}], "prompts": ["Expand PESTLE with one project-relevant example per letter.", "An external change is detected — name the four project dimensions you check it against.", "Why do external assumptions deserve scheduled re-review? Give an example that aged badly.", "Route each to its channel: new privacy law; competitor price cut; component export ban."], "questions": [{"stem": "Midway through a 14-month product build, the government publishes draft legislation that — if enacted in ~9 months — would require significant changes to your data-handling design. What should the PM do?", "options": ["Redesign immediately to the draft requirements", "Ignore it until the legislation is enacted", "Assess the draft's potential impact with legal/compliance, add it to the risk register with response options (e.g., design flexibility now, monitoring triggers), inform governance, and adjust plans/backlog through the proper process as certainty grows", "Pause the project pending legal certainty"], "answer": 2, "rationale": "A <em>draft<\/em> is a risk with rising probability — assess, plan responses, set triggers, keep governance informed; act proportionally as it firms up. A over-commits to a moving target; B forfeits response time; D destroys value on an uncertainty that may not materialize."}, {"stem": "A currency crisis in a supplier's country threatens a 20% cost increase on imported components scheduled for procurement in four months. The PM's BEST action is:", "options": ["Execute all purchases immediately to lock prices", "Analyze the exposure and options (early purchase, FP-EPA/hedging terms, alternate suppliers, design substitution), quantify impacts, and take the recommendation through the appropriate risk/change/governance channel", "Add 20% to the budget baseline", "Wait — currencies fluctuate both ways"], "answer": 1, "rationale": "<p>Survey → assess → prioritize → act through proper channels, with options and numbers. A acts before analysis (cash flow, storage, need certainty); C changes a baseline without process or analysis; D is passive acceptance of a major quantified threat without a decision.<\/p>\n<hr />"}]}, {"id": "gridIII", "kind": "prose", "dom": "d3", "label": "Domain III — Rapid Recall Grid", "nav": "Rapid recall grid", "html": "<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>One-line essence<\/th>\n<th>Signature tool/technique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Governance<\/td>\n<td>Decision rights, metrics, thresholds, ethics — set up front<\/td>\n<td>Escalation thresholds, gates, PMI ethics pillars<\/td>\n<\/tr>\n<tr>\n<td>2 Compliance<\/td>\n<td>Confirm, classify, embed, measure — never conceal<\/td>\n<td>Compliance categories, audits, DoD embedding<\/td>\n<\/tr>\n<tr>\n<td>3 Changes<\/td>\n<td>Document → assess → decide → implement → update → communicate<\/td>\n<td>Change flow, CCB, backlog (agile)<\/td>\n<\/tr>\n<tr>\n<td>4 Impediments &amp; issues<\/td>\n<td>Make visible, prioritize, intervene, escalate wisely<\/td>\n<td>Risk→issue transition, issue log, standups<\/td>\n<\/tr>\n<tr>\n<td>5 Risk<\/td>\n<td>Identify, analyze, respond, monitor — threats AND opportunities<\/td>\n<td>Register, P×I, EMV, 5+5 strategies, spikes<\/td>\n<\/tr>\n<tr>\n<td>6 Continuous improvement<\/td>\n<td>Capture→apply→archive→consume; refresh OPAs<\/td>\n<td>Retros with owned actions, PDCA<\/td>\n<\/tr>\n<tr>\n<td>7 Org change<\/td>\n<td>Culture-aware adoption; re-anchor when the org shifts<\/td>\n<td>ADKAR, Kotter, readiness assessment<\/td>\n<\/tr>\n<tr>\n<td>8 External environment<\/td>\n<td>Scan continually; triage; act through channels<\/td>\n<td>PESTLE, assumption reviews, case re-validation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "formulas", "kind": "prose", "dom": "d0", "label": "Master Formula Sheet", "nav": "Master Formula Sheet", "html": "<p><em>Rewrite this whole page from memory the week before your exam — it's the highest-leverage 20 minutes you can spend.<\/em><\/p>\n<h2>6.1 Earned Value<\/h2>\n<table>\n<thead>\n<tr>\n<th>Formula<\/th>\n<th>Interpretation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EV = % complete × BAC<\/td>\n<td>Value of work actually done<\/td>\n<\/tr>\n<tr>\n<td>CV = EV − AC<\/td>\n<td>Negative = over budget<\/td>\n<\/tr>\n<tr>\n<td>SV = EV − PV<\/td>\n<td>Negative = behind schedule<\/td>\n<\/tr>\n<tr>\n<td>CPI = EV / AC<\/td>\n<td>&lt;1 over budget; e.g., 0.9 = getting 90¢ per $1<\/td>\n<\/tr>\n<tr>\n<td>SPI = EV / PV<\/td>\n<td>&lt;1 behind schedule<\/td>\n<\/tr>\n<tr>\n<td>EAC = BAC / CPI<\/td>\n<td>Current cost performance continues (typical)<\/td>\n<\/tr>\n<tr>\n<td>EAC = AC + (BAC − EV)<\/td>\n<td>Variance was one-off (atypical)<\/td>\n<\/tr>\n<tr>\n<td>EAC = AC + (BAC − EV)/(CPI × SPI)<\/td>\n<td>Cost + schedule pressure both persist<\/td>\n<\/tr>\n<tr>\n<td>ETC = EAC − AC<\/td>\n<td>Money still needed<\/td>\n<\/tr>\n<tr>\n<td>VAC = BAC − EAC<\/td>\n<td>Negative = expected overrun<\/td>\n<\/tr>\n<tr>\n<td>TCPI = (BAC − EV)/(BAC − AC)<\/td>\n<td>Efficiency required to land on BAC (&gt;1 = harder than current)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6.2 Schedule &amp; Estimating<\/h2>\n<table>\n<thead>\n<tr>\n<th>Formula<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PERT (beta): (O + 4M + P)/6<\/td>\n<td>Weighted three-point estimate<\/td>\n<\/tr>\n<tr>\n<td>Triangular: (O + M + P)/3<\/td>\n<td>Simple three-point<\/td>\n<\/tr>\n<tr>\n<td>Total float = LS − ES (or LF − EF)<\/td>\n<td>Slip room without moving project end<\/td>\n<\/tr>\n<tr>\n<td>Critical path<\/td>\n<td>Longest path; float = 0<\/td>\n<\/tr>\n<tr>\n<td>Sprints remaining ≈ remaining points ÷ velocity<\/td>\n<td>Agile forecast<\/td>\n<\/tr>\n<tr>\n<td>Communication channels = n(n−1)/2<\/td>\n<td>Complexity of communication network<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6.3 Risk &amp; Decision<\/h2>\n<table>\n<thead>\n<tr>\n<th>Formula<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EMV = probability × impact<\/td>\n<td>Sum for contingency sizing; decision trees<\/td>\n<\/tr>\n<tr>\n<td>Risk score = P × I<\/td>\n<td>Qualitative ranking<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6.4 Estimate Precision Ranges<\/h2>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Range<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rough order of magnitude (ROM)<\/td>\n<td>−25% to +75%<\/td>\n<\/tr>\n<tr>\n<td>Definitive<\/td>\n<td>−5% to +10%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6.5 Ten Contrasts the Exam Loves<\/h2>\n<ol>\n<li><strong>Contingency reserve<\/strong> (known-unknowns, in baseline, PM) vs. <strong>management reserve<\/strong> (unknown-unknowns, outside baseline, approval needed).<\/li>\n<li><strong>Crashing<\/strong> (cost) vs. <strong>fast-tracking<\/strong> (risk) — both only work on the critical path.<\/li>\n<li><strong>Leveling<\/strong> (may move end date) vs. <strong>smoothing<\/strong> (float only).<\/li>\n<li><strong>QA/manage quality<\/strong> (process, prevention) vs. <strong>QC/control quality<\/strong> (product, detection).<\/li>\n<li><strong>Validate scope<\/strong> (customer acceptance) vs. <strong>control scope<\/strong> (manage changes).<\/li>\n<li><strong>Scope creep<\/strong> (uncontrolled external additions) vs. <strong>gold plating<\/strong> (team's unrequested extras).<\/li>\n<li><strong>Risk<\/strong> (uncertain, future) vs. <strong>issue<\/strong> (real, now).<\/li>\n<li><strong>Tacit<\/strong> (interaction-transferred) vs. <strong>explicit<\/strong> (document-transferred) knowledge.<\/li>\n<li><strong>Quality<\/strong> (meets requirements) vs. <strong>grade<\/strong> (feature class).<\/li>\n<li><strong>Output<\/strong> (thing) vs. <strong>outcome<\/strong> (change) vs. <strong>benefit/value<\/strong> (worth to stakeholders).<\/li>\n<\/ol>\n<h2>6.6 Sequences Worth Memorizing<\/h2>\n<ul>\n<li><strong>Change control:<\/strong> document → assess impact → decide (authority) → communicate → implement → update docs.<\/li>\n<li><strong>Conflict first-move:<\/strong> understand context → collaborate → (compromise if constrained) → force only for safety/ethics.<\/li>\n<li><strong>New stakeholder appears:<\/strong> register → analyze → plan engagement → engage.<\/li>\n<li><strong>Risk occurs:<\/strong> execute planned response → log as issue → owner/date → update register → communicate.<\/li>\n<li><strong>Closure:<\/strong> confirm criteria &amp; acceptance → transition → close procurement/finance → lessons → release resources → archive.<\/li>\n<li><strong>Engagement levels:<\/strong> Unaware → Resistant → Neutral → Supportive → Leading.<\/li>\n<li><strong>Tuckman:<\/strong> Forming → Storming → Norming → Performing → Adjourning.<\/li>\n<li><strong>ADKAR:<\/strong> Awareness → Desire → Knowledge → Ability → Reinforcement.<\/li>\n<li><strong>AI adoption ladder:<\/strong> Automation → Assistance → Augmentation (human oversight rises with complexity).<\/li>\n<li><strong>Sustainability Pyramid (least → most desirable):<\/strong> Compensate/offset → Restore → Minimize → Avoid.<\/li>\n<\/ul>"}, {"id": "playbook", "kind": "prose", "dom": "d0", "label": "Exam-Day Playbook", "nav": "Exam-Day Playbook", "html": "<h2>7.1 Logistics &amp; Format Expectations<\/h2>\n<ul>\n<li>Plan for a long, scenario-heavy exam with scheduled breaks (check your confirmation letter for current format details; breaks don't allow revisiting earlier answered sections).<\/li>\n<li>Question types include multiple choice, multiple response (\"choose TWO/THREE\" — the required count is stated), matching, hotspot, and fill-in-the-blank; calculations are few but easy points if formulas are automatic.<\/li>\n<\/ul>\n<h2>7.2 Pacing Strategy<\/h2>\n<ul>\n<li>Budget ≈70–75 seconds per question on average; bank time on quick judgment items.<\/li>\n<li>Three-pass discipline per section: answer what you know → mark and return to the uncertain → never leave blanks (no penalty for guessing).<\/li>\n<li>Watch for fatigue in the final third — that's where trained test-takers gain their margin. Use your breaks: stand, breathe, reset.<\/li>\n<\/ul>\n<h2>7.3 The Final Filter (When Two Answers Both Look Right)<\/h2>\n<p>Ask, in order:\n1. Which option <strong>assesses/analyzes before acting<\/strong>?\n2. Which is more <strong>collaborative and transparent<\/strong>?\n3. Which <strong>follows the defined process<\/strong> (change control / backlog / escalation path)?\n4. Which addresses the <strong>root cause<\/strong> and protects <strong>value<\/strong>?\n5. Which matches the <strong>approach<\/strong> in the stem (agile vs. predictive vocabulary)?<\/p>\n<h2>7.4 Red-Flag Answer Patterns (Usually Wrong)<\/h2>\n<ul>\n<li>Do nothing / wait and see (when the PM can act).<\/li>\n<li>Escalate immediately (before the PM's own analysis and engagement).<\/li>\n<li>Bypass process for speed (verbal changes, skipping impact analysis, cutting quality/compliance).<\/li>\n<li>Blame, punish, or publicly expose an individual.<\/li>\n<li>The PM unilaterally decides what the team/PO/CCB should decide.<\/li>\n<li>Hide or delay bad news.<\/li>\n<\/ul>\n<h2>7.5 The Last Week<\/h2>\n<ul>\n<li>Rewrite the Part 6 formula sheet and the three Rapid Recall Grids from memory.<\/li>\n<li>Redo every Self-Quiz you previously missed (spaced retrieval beats rereading).<\/li>\n<li>Take one full-length timed mock; review <em>every<\/em> rationale, right or wrong.<\/li>\n<li>Sleep. A rested brain out-scores a crammed one.<\/li>\n<\/ul>"}], "mock": {"questions": [{"n": 1, "stem": "During a sprint review, a key customer representative says the increment \"isn't what we imagined.\" The team followed the acceptance criteria. What should the PM/scrum master facilitate FIRST?", "options": ["Log a defect against the increment", "A discussion to understand the gap between the customer's expectations and the agreed criteria, feeding insights to the product owner for backlog updates", "A change request to redo the feature", "Re-approval of the original acceptance criteria"], "answer": 1, "rationale": "Expectations vs. criteria gap → understand first, feed the backlog (I-5/I-6). A/C treat conformant work as defective; D re-approves paper instead of engaging."}, {"n": 2, "stem": "Your CPI is 1.08 and SPI is 0.86. What is the correct reading?", "options": ["Over budget, ahead of schedule", "Under budget, behind schedule", "Under budget, ahead of schedule", "Over budget, behind schedule"], "answer": 1, "rationale": "CPI &gt;1 good on cost, SPI &lt;1 behind on schedule."}, {"n": 3, "stem": "Two team members escalate a heated technical disagreement to you. Both solutions appear viable. As a servant leader you should:", "options": ["Choose the solution from the more senior engineer", "Facilitate a collaborative evaluation against agreed criteria (e.g., a spike or architecture review), letting the team decide", "Escalate to the architecture board", "Split the work so each builds their own version"], "answer": 1, "rationale": "Empowered team decides with structured evaluation (I-3). A is HiPPO decision-making; C premature; D wastes."}, {"n": 4, "stem": "A project must comply with a new safety regulation effective in 60 days, requiring rework of a completed deliverable. The PM should FIRST:", "options": ["Assess the impact and submit a change request with options and costs", "Refuse the rework since the deliverable was accepted", "Use contingency reserve to start rework immediately", "Ask the regulator for an exemption"], "answer": 0, "rationale": "Regulatory change → impact analysis → change control (III-2/III-3). C spends reserve without decision authority for a scope-level change."}, {"n": 5, "stem": "The team's velocity over the last four sprints: 30, 32, 29, 31. The product owner asks when the remaining 155 points will finish. Best answer:", "options": ["Exactly 5 sprints", "About 5 sprints, communicated as a forecast with assumptions (stable team, similar story mix), refreshed each sprint", "Whenever the team works harder", "Commit to 4 sprints to motivate the team"], "answer": 1, "rationale": "Empirical forecast + assumptions + refresh cadence (II-8). A implies false precision; D is dishonest."}, {"n": 6, "stem": "You discover your organization submitted slightly inflated progress data to the client last month, before you joined the project. You should:", "options": ["Correct
