 future reports quietly", "Raise it with your leadership/sponsor and ensure accurate reporting and appropriate correction, per the Code of Ethics", "Ignore — it predates you", "Inform the client directly before telling anyone internally"], "answer": 1, "rationale": "Honesty pillar with proper internal channels (III-1). D skips your own organization's remedy process."}, {"n": 7, "stem": "In a hybrid program, the hardware stream slips two weeks, pushing an integration milestone shared with the agile software stream. The PM's FIRST step is to:", "options": ["Instruct the software team to slow down", "Analyze the dependency impact across both streams and coordinate replanning options through the integrated plan", "Escalate the hardware vendor to the steering committee", "Move integration testing off the critical path"], "answer": 1, "rationale": "Integration first: analyze the cross-stream dependency, then coordinate options (II-1/II-8)."}, {"n": 8, "stem": "A stakeholder with high power and low interest starts attending every team ceremony and requesting design changes directly. You should:", "options": ["Bar them from ceremonies", "Meet them to understand their changed interest, update your stakeholder analysis and engagement approach, and channel change requests via the product owner/change process", "Escalate their behavior to the sponsor", "Grant the requests to keep them satisfied"], "answer": 1, "rationale": "Re-analyze the stakeholder (interest changed), tailor engagement, protect process (I-4/III-3)."}, {"n": 9, "stem": "Your risk register shows a threat scored high/high with a mitigation owner assigned three weeks ago; nothing has happened. Next step:", "options": ["Reassign the risk to yourself", "Follow up with the owner: review the response plan, obstacles, and timeline; escalate per thresholds if stalled", "Accept the risk since mitigation stalled", "Raise a change request to extend the schedule"], "answer": 1, "rationale": "Risk owner accountability: follow up, unblock, escalate per thresholds (III-5)."}, {"n": 10, "stem": "A functional manager pulls two of your team members for \"urgent operations work\" for a week, threatening your critical path. FIRST:", "options": ["Escalate to the sponsor", "Assess the schedule impact, then negotiate with the functional manager on timing/alternatives armed with that analysis", "Reject the request — the project takes priority", "Backfill with contractors immediately"], "answer": 1, "rationale": "Assess, then negotiate with data (II-4). Escalation follows failed negotiation, not precedes it."}, {"n": 11, "stem": "The product owner wants to insert an urgent feature mid-sprint, jeopardizing the sprint goal. The BEST facilitation is:", "options": ["Add it — the PO owns priorities", "Discuss options with the PO and team: defer to next sprint, or if truly urgent, negotiate scope within the sprint transparently, protecting the goal where possible", "Refuse all mid-sprint changes categorically", "Cancel the sprint"], "answer": 1, "rationale": "Sprint-goal protection with transparent negotiation (III-3 agile lens). C is dogma; A destabilizes silently."}, {"n": 12, "stem": "BAC = $250k, EV = $100k, AC = $125k, PV = $110k. Which set is correct?", "options": ["CPI 0.80, SPI 0.91, EAC $312.5k", "CPI 1.25, SPI 1.10, EAC $200k", "CPI 0.80, SPI 1.14, EAC $312.5k", "CPI 0.91, SPI 0.80, EAC $275k"], "answer": 0, "rationale": "CPI = 100/125 = 0.80; SPI = 100/110 ≈ 0.91; EAC = 250/0.8 = 312.5k."}, {"n": 13, "stem": "A vendor requests a scope clarification that reveals your SOW is ambiguous on testing responsibilities. You should:", "options": ["Insist the vendor absorbs the testing", "Meet the vendor to align interpretation, then document the clarification through the contract change process in writing", "Accept the vendor's interpretation to preserve the relationship", "Have the lawyers handle it"], "answer": 1, "rationale": "Align then document in writing via contract change process (II-5). Verbal or one-sided readings breed claims."}, {"n": 14, "stem": "During closure, the operations lead refuses handover, citing missing runbooks and untrained staff. The PM should:", "options": ["Deliver anyway — the deadline passed", "Treat transition-readiness criteria as unmet: plan and complete the missing documentation and training before transfer, adjusting via proper process", "Escalate the operations lead's resistance", "Extend hypercare indefinitely instead"], "answer": 1, "rationale": "Transition readiness is a closure criterion (II-10); fix the gaps properly."}, {"n": 15, "stem": "Your team spans four countries. Two members repeatedly go silent in meetings dominated by fast native-speaker debate. As their leader you should:", "options": ["Ask them to speak up more", "Restructure interaction — e.g., written idea rounds, pauses, smaller breakouts, rotating facilitation — so varied communication styles can contribute", "Summarize decisions to them afterward", "Move them to individual work tracks"], "answer": 1, "rationale": "Inclusive structures let varied perspectives contribute (I-3). A puts the burden on the excluded; C excludes from decisions."}, {"n": 16, "stem": "An internal audit finds your project's data-retention practice violates policy, though no external law is broken. You should:", "options": ["Deprioritize — no legal exposure", "Treat it as a compliance finding: assess, remediate with an owner and date, and report status through governance", "Request a policy exemption retroactively", "Delete the affected data immediately"], "answer": 1, "rationale": "Internal policy is still compliance; assess-remediate-report (III-2)."}, {"n": 17, "stem": "Sponsor: \"Give me one number — when will the agile program finish?\" Best response:", "options": ["Provide the velocity-based forecast as a date range with confidence and assumptions, and offer regular re-forecasts", "Refuse — agile doesn't do dates", "Give the most optimistic date to secure support", "Convert the program to predictive to answer precisely"], "answer": 0, "rationale": "Honest empirical range + cadence beats false precision or refusal (II-8/I-6)."}, {"n": 18, "stem": "A team member privately reports another member is logging hours not worked. You should:", "options": ["Confront the accused in the next standup", "Handle it confidentially and factually per organizational policy (verify, involve HR/appropriate channel), upholding the Code of Ethics", "Ignore without proof", "Ask the reporter to gather more evidence covertly"], "answer": 1, "rationale": "Confidential, factual, policy-driven handling (III-1 ethics). A humiliates; D deputizes surveillance."}, {"n": 19, "stem": "Your project's success criteria emphasize delivery date, but benefits tracking shows the driving business assumption has weakened badly. You should:", "options": ["Keep delivering — dates are commitments", "Bring the value analysis to the sponsor/governance and recommend re-validating the business case and options", "Quietly descope to cut losses", "Accelerate to deliver before the assumption collapses further"], "answer": 1, "rationale": "Value stewardship: surface, re-validate, recommend (II-3)."}, {"n": 20, "stem": "Which pairing is correct?", "options": ["Mitigate–increase probability of an opportunity", "Exploit–ensure an opportunity happens", "Transfer–eliminate a threat", "Avoid–buy insurance"], "answer": 1, "rationale": "Exploit = make the opportunity certain. Mitigate reduces threats; transfer shifts, doesn't eliminate; insurance = transfer."}, {"n": 21, "stem": "In backlog refinement, a story keeps being deprioritized although a regulator's deadline approaches. The PM should:", "options": ["Let the PO's ordering stand without comment", "Highlight the compliance deadline and consequence analysis to the PO so the ordering reflects the true cost of delay", "Insert the story into the sprint personally", "Escalate the PO to the sponsor"], "answer": 1, "rationale": "Inform value/priority decisions with compliance cost-of-delay (II-3/III-2); the PO still owns ordering."}, {"n": 22, "stem": "Halfway through a predictive project, actuals show a permanent 10% labor-rate increase. The BEST response:", "options": ["Absorb it silently within contingency", "Reforecast (EAC), analyze options, and take the funding/baseline impact through change control and governance", "Cut testing to offset", "Bill the increase to the vendor"], "answer": 1, "rationale": "Permanent variance → reforecast, options, governance/change control (II-6)."}, {"n": 23, "stem": "The daily standup has become a status report to the PM, with members waiting for assignments. The scrum-style fix is to:", "options": ["Extend the standup to capture more detail", "Re-anchor the event as the team's own coordination toward the sprint goal — peer-to-peer, with the leader stepping back", "Replace it with written status", "Have the PO run it"], "answer": 1, "rationale": "The standup belongs to the team: peer coordination toward the goal (I-3 agile)."}, {"n": 24, "stem": "A new executive stakeholder demands weekly one-hour briefings that duplicate existing reports. You should:", "options": ["Comply indefinitely", "Explore their underlying information needs and decision points, then tailor an efficient format that serves them — updating the communications plan", "Decline — the comms plan is baselined", "Delegate the briefings to a team member"], "answer": 1, "rationale": "Serve the stakeholder's real decision needs efficiently; update the plan (I-8)."}, {"n": 25, "stem": "Which belongs OUTSIDE the cost baseline but INSIDE the total project budget?", "options": ["Contingency reserve", "Management reserve", "Work package estimates", "Quality assurance costs"], "answer": 1, "rationale": "Management reserve: outside baseline, inside budget."}, {"n": 26, "stem": "Your organization pivots strategy; your project's deliverable now serves a deprioritized market. Governance hasn't reacted yet. You should:", "options": ["Continue until told otherwise", "Proactively assess the strategic-alignment impact and present findings and options to the sponsor/governance", "Pause the project on your own authority", "Reduce burn rate quietly"], "answer": 1, "rationale": "Continued-business-value duty: proactive analysis to governance (II-1/II-3/III-8)."}, {"n": 27, "stem": "The team wants to adopt an AI-assisted estimation tool. The PM's soundest position is:", "options": ["Prohibit — AI outputs can't be trusted", "Pilot it as decision support: validate outputs against historicals, keep humans accountable for estimates, and address data-privacy/compliance considerations", "Adopt fully and reduce estimation meetings", "Only allow it for small tasks"], "answer": 1, "rationale": "AI as governed decision support with human accountability and compliance checks (II-1/III-2)."}, {"n": 28, "stem": "An activity not on the critical path will finish 3 days late; it has 6 days of total float. You should:", "options": ["Crash it back on plan", "Note it, verify float consumption and downstream free-float effects, and continue monitoring — no baseline action needed yet", "Submit a schedule change request", "Escalate the team's slippage"], "answer": 1, "rationale": "Float exists to absorb this; monitor, don't churn (II-8)."}, {"n": 29, "stem": "Which sequence correctly orders a healthy risk lifecycle?", "options": ["Identify → respond → analyze → monitor", "Identify → analyze → plan responses → implement/monitor → reassess", "Analyze → identify → accept → close", "Register → escalate → transfer → archive"], "answer": 1, "rationale": "Identify → analyze → plan → implement/monitor → reassess loop (III-5)."}, {"n": 30, "stem": "At final closure, the sponsor asks what single artifact best demonstrates the project's success under the 2026 success definition. Strongest answer:", "options": ["The final Gantt chart showing on-time completion", "The benefits/value measurement results against the business case (with the realization plan for post-project benefits)", "The signed scope statement", "The closed risk register"], "answer": 1, "rationale": "<p>2026 success = value worth the effort and expense, evidenced by benefits measurement (II-3).<\/p>\n<hr />"}], "intro": "<p><em>Simulates exam mixing: ~10 People, ~12 Process, ~8 Business Environment; ~60% agile/hybrid framing. Answers with rationales follow — no peeking until you've committed answers.<\/em><\/p>"}, "closing": "<p>Mastery of this exam is mastery of a <em>way of thinking<\/em>: understand before acting, collaborate before escalating, follow the process without hiding behind it, and measure success in value delivered — not activity performed. Every hour of retrieval practice in this guide buys you more points than three hours of rereading. Trust the method, trust your preparation.<\/p>\n<p><em>Good luck — go earn those three letters.<\/em><\/p>", "credit": "<em>Study guide prepared from the PMP® Examination Content Outline (July 2026) and aligned with A Guide to the Project Management Body of Knowledge (PMBOK® Guide) — Eighth Edition. PMP, PMBOK, and PMI are registered marks of the Project Management Institute, Inc. Branded and delivered by <a href=\"https://innovanta.one/\" target=\"_blank\" rel=\"noopener noreferrer\">Innovanta One<\/a>.<\/em>", "groups": [{"label": "Start here", "ids": ["howto", "exam", "foundations", "pmbok", "spotlight"], "dom": "d0"}, {"label": "Domain I · People · 33%", "ids": ["domI", "I_1", "I_2", "I_3", "I_4", "I_5", "I_6", "I_7", "I_8", "gridI"], "dom": "d1"}, {"label": "Domain II · Process · 41%", "ids": ["domII", "II_1", "II_2", "II_3", "II_4", "II_5", "II_6", "II_7", "II_8", "II_9", "II_10", "gridII"], "dom": "d2"}, {"label": "Domain III · Business Env · 26%", "ids": ["domIII", "III_1", "III_2", "III_3", "III_4", "III_5", "III_6", "III_7", "III_8", "gridIII"], "dom": "d3"}, {"label": "Finish strong", "ids": ["formulas", "playbook", "mock"], "dom": "d0"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const S = {studied:new Set(), answered:{}, correct:0, attempted:0};
const domNames = {d0:'', d1:'People', d2:'Process', d3:'Business Environment'};
const $ = s => document.querySelector(s);
const el = (t,c,h) => {const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const secById = Object.fromEntries(DATA.sections.map(s=>[s.id,s]));
const ORDER = DATA.groups.flatMap(g=>g.ids).filter(id=>id==='mock'||secById[id]);

/* ---------- nav ---------- */
function buildNav(){
  const nav = $('#nav'); nav.innerHTML='';
  DATA.groups.forEach(g=>{
    const h = el('div','navgroup'); 
    h.append(el('span','dot','')); h.lastChild.style.background=`var(--${g.dom})`;
    h.append(document.createTextNode(g.label));
    nav.append(h);
    g.ids.forEach(id=>{
      const s = id==='mock' ? {id:'mock',nav:'30-question mini-mock',dom:'d0',code:''} : secById[id];
      if(!s) return;
      const a = el('a'); a.href = '#'+id; a.dataset.id=id;
      a.style.setProperty('--acc',`var(--${s.dom})`); a.style.setProperty('--soft',`var(--${s.dom}-soft)`);
      a.innerHTML = `<span class="tick">✓</span>${s.code?`<span class="code">${s.code}</span>`:''}<span>${s.nav}</span>`;
      a.onclick = e=>{e.preventDefault(); show(id); if(innerWidth<=880) $('#nav').classList.remove('open');};
      nav.append(a);
    });
  });
}

/* ---------- section rendering ---------- */
function renderSection(s){
  const sec = el('section','page'); sec.id='sec-'+s.id;
  sec.style.setProperty('--acc',`var(--${s.dom})`); sec.style.setProperty('--soft',`var(--${s.dom}-soft)`);
  const head = el('div','spine');
  if(s.code) head.append(el('span','tab',s.code));
  const hwrap = el('div');
  if(domNames[s.dom]) hwrap.append(el('p','pagekicker',`Domain · ${domNames[s.dom]}`));
  hwrap.append(el('h2','pagetitle', s.title || s.label));
  head.append(hwrap); sec.append(head);

  if(s.kind==='prose'){ sec.append(el('div','prose',s.html)); }
  else{
    sec.append(el('div','prose',s.prose));
    if(s.cards && s.cards.length){
      sec.append(blockHead('🗂️','Flashcards — flip to recall'));
      sec.append(deckBar(sec, s));
      sec.append(buildDeck(s));
    }
    if(s.prompts && s.prompts.length){
      sec.append(blockHead('✅','Self-quiz — answer aloud before revealing anything'));
      sec.append(el('p','sqnote','Retrieval beats rereading: answer each from memory, then mark the ones you truly recalled.'));
      const ol = el('ol','sq');
      s.prompts.forEach(p=>{
        const li = el('li'); li.append(el('div','q',p));
        const b = el('button','recall','Got it'); b.setAttribute('aria-pressed','false');
        b.onclick=()=>b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true');
        li.append(b); ol.append(li);
      });
      sec.append(ol);
    }
    if(s.questions && s.questions.length){
      sec.append(blockHead('📝','Practice questions'));
      const score = el('div','secscore',''); score.dataset.for=s.id;
      s.questions.forEach((q,i)=> sec.append(buildQuestion(q,i,s.id,score)));
      sec.append(score);
    }
  }
  sec.append(pageFoot(s));
  return sec;
}
function blockHead(icon,txt){const d=el('div','blockhead');d.append(el('span','bicon',icon));d.append(document.createTextNode(txt));return d;}

function deckBar(sec,s){
  const bar = el('div','deckbar');
  const flipAll = el('button','btn','Flip all');
  flipAll.onclick = ()=>{const cards=[...sec.querySelectorAll('.fcard')];const any=cards.some(c=>!c.classList.contains('flipped'));cards.forEach(c=>c.classList.toggle('flipped',any));};
  const shuffle = el('button','btn','Shuffle');
  shuffle.onclick = ()=>{const d=sec.querySelector('.deck');[...d.children].sort(()=>Math.random()-.5).forEach(c=>{c.classList.remove('flipped');d.append(c);});};
  bar.append(flipAll, shuffle, el('span','hint',`${s.cards.length} cards · click a card to flip`));
  return bar;
}
function buildDeck(s){
  const deck = el('div','deck');
  s.cards.forEach(c=>{
    const w = el('div','fcard');
    const b = el('button','inner'); b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label','Flashcard: '+c.front.replace(/<[^>]+>/g,''));
    b.innerHTML = `<span class="face front"><span class="term">${c.front}</span><span class="flipnote">flip</span></span>
                   <span class="face back"><span>${c.back}</span></span>`;
    b.onclick=()=>{w.classList.toggle('flipped'); b.setAttribute('aria-pressed', w.classList.contains('flipped'));};
    w.append(b); deck.append(w);
  });
  return deck;
}

function buildQuestion(q,i,sid,scoreEl){
  const box = el('div','pq');
  box.append(el('p','stem',`<span class="qn">Q${i+1}</span>${q.stem}`));
  const ul = el('ul','opts');
  const letters=['A','B','C','D'];
  const order=[0,1,2,3].sort(()=>Math.random()-.5); // display shuffle; letters stay with content
  order.forEach(oi=>{ const o=q.options[oi];
    const li=el('li'); const b=el('button','opt'); b.dataset.oi=oi;
    b.innerHTML=`<span class="letter">${letters[oi]}</span><span>${o}</span>`;
    b.onclick=()=>{
      if(box.classList.contains('answered'))return;
      box.classList.add('answered');
      const ok = oi===q.answer;
      S.attempted++; if(ok)S.correct++;
      const key = sid+':'+i; S.answered[key]=ok;
      [...ul.querySelectorAll('.opt')].forEach(btn=>{
        const bi = +btn.dataset.oi;
        btn.disabled=true;
        if(bi===q.answer)btn.classList.add('correct');
        else if(bi===oi)btn.classList.add('wrong');
        else btn.classList.add('dim');
      });
      box.append(el('p','verdict '+(ok?'good':'bad'), ok?'Correct — well judged.':`Not quite — the credited answer is ${letters[q.answer]}.`));
      updateScore(); updateSecScore(sid,scoreEl);
    };
    li.append(b); ul.append(li);
  });
  box.append(ul);
  box.append(el('div','rationale',`<strong>Why:</strong> ${q.rationale}`));
  const reset = el('button','reset','Reset this question');
  reset.onclick=()=>{
    if(!box.classList.contains('answered'))return;
    const key=sid+':'+i;
    if(key in S.answered){S.attempted--; if(S.answered[key])S.correct--; delete S.answered[key];}
    box.classList.remove('answered'); box.querySelector('.verdict')?.remove();
    [...box.querySelectorAll('.opt')].forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','dim');});
    updateScore(); updateSecScore(sid,scoreEl);
  };
  box.append(reset);
  return box;
}
function updateSecScore(sid,elm){
  const keys=Object.keys(S.answered).filter(k=>k.startsWith(sid+':'));
  const right=keys.filter(k=>S.answered[k]).length;
  elm.textContent = keys.length? `Section score: ${right} of ${keys.length} answered correctly` : '';
}
function updateScore(){ $('#scoreChip').textContent = `✓ ${S.correct} / ${S.attempted} correct`; }

function pageFoot(s){
  const f = el('div','pagefoot');
  const mark = el('button','markbtn','✓ Mark studied'); mark.setAttribute('aria-pressed','false');
  mark.onclick=()=>{
    const on = mark.getAttribute('aria-pressed')!=='true';
    mark.setAttribute('aria-pressed',on); mark.textContent = on?'✓ Studied':'✓ Mark studied';
    if(on)S.studied.add(s.id); else S.studied.delete(s.id);
    document.querySelector(`nav a[data-id="${s.id}"]`)?.classList.toggle('done',on);
    updateProgress();
  };
  f.append(mark);
  const pager = el('div','pager');
  const idx = ORDER.indexOf(s.id);
  if(idx>0) pager.append(navBtn(ORDER[idx-1],'‹ '));
  if(idx>=0 && idx<ORDER.length-1) pager.append(navBtn(ORDER[idx+1],'','Next: '));
  f.append(pager);
  return f;
}
function navBtn(id,pre='',lbl=''){
  const t = id==='mock' ? 'Mini-mock exam' : (secById[id].code?secById[id].code+' · ':'')+(secById[id].title||secById[id].label);
  const b = el('button','btn', pre + (lbl?lbl:'') + t + (pre?'':' ›'));
  b.onclick=()=>show(id);
  return b;
}
function updateProgress(){
  const total = ORDER.length;
  const pct = Math.round(100*S.studied.size/total);
  $('#progressPct').textContent = pct+'%';
  $('#progressFill').style.width = pct+'%';
}

/* ---------- mock exam ---------- */
function renderMock(){
  const s = el('section','page'); s.id='sec-mock';
  const hw = el('div');
  hw.append(el('p','pagekicker','Finish strong'));
  hw.append(el('h2','pagetitle','30-Question Mini-Mock'));
  const spine = el('div','spine'); spine.append(hw); s.append(spine);
  const stage = el('div'); stage.id='mockStage';
  s.append(el('div','prose',DATA.mock.intro));
  s.append(stage);
  mockIntro(stage);
  s.append(pageFoot({id:'mock',dom:'d0',label:'Mini-mock'}));
  return s;
}
function mockIntro(stage){
  stage.innerHTML='';
  const card = el('div','scorecard');
  card.append(el('p','', 'Domain-weighted, ~60% agile/hybrid framing. Answers lock as you go; the full review with rationales appears at the end — just like exam day, commit before you know.'));
  const b = el('button','btn','Start the mock'); b.style.fontSize='16px'; b.style.padding='12px 26px';
  b.onclick=()=>runMock(stage);
  card.append(b); stage.append(card);
}
function runMock(stage){
  const qs = DATA.mock.questions; let i=0; const picks=Array(qs.length).fill(null);
  const draw=()=>{
    stage.innerHTML='';
    const meta = el('div','mockmeta',`<span>Question ${i+1} of ${qs.length}</span><span>${picks.filter(p=>p!==null).length} answered</span>`);
    const bar = el('div','mockbar'); bar.append(el('div','')); bar.firstChild.style.width=(100*i/qs.length)+'%';
    stage.append(meta,bar);
    const q=qs[i]; const box=el('div','pq');
    box.append(el('p','stem',`<span class="qn">Q${q.n}</span>${q.stem}`));
    const ul=el('ul','opts'); const letters=['A','B','C','D'];
    const order=[0,1,2,3].sort(()=>Math.random()-.5); // display shuffle; letters stay with content
    order.forEach(oi=>{ const o=q.options[oi];
      const b=el('button','opt'); b.innerHTML=`<span class="letter">${letters[oi]}</span><span>${o}</span>`;
      b.onclick=()=>{picks[i]=oi; i++; i<qs.length? draw(): finish();};
      const li=el('li'); li.append(b); ul.append(li);
    });
    box.append(ul); stage.append(box);
  };
  const finish=()=>{
    stage.innerHTML='';
    const right = picks.filter((p,idx)=>p===qs[idx].answer).length;
    const pct = Math.round(100*right/qs.length);
    const card = el('div','scorecard');
    card.append(el('p','pagekicker','Your result'));
    card.append(el('div','big',`${right} / ${qs.length}`));
    card.append(el('p','', pct>=80 ? `${pct}% — exam-ready territory. Review every rationale below anyway; that's where the last points live.` :
                          pct>=60 ? `${pct}% — solid base. Study the rationales below, then revisit the tasks behind your misses.` :
                                    `${pct}% — a useful diagnostic. Work through each rationale below and re-study the linked tasks before retaking.`));
    const retake = el('button','btn','Retake the mock'); retake.onclick=()=>mockIntro(stage);
    card.append(retake); stage.append(card);
    const rev = el('div','review'); rev.append(blockHead('🔍','Full review'));
    const letters=['A','B','C','D'];
    qs.forEach((q,idx)=>{
      const ok = picks[idx]===q.answer;
      const box=el('div','pq answered');
      box.append(el('p','stem',`<span class="qn">Q${q.n}</span><span class="pill ${ok?'good':'bad'}">${ok?'Correct':'Missed'}</span><br>${q.stem}`));
      const ul=el('ul','opts');
      q.options.forEach((o,oi)=>{
        const b=el('button','opt'); b.disabled=true;
        b.innerHTML=`<span class="letter">${letters[oi]}</span><span>${o}</span>`;
        if(oi===q.answer)b.classList.add('correct'); else if(oi===picks[idx])b.classList.add('wrong'); else b.classList.add('dim');
        const li=el('li'); li.append(b); ul.append(li);
      });
      box.append(ul);
      const r=el('div','rationale',`<strong>Why ${letters[q.answer]}:</strong> ${q.rationale}`); r.style.display='block';
      box.append(r); rev.append(box);
    });
    stage.append(rev);
  };
  draw();
}

/* ---------- routing ---------- */
function show(id){
  document.querySelectorAll('section.page').forEach(p=>p.classList.remove('visible'));
  const t = $('#sec-'+id); if(t){t.classList.add('visible'); window.scrollTo({top:0});}
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  try{history.replaceState(null,'','#'+id)}catch(e){/* restricted environments: navigation still works */}
}

/* ---------- boot ---------- */
buildNav();
const main = $('#main');
DATA.sections.forEach(s=> main.append(renderSection(s)));
main.append(renderMock());
const closing = el('div','prose'); closing.innerHTML = DATA.closing + (DATA.credit?`<p class="footer-credit">${DATA.credit}</p>`:'');
document.querySelector('#sec-mock').append(closing);
$('#menuBtn').onclick=()=> $('#nav').classList.toggle('open');
updateScore(); updateProgress();
show(location.hash && document.getElementById('sec-'+location.hash.slice(1)) ? location.hash.slice(1) : ORDER[0]);
</script>
</body>
