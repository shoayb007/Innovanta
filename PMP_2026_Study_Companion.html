n; motivators create engagement"}, {"front": "Theory X / Y", "back": "Assume people avoid work (control) vs. seek fulfillment (trust)"}, {"front": "Emotional intelligence", "back": "Self-awareness, self-regulation, motivation, empathy, social skill"}, {"front": "Self-organizing team", "back": "Team decides how to accomplish work; no task-by-task assignment"}], "prompts": ["Name Tuckman's five stages and what a leader should do during storming.", "Distinguish hygiene factors from motivators with two examples each.", "A skilled but newly formed team faces a compliance-critical task this week — which leadership style, and why?", "What does \"represent the voice of the team\" require when the sponsor demands a 30% schedule cut?", "Recite the RACI letters and the one-A rule."], "questions": [{"stem": "A previously strong performer has missed three deadlines and gone quiet in standups. What should the PM do FIRST?", "options": ["Document the misses and notify the functional manager", "Redistribute the person's work to protect the schedule", "Have a private, empathetic conversation to understand what's going on", "Raise the pattern in the next retrospective"], "answer": 2, "rationale": "Understand root cause privately first — could be an impediment, unclear expectations, or personal difficulty. A jumps to formal process; B treats the symptom and signals distrust; D exposes an individual publicly."}, {"stem": "In sprint planning, the sponsor pressures the team to commit to 40% more story points \"to show ambition.\" The team's data shows stable velocity well below that. As servant leader, what should the PM do?", "options": ["Ask the team to stretch and commit to the sponsor's number", "Present the team's velocity data to the sponsor, defend a realistic commitment, and explore scope/priority options to meet the sponsor's underlying goal", "Escalate the disagreement to the PMO", "Commit publicly but plan to descope quietly later"], "answer": 1, "rationale": "Represent the voice of the team with evidence, protect sustainable pace, and problem-solve the sponsor's real need (value/priorities). A breaks empowerment and sets the team up to fail; C escalates what a PM should handle; D is dishonest — an ethics violation."}, {"stem": "A newly assembled cross-functional team is arguing constantly about tools and working methods. Deliverables haven't suffered yet. What should the PM recognize and do?", "options": ["The team is dysfunctional; replace the most argumentative members", "This is the storming stage; facilitate ground rules and coach the team through conflict toward norming", "Escalate to functional managers to enforce standard tools", "Postpone all team meetings until conflict subsides"], "answer": 1, "rationale": "<p>Tuckman: storming is normal and navigable with facilitation, working agreements, and coaching. A, C punish a natural stage; D is avoidance.<\/p>\n<hr />"}]}, {"id": "I_4", "kind": "task", "dom": "d1", "code": "I-4", "label": "I-4 · Engage Stakeholders", "nav": "I-4 Engage Stakeholders", "title": "Engage Stakeholders", "prose": "<p><strong>🎯 Why this matters.<\/strong> Stakeholder disengagement is the top killer of otherwise well-run projects. This task covers the full engagement engine: identify → analyze → tailor communication → execute the plan → optimize alignment → build trust and influence.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify stakeholders • Analyze stakeholders • Analyze and tailor communication to stakeholder needs • Execute the stakeholder engagement plan • Optimize alignment among stakeholder needs, expectations, and project objectives • Build trust and influence stakeholders to accomplish project objectives.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Identify early, revisit constantly.<\/strong> Stakeholders = anyone who affects, is affected by, or perceives themselves affected by the project. Sources: charter, org charts, contracts, brainstorming, interviewing known stakeholders (\"who else?\"). Missing a stakeholder until late = expensive surprises; identification repeats throughout the life cycle (PMBOK 8 Stakeholders Performance Domain treats engagement as continuous).\n- <strong>Analyze:<\/strong> assess each stakeholder's <strong>power, interest, influence, attitude (supporter/neutral/resistor), expectations, and information needs.<\/strong> Classic models:\n  - <strong>Power/Interest grid:<\/strong> high-power/high-interest → <em>manage closely<\/em>; high-power/low-interest → <em>keep satisfied<\/em>; low-power/high-interest → <em>keep informed<\/em>; low/low → <em>monitor<\/em>.\n  - <strong>Salience model:<\/strong> power + legitimacy + urgency.\n  - <strong>Stakeholder engagement assessment matrix:<\/strong> current vs. desired engagement per stakeholder — <strong>Unaware → Resistant → Neutral → Supportive → Leading<\/strong>. The gap drives your engagement actions.\n- <strong>Tailor communication:<\/strong> right message, format, channel, frequency, and level of detail per stakeholder (an executive wants a one-page dashboard; a regulator wants formal documents; the team wants working sessions). Consider language, culture, time zones, accessibility.\n- <strong>Execute the plan:<\/strong> engagement is <em>doing<\/em> — meetings, demos, workshops, one-on-ones — not owning a spreadsheet.\n- <strong>Optimize alignment:<\/strong> where stakeholder expectations conflict with each other or with objectives, surface the conflict, facilitate trade-off discussions, and negotiate — anchored in the vision and business value.\n- <strong>Build trust and influence:<\/strong> deliver on commitments, communicate honestly (including bad news), listen actively, understand their drivers, involve them in decisions. Influence without authority = credibility + reciprocity + framing benefits in the stakeholder's terms.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> stakeholders engage through <strong>sprint reviews/demos<\/strong>, backlog refinement input, and the product owner as their conduit; feedback loops are structural, not optional.\n- <em>Predictive:<\/em> engagement plan + communications plan; formal reviews and stage gates; more document-mediated.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"A stakeholder you didn't know about objects late\" → <strong>add them to the register, analyze them, engage<\/strong> — never dismiss because \"they weren't identified at the start.\"\n- \"A key stakeholder is resistant\" → <strong>meet them to understand concerns<\/strong> (root cause), then tailor engagement; not escalate, not ignore, not overwhelm with reports.\n- The engagement matrix (current vs. desired) is a favorite: know the five levels in order.<\/p>", "cards": [{"front": "Stakeholder register", "back": "Living record of stakeholders, their analysis and needs"}, {"front": "Power/Interest grid", "back": "Manage closely / keep satisfied / keep informed / monitor"}, {"front": "Engagement assessment matrix", "back": "Current vs. desired: Unaware–Resistant–Neutral–Supportive–Leading"}, {"front": "Salience model", "back": "Prioritize by power, legitimacy, urgency"}, {"front": "Sprint review", "back": "Agile's built-in stakeholder feedback event on the increment"}], "prompts": ["Recite the five engagement levels in order, and how the matrix drives action.", "Draw the power/interest grid from memory and label the four strategies.", "Name four concrete trust-building behaviors.", "How does stakeholder engagement differ structurally in agile vs. predictive?"], "questions": [{"stem": "Three sprints in, the operations director — never included in stakeholder analysis — demands major changes, threatening to block deployment. What should the PM do FIRST?", "options": ["Explain that requirements were baselined and changes must wait for phase two", "Add the director to the stakeholder register, meet to understand their needs and expectations, and assess impact with the product owner", "Escalate the director's behavior to the sponsor", "Schedule the director into all future ceremonies"], "answer": 1, "rationale": "Identification is continuous: register → analyze → engage → assess impact through the right channel (backlog). A hides behind process; C escalates before engaging; D is action without analysis."}, {"stem": "Your engagement assessment matrix shows the finance controller is \"Resistant\" but needs to be \"Supportive\" for budget approvals. The BEST next step is:", "options": ["Send the controller weekly detailed status reports", "Ask the sponsor to instruct the controller to cooperate", "Meet the controller one-on-one to understand the concerns driving resistance, and address them in how the project is planned and communicated", "Reclassify the desired level to \"Neutral\" to close the gap"], "answer": 2, "rationale": "<p>Close the gap by understanding and addressing root concerns — tailored engagement. A is generic broadcast; B is borrowed authority that breeds compliance, not support; D games the tool.<\/p>\n<hr />"}]}, {"id": "I_5", "kind": "task", "dom": "d1", "code": "I-5", "label": "I-5 · Align Stakeholder Expectations", "nav": "I-5 Align Stakeholder Expectations", "title": "Align Stakeholder Expectations", "prose": "<p><strong>🎯 Why this matters.<\/strong> Stakeholders arrive with different — often contradictory — pictures of success. Alignment work up front (and at every change) prevents the classic end-of-project fight over \"that's not what I expected.\"<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Categorize stakeholders • Identify stakeholder expectations • Facilitate discussions to align expectations • Organize and act on mentoring opportunities.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Categorize<\/strong> (internal/external; supporter/resistor; by power-interest; by role: customer, user, supplier, regulator, sponsor) so engagement effort is proportionate.\n- <strong>Elicit expectations explicitly:<\/strong> interviews, workshops, surveys, reviewing the business case and success criteria. Expectations are often <strong>unstated assumptions<\/strong> — about quality level, involvement, timing, benefits — so ask \"what does success look like to you?\" and \"what would disappoint you?\"\n- <strong>Facilitate alignment:<\/strong> bring conflicting stakeholders together; make trade-offs visible (e.g., MoSCoW prioritization, success-criteria ranking); anchor in vision and value; document agreed success criteria and get sign-off (predictive) or a shared product goal/roadmap (agile).\n- <strong>Mentoring:<\/strong> the 2026 ECO folds mentoring here — develop stakeholders' and team members' understanding of PM ways of working (e.g., coach a first-time sponsor on their role; mentor a junior PM; help business stakeholders learn how backlogs and reviews work). Better-informed stakeholders hold better-calibrated expectations.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Predictive:<\/em> alignment lands in documented, signed <strong>success criteria / requirements / charter<\/strong>.\n- <em>Agile:<\/em> alignment is continuous — roadmap, backlog priorities, and each sprint review recalibrate expectations against a working product (nothing aligns expectations like a demo).<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Two executives want incompatible outcomes → <strong>facilitate a joint session to align on prioritized success criteria<\/strong>, not choose one privately, not escalate first, not build both.\n- A stakeholder unfamiliar with agile keeps demanding fixed long-range promises → <strong>educate/mentor them on the approach<\/strong> and show the roadmap and empirical forecasts.<\/p>", "cards": [{"front": "Success criteria", "back": "Explicit, agreed measures of what \"done and successful\" means"}, {"front": "MoSCoW", "back": "Must / Should / Could / Won't — prioritization frame for trade-offs"}, {"front": "Assumption", "back": "Something believed true without proof — hidden expectation risk"}, {"front": "Mentoring", "back": "Longer-term development relationship; here, growing stakeholder PM literacy"}], "prompts": ["Why do unstated assumptions endanger alignment? Give an example question that surfaces one.", "Name three ways to categorize stakeholders and when each is useful.", "How does a sprint review align expectations more powerfully than a status report?", "Describe a mentoring action you'd take for a first-time sponsor."], "questions": [{"stem": "The sales VP expects the new platform to launch with full analytics; the CTO expects a minimal secure core first. Both cite the charter. What should the PM do?", "options": ["Build both expectations into the plan to satisfy each", "Facilitate a working session with both leaders to align on prioritized success criteria tied to business value, and update the charter/roadmap accordingly", "Ask the sponsor to decide between them", "Follow the CTO since technical feasibility governs"], "answer": 1, "rationale": "<p>Facilitate alignment around value and document the agreed expectations. A creates scope conflict and likely overruns; C abdicates facilitation (escalate only if alignment fails); D picks a side without alignment.<\/p>\n<hr />"}]}, {"id": "I_6", "kind": "task", "dom": "d1", "code": "I-6", "label": "I-6 · Manage Stakeholder Expectations", "nav": "I-6 Manage Stakeholder Expectations", "title": "Manage Stakeholder Expectations", "prose": "<p><strong>🎯 Why this matters.<\/strong> Aligning once isn't enough — expectations drift as reality unfolds. This task is the <em>maintenance<\/em> loop: keep outcomes and expectations matched for internal and external customers, monitor satisfaction, and respond.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify internal and external customer expectations • Align and maintain outcomes to those expectations • Monitor customer satisfaction/expectations and respond as needed.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Internal vs. external customers:<\/strong> internal (departments, operations teams receiving the deliverable) and external (paying customers, end users, regulators). Their expectations differ and sometimes conflict — e.g., external users want features fast; internal ops wants stability and documentation.\n- <strong>Maintain the match both ways:<\/strong> either steer <em>outcomes<\/em> toward expectations (adjust priorities, quality, timing through proper process) or steer <em>expectations<\/em> toward achievable outcomes (transparent communication about constraints, trade-offs, forecasts). Never silently let a gap grow.\n- <strong>Monitor satisfaction:<\/strong> surveys/NPS, sprint review feedback, acceptance rates, complaint/issue trends, engagement signals (attendance, responsiveness). Treat declining satisfaction as an early-warning indicator, investigate, respond.\n- <strong>Under-promise honestly, deliver reliably.<\/strong> Managing expectations is about <em>no surprises<\/em>: forecast realistically, flag risks early, communicate changes and their impacts promptly.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> the increment itself is the expectation-management tool — frequent demos keep expectations tethered to reality; the product owner continuously renegotiates priorities.\n- <em>Predictive:<\/em> expectation management rides on status reporting, forecasts (e.g., EAC), milestone reviews, and formal change communication.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Customer is unhappy though the project is on plan\" → <strong>meet them to understand the expectation gap<\/strong> — expectations, not baselines, define perceived success.\n- \"You realize a commitment can't be met\" → <strong>inform the affected stakeholders promptly with options<\/strong> — never wait, never hide, never quietly cut quality.<\/p>", "cards": [{"front": "Expectation gap", "back": "Difference between stakeholder expectation and likely outcome — close it early"}, {"front": "Internal customer", "back": "Party inside the organization receiving project outputs"}, {"front": "Satisfaction monitoring", "back": "Surveys, feedback at reviews, acceptance/complaint trends"}, {"front": "No-surprises principle", "back": "Bad news early with options beats bad news late"}], "prompts": ["What are your two levers when outcomes and expectations diverge?", "Give three concrete signals you'd monitor as satisfaction indicators.", "Why can a project be \"green\" on all baselines yet failing? What do you do?"], "questions": [{"stem": "Metrics show the project on schedule and budget, but the sprint review attendance of key business stakeholders has collapsed and survey feedback turned negative. What should the PM do?", "options": ["Continue executing; objective metrics show success", "Investigate the satisfaction decline with those stakeholders, identify the expectation gap, and adjust engagement and/or priorities accordingly", "Replace the surveys with quarterly reporting to reduce noise", "Ask the sponsor to mandate attendance at reviews"], "answer": 1, "rationale": "<p>Perceived value defines success; investigate the gap and respond. A ignores the leading indicator; C shoots the messenger; D compels presence without addressing cause.<\/p>\n<hr />"}]}, {"id": "I_7", "kind": "task", "dom": "d1", "code": "I-7", "label": "I-7 · Help Ensure Knowledge Transfer", "nav": "I-7 Help Ensure Knowledge Transfer", "title": "Help Ensure Knowledge Transfer", "prose": "<p><strong>🎯 Why this matters.<\/strong> Projects generate knowledge that walks out the door when people rotate off. Knowledge transfer converts individual experience into organizational capability — and protects the project when key people leave mid-flight.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify knowledge critical to the project • Gather knowledge • Foster an environment for knowledge transfer.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Two kinds of knowledge:<\/strong> <strong>explicit<\/strong> (codifiable — documents, wikis, code comments, runbooks, lessons-learned register) and <strong>tacit<\/strong> (experience, judgment, know-how — transferred through interaction: pairing, shadowing, mentoring, communities of practice, storytelling). Managing only explicit knowledge misses most of what matters.\n- <strong>Identify critical knowledge:<\/strong> what would hurt if lost? Single points of knowledge failure (the \"bus factor\"), specialized configurations, stakeholder history, decision rationale.\n- <strong>Gather continuously, not just at closure:<\/strong> lessons-learned register updated throughout; retrospectives every iteration; decision logs; documentation as part of the definition of done.\n- <strong>Foster the environment:<\/strong> knowledge flows where there's trust and time — psychological safety (people admit what went wrong), recognition for sharing (not hoarding), accessible repositories, working agreements that include documentation, deliberate pairing/rotation.\n- <strong>At transitions:<\/strong> structured handover to operations (runbooks, training, hypercare), offboarding checklists when members leave.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> retrospectives, pairing/mobbing, collective code ownership, and definition-of-done documentation make transfer continuous.\n- <em>Predictive:<\/em> lessons-learned register through the life cycle plus formal end-of-phase/project lessons sessions archived to <strong>OPAs<\/strong>.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Key expert is leaving in two weeks\" → <strong>plan structured transfer now<\/strong>: pairing/shadowing + documentation of critical tacit knowledge — not just \"ask them to write everything down\" (tacit doesn't fully codify) and not counting on a replacement to figure it out.\n- Lessons learned are captured <strong>throughout<\/strong>, and consulted <strong>at the start<\/strong> of new work (check OPAs first).<\/p>", "cards": [{"front": "Explicit knowledge", "back": "Codifiable: documents, data, procedures"}, {"front": "Tacit knowledge", "back": "Experiential know-how; transfers via interaction, not documents"}, {"front": "Lessons-learned register", "back": "Living log of what worked/failed and recommendations — updated throughout"}, {"front": "Community of practice", "back": "Group sharing a discipline's knowledge across teams"}, {"front": "Bus factor", "back": "Risk concentration in one person's head"}], "prompts": ["Explain tacit vs. explicit knowledge with an example of transferring each.", "Name four practices that foster a knowledge-sharing environment.", "When are lessons learned captured — and when consumed?"], "questions": [{"stem": "Your only integration specialist resigns effective in three weeks; a replacement starts in six. What should the PM do FIRST?", "options": ["Request the specialist document all integration procedures before leaving", "Identify the critical knowledge at risk, then plan combined transfer: documentation for explicit items plus pairing/shadowing sessions with remaining team members for tacit know-how", "Delay integration work until the replacement is onboarded", "Escalate to HR to negotiate a longer notice period"], "answer": 1, "rationale": "<p>Identify what's critical, then match transfer method to knowledge type — documents alone can't carry tacit judgment. A is partial; C stalls delivery; D may help but isn't the PM's first, controllable action.<\/p>\n<hr />"}]}, {"id": "I_8", "kind": "task", "dom": "d1", "code": "I-8", "label": "I-8 · Plan and Manage Communication", "nav": "I-8 Plan and Manage Communication", "title": "Plan and Manage Communication", "prose": "<p><strong>🎯 Why this matters.<\/strong> PMs spend the majority of their time communicating; most project problems are, at root, communication problems. The 2026 ECO stresses strategy, transparency, feedback loops, and reporting aligned to governance.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Define a communication strategy • Promote transparency and collaboration • Establish a feedback loop • Understand reporting requirements • Create reports aligned with sponsor and stakeholder expectations • Support reporting and governance processes.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Strategy = who needs what, when, how, from whom, and why.<\/strong> Built from stakeholder analysis: for each audience define purpose, content, format, channel, frequency, owner. Document as the communications management plan (predictive) or team working agreements + cadence of ceremonies (agile).\n- <strong>Dimensions to tailor:<\/strong> internal/external, formal/informal, vertical/horizontal, official/unofficial, written/verbal.\n- <strong>Methods:<\/strong>\n  - <strong>Interactive<\/strong> (meetings, calls, IM) — best for ambiguity, decisions, conflict.\n  - <strong>Push<\/strong> (email, reports) — sender-initiated; delivery ≠ understanding.\n  - <strong>Pull<\/strong> (repositories, dashboards, information radiators) — audience self-serves; good for large audiences and reference detail.\n- <strong>Communication channels grow combinatorially:<\/strong> n(n−1)/2 — with 10 people, 45 channels — which is why larger stakeholder sets need structured communication.\n- <strong>The model:<\/strong> sender encodes → medium (noise!) → receiver decodes → <strong>feedback/acknowledgment<\/strong>. Effective communication is confirmed understanding, not transmission. Hence the ECO's <em>feedback loop<\/em>: solicit responses, check comprehension, invite questions, act on input — and close the loop by showing what changed.\n- <strong>Transparency:<\/strong> honest status (including bad news), visible artifacts (dashboards, radiators), open decision logs. Transparency builds the trust that engagement (I-4) depends on.\n- <strong>Reporting &amp; governance:<\/strong> learn what governance requires (formats, cycles, thresholds, escalation paths — see III-1) and produce reports that answer stakeholders' actual questions — progress vs. plan, forecasts, risks/issues, decisions needed. Tailor altitude: executives get exceptions and trends; teams get actionable detail. <strong>5C's of written communication:<\/strong> clear, concise, correct, coherent, controlled.\n- <strong>Cross-cultural &amp; virtual:<\/strong> mind time zones, language simplicity, cultural norms around directness/hierarchy, and richer media for sensitive topics; over-communicate decisions in distributed teams.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> osmotic and event-based communication — standups, reviews, retrospectives, big visible charts (burndown/burnup, kanban) replace much formal reporting; transparency is a pillar.\n- <em>Predictive:<\/em> a formal communications management plan with scheduled reports and meetings; performance reporting (status, progress, forecast) feeds governance.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Stakeholder complains they didn't know X\" → check/revise <strong>the communication plan and its execution for that stakeholder<\/strong> — tailor, don't blast more email at everyone.\n- Sensitive or conflict-laden message → <strong>interactive, face-to-face (or video) first<\/strong>, document after.\n- \"Sponsor finds reports too detailed/irrelevant\" → <strong>ask what decisions they need to make and redesign the report to serve them<\/strong> (align with expectations enabler).<\/p>", "cards": [{"front": "Communications management plan", "back": "Who gets what info, when, how, from whom"}, {"front": "Interactive / push / pull", "back": "Dialogue / sent to receiver / receiver self-serves"}, {"front": "Channels formula", "back": "n(n−1)/2 potential communication paths"}, {"front": "Feedback loop", "back": "Confirm understanding, gather input, visibly act on it"}, {"front": "Information radiator", "back": "Big visible chart broadcasting status passively"}, {"front": "5C's", "back": "Clear, concise, correct, coherent, controlled"}], "prompts": ["Compute channels for a team of 8 that grows to 12. (28 → 66)", "Match each: crisis decision, monthly compliance report, reference architecture — to interactive/push/pull.", "What turns \"reporting\" into a feedback loop? Name two closing-the-loop behaviors.", "How would you redesign communication after two executives say status meetings waste their time?"], "questions": [{"stem": "A remote stakeholder in another region repeatedly misunderstands emailed status updates, causing rework. What should the PM do?", "options": ["Send longer, more detailed emails", "Copy the stakeholder's manager for accountability", "Switch to a short interactive call for key updates, confirm understanding, and follow up with a concise written summary", "Remove the stakeholder from the distribution list to reduce noise"], "answer": 2, "rationale": "Ambiguity + misunderstanding calls for interactive communication with a feedback check, then written confirmation. A adds volume, not comprehension; B escalates a communication design problem; D disengages a stakeholder."}, {"stem": "The steering committee asks why they learn about issues late despite weekly reports. Reviewing, you find reports list activities but bury risks and decisions needed. The BEST corrective action is:", "options": ["Increase reporting frequency to twice weekly", "Redesign the report around what governance needs: exceptions, trends, forecasts, top risks, and decisions required — validated with the committee", "Present the full risk register at each committee meeting", "Delegate reporting to workstream leads"], "answer": 1, "rationale": "<p>Align reports with governance/reporting requirements and stakeholder expectations — content design, not volume. A/C add noise; D changes the author, not the design.<\/p>\n<hr />"}]}, {"id": "gridI", "kind": "prose", "dom": "d1", "label": "Domain I — Rapid Recall Grid", "nav": "Rapid recall grid", "html": "<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>One-line essence<\/th>\n<th>Signature tool/technique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Vision<\/td>\n<td>Co-create, promote, refresh the \"why\"; root-cause misunderstandings<\/td>\n<td>Visioning workshop, 5 Whys<\/td>\n<\/tr>\n<tr>\n<td>2 Conflict<\/td>\n<td>Analyze context, collaborate first, ground rules<\/td>\n<td>Five approaches table, team charter<\/td>\n<\/tr>\n<tr>\n<td>3 Lead<\/td>\n<td>Serve, empower, unblock, include, flex style<\/td>\n<td>Situational leadership, RACI, Tuckman<\/td>\n<\/tr>\n<tr>\n<td>4 Engage<\/td>\n<td>Identify→analyze→tailor→engage→trust, continuously<\/td>\n<td>Power/interest grid, engagement matrix<\/td>\n<\/tr>\n<tr>\n<td>5 Align expectations<\/td>\n<td>Surface hidden assumptions; facilitate trade-offs; mentor<\/td>\n<td>Success criteria, MoSCoW<\/td>\n<\/tr>\n<tr>\n<td>6 Manage expectations<\/td>\n<td>Keep outcomes and expectations matched; monitor satisfaction<\/td>\n<td>Feedback surveys, demos, no-surprises forecasting<\/td>\n<\/tr>\n<tr>\n<td>7 Knowledge<\/td>\n<td>Identify critical knowledge; transfer tacit by interaction<\/td>\n<td>Lessons-learned register, pairing, retrospectives<\/td>\n<\/tr>\n<tr>\n<td>8 Communication<\/td>\n<td>Right info, right people, right way; feedback loops; transparent<\/td>\n<td>Comms plan, interactive/push/pull, radiators<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "domII", "kind": "prose", "dom": "d2", "label": "Domain II — Process", "nav": "Domain II overview", "html": "<h2>Advance Organizer — The Story of This Domain<\/h2>\n<p>Process is the largest domain and follows the shape of delivery itself: you <strong>integrate the plan and choose the approach<\/strong> (Task 1), pin down <strong>scope<\/strong> (2) and steer by <strong>value<\/strong> (3); you mobilize <strong>resources<\/strong> (4), <strong>procurement<\/strong> (5), and <strong>finance<\/strong> (6); you build in <strong>quality<\/strong> (7) and sequence via the <strong>schedule<\/strong> (8); you continuously <strong>evaluate status<\/strong> (9); and you <strong>close<\/strong> deliberately (10). Memory hook for the ten: <strong>\"I Plan Scope for Value; Resources, Procurement, Finance fuel it; Quality and Schedule shape it; Status and Closure prove it.\"<\/strong><\/p>"}, {"id": "II_1", "kind": "task", "dom": "d2", "code": "II-1", "label": "II-1 · Develop an Integrated Project Management Plan and Plan Delivery", "nav": "II-1 Develop an Integrated Project Management Plan and Plan Delivery", "title": "Develop an Integrated Project Management Plan and Plan Delivery", "prose": "<p><strong>🎯 Why this matters.<\/strong> Integration is <em>the<\/em> PM's unique job: everything connects to everything. This task covers sizing the project, choosing the development approach, building and maintaining one coherent plan, and making data-informed decisions — the spine that all other Process tasks hang from.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Assess project needs, complexity, and magnitude • Recommend a development approach (predictive, adaptive/agile, hybrid) • Determine critical information requirements (e.g., sustainability) • Recommend an execution strategy • Create an integrated PM plan • Estimate work effort and resource requirements • Assess consolidated plans for dependencies, gaps, and continued business value • Maintain the plan • Collect and analyze data for informed decisions.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Assess before planning:<\/strong> clarify objectives, complexity drivers (technical novelty, stakeholder count, regulatory load, uncertainty), magnitude, constraints, and organizational context (EEFs/OPAs). Complexity assessment shapes governance depth, approach, and tailoring.\n- <strong>Choose the development approach<\/strong> (PMBOK 8 selection considerations): \n  - Product/requirements: how stable and well understood? Ease of change? Safety/regulatory criticality?\n  - Project: stakeholder availability for continuous feedback? Funding model? Delivery cadence possible?\n  - Organization: culture, structure, team capability and colocation.\n  - Rule of thumb: stable + high change cost + heavy regulation → predictive; volatile + fast feedback loops feasible → adaptive; mixed → <strong>hybrid<\/strong> (e.g., predictive hardware build + agile software).\n- <strong>Critical information requirements:<\/strong> define up front what information the project must generate and track — including <strong>sustainability<\/strong> data (environmental/social impacts), compliance evidence, benefits measures. If you don't plan for the information, you can't manage by it.\n- <strong>The integrated PM plan:<\/strong> the umbrella that unifies subsidiary plans (scope, schedule, finance/cost, quality, resources, communications, risk, procurement, stakeholder engagement) plus baselines and life-cycle/approach decisions. In adaptive settings the \"plan\" is leaner: roadmap, release plan, backlog, working agreements — but integration still happens (dependencies, budgets, governance).\n- <strong>Estimate effort and resources<\/strong> (first-pass, refined later): analogous (fast, coarse — from similar projects), parametric (rate × quantity), bottom-up (sum of detailed pieces — accurate, slow), three-point (optimistic/most-likely/pessimistic; <strong>PERT: (O + 4M + P)/6<\/strong>), and relative/story points in agile (team-owned, refined by velocity data).\n- <strong>Integration checks:<\/strong> review consolidated plans for <strong>dependencies<\/strong> (cross-team, cross-project — see also II-8), <strong>gaps<\/strong> (unowned work, unfunded scope), and <strong>continued business value<\/strong> (does the business case still hold? — tie to II-3 and III-8).\n- <strong>Maintain the plan:<\/strong> plans are living — updated via change control (predictive) or rolling-wave/backlog refinement (adaptive). <strong>Progressive elaboration<\/strong> is normal, scope creep is not.\n- <strong>Data-informed decisions:<\/strong> define metrics up front, collect actuals, analyze variances and trends, decide (this loop is elaborated in II-9). AI-assisted analytics increasingly support estimation and forecasting — the PM remains accountable for judgment.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Predictive:<\/em> comprehensive plan + baselines before execution; changes via CCB.\n- <em>Agile:<\/em> multi-level planning (vision → roadmap → release → iteration → daily); plan just enough, just in time.\n- <em>Hybrid:<\/em> explicitly define which components run which way, and how they interface (integration points, shared milestones, one governance view).<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Which approach should the PM recommend?\" → match the <strong>stem's context clues<\/strong> (requirement stability, regulation, feedback access) to the approach — never a blanket \"agile is modern.\"\n- \"Team wants to start executing while planning is incomplete\" (predictive) → complete sufficient planning first; in agile, start delivering with a refined-enough backlog — approach determines the answer.\n- A gap or dependency discovered across plans → the PM integrates: bring the owning parties together, resolve, update the plan through proper process.<\/p>", "cards": [{"front": "Project management plan", "back": "Integrated umbrella of subsidiary plans + baselines + approach"}, {"front": "Development approach", "back": "Predictive / adaptive / hybrid — chosen from product, project, org factors"}, {"front": "Rolling-wave planning", "back": "Detail near-term work; keep far-term at higher level"}, {"front": "PERT / three-point", "back": "(O + 4M + P) / 6 — beta-weighted expected duration/effort"}, {"front": "Analogous estimating", "back": "Top-down from similar past work — fast, less accurate"}, {"front": "Parametric estimating", "back": "Statistical rate × quantity (e.g., cost per m²)"}, {"front": "Bottom-up estimating", "back": "Aggregate detailed component estimates — accurate, effortful"}, {"front": "Hybrid approach", "back": "Mix of predictive and adaptive components in one project"}], "prompts": ["List five factors that push a project toward predictive, and five toward adaptive.", "Compute PERT for O=4, M=6, P=14 days. (Answer: 7)", "What belongs inside an integrated PM plan? Name eight subsidiary plans.", "How is \"maintaining the plan\" done differently in predictive vs. agile?", "What are \"critical information requirements,\" and why does sustainability appear there?"], "questions": [{"stem": "A project will replace a hospital's medication-dispensing hardware (strict regulatory validation) and build a companion scheduling app whose requirements are still emerging. What approach should the PM recommend?", "options": ["Predictive for everything, since healthcare is regulated", "Adaptive for everything, to maximize responsiveness", "Hybrid: predictive for the regulated hardware replacement, adaptive for the evolving app, with defined integration points", "Defer the choice until requirements stabilize"], "answer": 2, "rationale": "Different components have different stability and compliance profiles — the textbook hybrid case with planned integration. A suffocates the app's learning loop; B endangers regulatory validation; D delays a decision the plan depends on."}, {"stem": "During plan consolidation, the PM finds the data-migration work assumed by two workstreams isn't in either one's plan or budget. What should the PM do FIRST?", "options": ["Add the work to the schedule and inform both leads", "Raise a risk for potential migration delays", "Bring the workstream leads together to confirm the gap, define ownership and estimates, and update the integrated plan through the appropriate process", "Escalate the funding shortfall to the sponsor"], "answer": 2, "rationale": "Integration duty: verify the gap, assign ownership, estimate, and update the plan properly. A acts unilaterally without analysis; B logs instead of solving a known gap (it's an issue in the plan, not an uncertain event); D escalates before the PM has shaped the ask."}, {"stem": "Your sponsor asks how confident you are in a 6-month duration estimate built by analogy to one previous project. The BEST response is to:", "options": ["Assure the sponsor analogous estimates are industry standard", "Explain the estimate's low-precision basis and refine it with bottom-up or three-point estimating as scope detail firms up, communicating a range with assumptions", "Add a 50% buffer to be safe", "Convert the estimate to story points"], "answer": 1, "rationale": "<p>Match estimating technique to information maturity, communicate uncertainty honestly (ranges + assumptions). A oversells; C is arbitrary padding, not analysis; D confuses paradigms.<\/p>\n<hr />"}]}, {"id": "II_2", "kind": "task", "dom": "d2", "code": "II-2", "label": "II-2 · Develop and Manage Project Scope", "nav": "II-2 Develop and Manage Project Scope", "title": "Develop and Manage Project Scope", "prose": "<p><strong>🎯 Why this matters.<\/strong> Scope defines the boundary of everything else — schedule, cost, quality, and expectations. The 2026 enablers are lean but deep: define scope, get agreement, break it down.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Define scope • Obtain stakeholder agreement on project scope • Break down scope.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>From needs to scope:<\/strong> elicit and analyze <strong>requirements<\/strong> (interviews, workshops/JAD, observation, prototyping, surveys, document analysis; user stories in agile) and record them (requirements documentation + <strong>requirements traceability matrix<\/strong> linking each requirement to origin and to deliverables/tests — your anti-orphan, anti-gold-plating device).\n- <strong>Define scope:<\/strong> the <strong>project scope statement<\/strong> captures product scope description, deliverables, <strong>acceptance criteria<\/strong>, and — crucially — <strong>exclusions<\/strong> (what's out), assumptions, constraints. Explicit exclusions prevent the most common expectation fights. Product scope = features/functions of the product; project scope = the work to deliver it.\n- <strong>Obtain agreement:<\/strong> review scope with key stakeholders and secure sign-off (predictive: approved scope baseline = scope statement + WBS + WBS dictionary) or shared understanding of the backlog and <strong>definition of done<\/strong> (agile). Agreement is the moment expectations (I-5) crystallize into commitments.\n- <strong>Break it down:<\/strong>\n  - <em>Predictive:<\/em> <strong>WBS<\/strong> — hierarchical decomposition of 100% of the work into <strong>work packages<\/strong> (the 100% rule: the WBS contains all the work and only the work). WBS dictionary details each element.\n  - <em>Agile:<\/em> <strong>epics → features → user stories<\/strong> in a product backlog, ordered by value; stories refined until they meet the team's readiness bar; each has acceptance criteria; <strong>INVEST<\/strong> quality check (Independent, Negotiable, Valuable, Estimable, Small, Testable).\n- <strong>Validate vs. control:<\/strong> <strong>validation<\/strong> = formal acceptance of deliverables by the customer (against acceptance criteria; each sprint review in agile); <strong>control<\/strong> = monitoring scope status and managing changes to the baseline/backlog. <strong>Scope creep<\/strong> = uncontrolled growth without adjusting time/cost/resources; <strong>gold plating<\/strong> = team adds unrequested extras — both are wrong; all additions go through change control or product-owner-prioritized backlog.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Aspect<\/th>\n<th>Predictive<\/th>\n<th>Agile<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scope definition<\/td>\n<td>Fully defined up front; baselined<\/td>\n<td>Emerges; backlog continuously refined<\/td>\n<\/tr>\n<tr>\n<td>Breakdown<\/td>\n<td>WBS → work packages<\/td>\n<td>Epics → stories<\/td>\n<\/tr>\n<tr>\n<td>Agreement<\/td>\n<td>Formal sign-off on baseline<\/td>\n<td>Definition of done + PO acceptance<\/td>\n<\/tr>\n<tr>\n<td>Change<\/td>\n<td>Change request → CCB<\/td>\n<td>Reprioritize backlog (PO decides)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Stakeholder asks the team directly for \"a small addition\" → predictive: <strong>submit a change request and assess impact<\/strong>; agile: <strong>route to the product owner for backlog prioritization<\/strong>. The team never just does it.\n- \"Deliverable rejected at acceptance\" → check against documented <strong>acceptance criteria<\/strong>; if criteria were unclear, that's an alignment failure to fix, not a blame hunt.\n- WBS questions: it decomposes <strong>deliverables/work<\/strong>, not org charts or schedules; work packages are its lowest level; the 100% rule is a favorite distractor test.<\/p>", "cards": [{"front": "Scope baseline", "back": "Scope statement + WBS + WBS dictionary (approved)"}, {"front": "WBS / work package", "back": "Hierarchical decomposition of all work / its lowest level"}, {"front": "100% rule", "back": "WBS captures all the work and only the work"}, {"front": "Requirements traceability matrix", "back": "Requirement → source → deliverable/test linkage"}, {"front": "Acceptance criteria", "back": "Conditions a deliverable must meet to be accepted"}, {"front": "Definition of done", "back": "Agile team's shared quality checklist for \"complete\""}, {"front": "Scope creep vs. gold plating", "back": "Uncontrolled additions vs. team-initiated extras — both bypass process"}, {"front": "INVEST", "back": "Good story: Independent, Negotiable, Valuable, Estimable, Small, Testable"}], "prompts": ["What three artifacts make up the scope baseline?", "Distinguish product scope from project scope; validation from control; creep from gold plating.", "How does scope agreement differ between predictive and agile — and what plays the \"acceptance criteria\" role in each?", "Recite INVEST and explain why \"Small\" and \"Testable\" matter."], "questions": [{"stem": "A developer proudly demos an extra dashboard feature \"the users will love\" that was never requested. The project is on schedule. What should the PM do?", "options": ["Congratulate the initiative and include the feature", "Explain why unrequested additions (gold plating) bypass scope control, assess any impacts, and route the idea through the change process/product owner for a value-based decision", "Order the feature removed immediately", "Ask QA to test it and keep it if it passes"], "answer": 1, "rationale": "Gold plating adds risk, cost, and support burden without a value decision; the idea may be good — so channel it properly. A rewards process bypass; C wastes a possibly valuable idea without assessment; D validates quality, not scope legitimacy."}, {"stem": "Mid-project, the client insists a reporting module was \"always implied.\" Your scope statement lists reporting under exclusions. What should the PM do FIRST?", "options": ["Refuse, citing the signed scope statement", "Review the documented scope and exclusions with the client, understand the underlying need, and if they want it, initiate a change request with impact analysis", "Add the module since the client is always right", "Escalate the disagreement to legal"], "answer": 1, "rationale": "<p>Use the documentation to re-align, stay collaborative, and channel new scope through change control. A is technically right but relationship-blind and skips the change path; C is creep; D is premature escalation.<\/p>\n<hr />"}]}, {"id": "II_3", "kind": "task", "dom": "d2", "code": "II-3", "label": "II-3 · Help Ensure Value-Based Delivery", "nav": "II-3 Help Ensure Value-Based Delivery", "title": "Help Ensure Value-Based Delivery", "prose": "<p><strong>🎯 Why this matters.<\/strong> The signature 2026 task: PMI's success definition is value worth the effort and expense. You prioritize by value, deliver incrementally where possible, keep testing the business case, and measure benefits.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify value components with key stakeholders • Prioritize work based on value and stakeholder feedback • Assess opportunities to deliver value incrementally • Examine business value throughout • Verify a measurement system tracks benefits • Evaluate delivery options to demonstrate value.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>What counts as value:<\/strong> financial (revenue, savings), customer (satisfaction, retention), operational (efficiency, quality), strategic (market position, capability), societal/sustainability (environmental and social outcomes), risk reduction, compliance. Identify components <em>with stakeholders<\/em> — value is in their eyes.\n- <strong>The value chain:<\/strong> outputs → outcomes → <strong>benefits<\/strong> → value. The <strong>business case<\/strong> states expected value and cost; the <strong>benefits realization plan<\/strong> states which benefits, how measured, when, and who owns them (often realized after project close — hand measurement to an owner).\n- <strong>Prioritize by value:<\/strong> backlog ordering by value vs. effort/risk; <strong>MoSCoW<\/strong>; weighted shortest job first-style thinking (value ÷ size); cost of delay (what value is lost per unit time of waiting?); kill or descope low-value work without sentiment (sunk costs are sunk).\n- <strong>Incremental delivery:<\/strong> slice releases so usable value ships early — an <strong>MVP<\/strong> (minimum viable product) tests value assumptions with least effort; each increment both delivers value and generates feedback that re-prioritizes the rest. Even predictive projects can phase deliveries (e.g., site-by-site rollout).\n- <strong>Examine value continuously:<\/strong> at gates/reviews ask \"does the business case still hold?\" — changed market, costs, or strategy can turn a healthy project into a value-negative one (link to III-8). Recommending early termination of a value-dead project is <em>good<\/em> project management.\n- <strong>Measure benefits:<\/strong> define leading indicators (adoption, usage, cycle time) and lagging ones (revenue, savings); verify a <strong>measurement system exists<\/strong> — baseline before, target after, data owner named. No measurement, no demonstrated value.\n- <strong>Evaluate delivery options:<\/strong> build vs. buy vs. partner; big-bang vs. phased; pilot first — choose the option that demonstrates value earliest at acceptable risk.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> value is the operating system — PO orders the backlog by value; every review inspects delivered value.\n- <em>Predictive:<\/em> value discipline lives in the business case, gate reviews, benefits plan, and phased-delivery choices.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Two features compete for a sprint → pick by <strong>stakeholder value / cost of delay<\/strong>, not by ease, politics, or who shouted loudest.\n- \"Halfway through, a market shift erases the product's advantage\" → <strong>re-examine the business case with sponsor/governance<\/strong>; recommending descoping or termination can be the right answer.\n- \"How do we know the project succeeded?\" → benefits measurement against the business case — not \"delivered on time and budget.\"<\/p>", "cards": [{"front": "Business case", "back": "Justification: expected benefits/value vs. cost and risk"}, {"front": "Benefits realization plan", "back": "Which benefits, metrics, timing, owners — often post-project"}, {"front": "MVP", "back": "Smallest product that delivers/test value with real users"}, {"front": "Cost of delay", "back": "Value lost per unit time of postponement — prioritization lens"}, {"front": "Increment", "back": "Usable slice of value delivered early and often"}, {"front": "Outcome vs. output", "back": "Change achieved vs. thing produced"}, {"front": "Sunk cost", "back": "Already spent; irrelevant to go-forward decisions"}], "prompts": ["Trace the chain output → outcome → benefit → value with one example.", "Name four value components beyond money.", "What two things does an increment produce (hint: value and ___)?", "Your project is on plan but the business case has collapsed. What do you do, and why is that good PM?", "What makes a benefits measurement system real rather than aspirational? (Three elements.)"], "questions": [{"stem": "The product owner asks for help ordering the backlog. Feature A saves $200k/yr and takes 4 sprints; Feature B saves $60k/yr and takes 1 sprint; a regulator requires Feature C within 2 sprints. What ordering logic is BEST?", "options": ["A first — highest total value", "B first — quickest win", "C first (compliance deadline = enormous cost of delay/noncompliance), then compare A and B on value-per-effort and cost of delay", "Alphabetical by request date for fairness"], "answer": 2, "rationale": "Compliance deadlines carry step-change consequences (see III-2); after that, value density (value ÷ effort) and cost of delay order the rest. A ignores the deadline; B optimizes locally; D isn't prioritization."}, {"stem": "Six months into a 12-month product build, a competitor launches a free equivalent. The team is on schedule and morale is high. What should the PM do?", "options": ["Accelerate delivery to beat remaining competitors", "Continue — the charter hasn't changed", "Reassess the business case with the sponsor and key stakeholders: quantify the value impact and evaluate options (pivot, descope, terminate)", "Reduce cost to preserve ROI"], "answer": 2, "rationale": "<p>Examine business value throughout; external change can invalidate the case (also III-8). A/D act before analysis; B mistakes plan compliance for success.<\/p>\n<hr />"}]}, {"id": "II_4", "kind": "task", "dom": "d2", "code": "II-4", "label": "II-4 · Plan and Manage Resources", "nav": "II-4 Plan and Manage Resources", "title": "Plan and Manage Resources", "prose": "<p><strong>🎯 Why this matters.<\/strong> Deliverables need people, equipment, materials, and facilities in the right amounts at the right times. Two lean enablers: plan from requirements; then manage and optimize availability.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Define and plan resources based on requirements • Manage and optimize resource needs and availability.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Plan from the work:<\/strong> derive resource requirements from scope/backlog and estimates (what skills, how many, when, physical resources too). Artifacts: <strong>resource management plan<\/strong>, <strong>resource breakdown structure<\/strong> (by category/type), responsibility assignment (<strong>RACI<\/strong>), resource calendars (availability, holidays, part-time constraints).\n- <strong>Acquire:<\/strong> negotiate with functional managers (matrix reality — you often don't own your people), pre-assignment, or procurement for external resources. Weigh colocated vs. virtual teams.\n- <strong>Optimize:<\/strong>\n  - <strong>Resource leveling<\/strong> — resolve over-allocation by shifting activities; <strong>may extend the critical path/finish date<\/strong> (people can't do two things at once).\n  - <strong>Resource smoothing<\/strong> — adjust within float only; <strong>finish date protected<\/strong>, but may not resolve all peaks.\n- <strong>Manage availability continuously:<\/strong> monitor utilization, forecast upcoming needs, resolve conflicts between projects (escalate scarce-resource conflicts to the appropriate governance level with options), release resources gracefully when done (and capture their knowledge — I-7).\n- <strong>Physical resources:<\/strong> just-in-time vs. buffer stock, logistics, storage — waste and idle equipment are cost and sustainability issues.\n- <strong>Agile:<\/strong> prefer <strong>stable, dedicated, cross-functional teams<\/strong>; bring work to the team rather than assembling teams around work; capacity = velocity/throughput, not utilization %. Beware the utilization trap — 100% loaded teams have no slack to absorb variability and slow down (queueing effect).<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Predictive:<\/em> named resources per activity; histograms; leveling/smoothing.\n- <em>Agile:<\/em> fixed team, flowing work; optimize flow (limit WIP) rather than individual busyness.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Key resource pulled to another project\" → assess impact first, negotiate with the functional manager, explore alternatives (cross-training, resequencing), escalate with options only if unresolved.\n- Leveling vs. smoothing definitions — and which can move the end date — is a classic pair to keep straight.\n- Team member idle between tasks in agile → swarm on the sprint goal / pull the next backlog item — not \"assign them to another project.\"<\/p>", "cards": [{"front": "Resource leveling", "back": "Fixes over-allocation; can extend the schedule"}, {"front": "Resource smoothing", "back": "Uses only float; end date protected"}, {"front": "Resource breakdown structure", "back": "Hierarchy of resources by category/type"}, {"front": "Resource calendar", "back": "When each resource is actually available"}, {"front": "Cross-functional team", "back": "Team holding all skills needed to deliver an increment"}, {"front": "WIP limit", "back": "Cap on concurrent work to improve flow"}], "prompts": ["Leveling vs. smoothing: which respects float, which can slip the end date?", "Why is a 100%-utilized team often slower? (Think queues and variability.)", "Your best engineer is double-booked across two of your activities in the same week — walk through your options in order.", "How does agile answer \"we need a database skill we don't have on the team\"?"], "questions": [{"stem": "The resource histogram shows your lead designer allocated 160% for three weeks; the sponsor insists the end date cannot move. What should the PM do?", "options": ["Apply resource leveling to eliminate the over-allocation", "Apply resource smoothing within available float, and if peaks remain, evaluate options (additional/alternate resources, resequencing, scope discussion) to present with impacts", "Ask the designer to work the overtime", "Move the end date and inform the sponsor"], "answer": 1, "rationale": "<p>With the date constrained, smoothing (float-only) is the first tool; residual over-allocation becomes an options-and-impacts conversation. A may slip the protected date; C institutionalizes burnout; D violates the stated constraint without exploring options.<\/p>\n<hr />"}]}, {"id": "II_5", "kind": "task", "dom": "d2", "code": "II-5", "label": "II-5 · Plan and Manage Procurement", "nav": "II-5 Plan and Manage Procurement", "title": "Plan and Manage Procurement", "prose": "<p><strong>🎯 Why this matters.<\/strong> Buying work brings a second organization — with its own incentives — into your project. Contract type choice allocates risk; negotiation and vendor management determine whether that partnership produces value.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Plan procurement • Execute a procurement management plan • Select preferred contract types • Evaluate vendor performance • Verify procurement agreement objectives are met • Participate in agreement negotiations • Determine a negotiation strategy • Manage suppliers and contracts • Plan and manage the procurement strategy • Develop a delivery solution.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Make-or-buy first:<\/strong> compare cost, capability, capacity, IP concerns, strategic importance. Then set the <strong>procurement strategy<\/strong>: what to buy, in what packages, contract vehicles, delivery solution (single vendor, multi-vendor, partnership), and timeline.\n- <strong>Bid documents:<\/strong> <strong>RFI<\/strong> (learn the market), <strong>RFQ<\/strong> (price for a defined commodity), <strong>RFP<\/strong> (solution proposal for complex needs). <strong>SOW<\/strong> (statement of work) defines what the seller delivers; source-selection criteria (weighted scoring beyond price: capability, approach, risk, sustainability record) keep evaluation objective; bidder conferences ensure all sellers hear the same answers.\n- <strong>Contract types — the risk dial (memorize this table):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Buyer pays<\/th>\n<th>Cost risk sits with<\/th>\n<th>Use when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Firm Fixed Price (FFP)<\/strong><\/td>\n<td>Set price<\/td>\n<td><strong>Seller<\/strong><\/td>\n<td>Scope well defined and stable<\/td>\n<\/tr>\n<tr>\n<td><strong>FPIF<\/strong> (fixed price + incentive)<\/td>\n<td>Price + incentive on targets<\/td>\n<td>Mostly seller<\/td>\n<td>Defined scope; want performance incentives<\/td>\n<\/tr>\n<tr>\n<td><strong>FP-EPA<\/strong><\/td>\n<td>Fixed + economic price adjustment<\/td>\n<td>Shared (inflation/indices)<\/td>\n<td>Long-duration contracts<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost Plus Fixed Fee (CPFF)<\/strong><\/td>\n<td>Costs + fixed fee<\/td>\n<td><strong>Buyer<\/strong><\/td>\n<td>Scope uncertain; effort exploratory<\/td>\n<\/tr>\n<tr>\n<td><strong>CPIF<\/strong><\/td>\n<td>Costs + incentive fee (shared savings/overrun via ratio)<\/td>\n<td>Shared<\/td>\n<td>Uncertain scope, aligned incentives<\/td>\n<\/tr>\n<tr>\n<td><strong>CPAF<\/strong><\/td>\n<td>Costs + award fee (buyer's subjective judgment)<\/td>\n<td>Buyer<\/td>\n<td>Performance qualities hard to specify<\/td>\n<\/tr>\n<tr>\n<td><strong>Time &amp; Materials (T&amp;M)<\/strong><\/td>\n<td>Rate × time + materials<\/td>\n<td>Shared (buyer bears volume)<\/td>\n<td>Staff augmentation, small/undefined work; cap with not-to-exceed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Slider mnemonic: <strong>FFP → T&amp;M → CP<\/strong>: risk slides from seller to buyer as scope certainty falls.\n- <strong>Negotiation:<\/strong> prepare a strategy — objectives, priorities, <strong>BATNA<\/strong> (best alternative to negotiated agreement), walk-away point, concession plan; aim for a fair, win-win deal (a squeezed seller becomes a claims machine). The PM participates; contracting authority usually signs.\n- <strong>Manage the contract:<\/strong> monitor deliverables against SOW and acceptance criteria; <strong>vendor performance evaluations<\/strong> (quality, timeliness, responsiveness — scorecards); manage changes through the <strong>contract change control<\/strong> terms (all changes in writing); handle claims/disputes per contract (negotiation → mediation/arbitration → litigation as last resort); verify all objectives met before <strong>formal closure<\/strong> (acceptance, final payments, records archived, vendor evaluation to OPAs).\n- <strong>Agile procurement:<\/strong> favor collaborative structures — master services agreement + SOW per increment, capacity-based contracts, incremental funding with early-termination options — because fixed-scope contracts fight emergent requirements.<\/p>\n<\/blockquote>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Scope is vague; which contract?\" → cost-reimbursable or T&amp;M, never FFP (the seller either pads or fails).\n- Vendor underperforms → <strong>review the contract terms and meet the vendor to address performance against agreed criteria<\/strong> — not immediate termination, not public shaming.\n- All contract changes <strong>in writing<\/strong> through the contract's change process — verbal instructions to sellers are a trap answer.<\/p>", "cards": [{"front": "Make-or-buy analysis", "back": "Build internally vs. procure — cost, capability, IP, strategy"}, {"front": "RFI / RFQ / RFP", "back": "Learn market / get price / get solution proposal"}, {"front": "SOW", "back": "What the seller must deliver, precisely"}, {"front": "FFP", "back": "Seller carries cost risk; needs stable scope"}, {"front": "CPFF / CPIF / CPAF", "back": "Buyer carries cost risk; fee fixed / incentive / award"}, {"front": "T&amp;M", "back": "Pay-as-you-go rates; cap with not-to-exceed"}, {"front": "BATNA", "back": "Your best fallback if negotiation fails — defines walk-away"}, {"front": "Point of total assumption (FPIF)", "back": "Cost point where seller absorbs all further overrun"}], "prompts": ["Rebuild the contract-risk slider from memory (which end holds seller risk?).", "When would you pick CPIF over CPFF? FP-EPA over FFP?", "What belongs in a negotiation strategy? Define BATNA.", "Name four elements of proper procurement closure.", "Why do rigid FFP contracts clash with agile — and what structures fit better?"], "questions": [{"stem": "You must outsource R&amp;D-heavy prototype work whose requirements will evolve with findings. Which contract type is MOST appropriate?", "options": ["Firm fixed price to protect the budget", "Cost plus incentive fee, sharing cost performance risk while accommodating evolving scope", "FP-EPA to handle inflation", "Lump sum with heavy penalty clauses"], "answer": 1, "rationale": "Uncertain, exploratory scope → cost-reimbursable; the incentive fee aligns the seller with cost discipline. A/D force sellers to pad or litigate; C solves a price-index problem you don't have."}, {"stem": "A vendor's last two deliverables failed acceptance tests, jeopardizing a milestone. What should the PM do FIRST?", "options": ["Terminate the contract for cause", "Withhold all payments until quality improves", "Review contract quality terms and meet the vendor to analyze causes and agree a corrective action plan, documenting per the contract", "Hire a second vendor to redo the work"], "answer": 2, "rationale": "Manage the supplier: facts, contract terms, root causes, documented corrective plan — escalating remedies only if that fails. A and B are late-stage remedies with legal exposure; D adds cost before managing the relationship."}, {"stem": "Mid-negotiation, the seller's lead pressures you to accept a clause immediately, \"or the price rises tomorrow.\" Your BATNA is a qualified alternate vendor at 8% higher cost. What should you do?", "options": ["Accept — avoiding the 8% premium justifies it", "Evaluate the clause on its merits against your objectives and walk-away point; the pressure tactic doesn't change your BATNA-based position", "End negotiations to punish the tactic", "Counter with your own ultimatum"], "answer": 1, "rationale": "<p>Negotiation strategy discipline: decisions flow from objectives and BATNA, not artificial urgency. A rewards the tactic; C/D escalate emotion over interests.<\/p>\n<hr />"}]}, {"id": "II_6", "kind": "task", "dom": "d2", "code": "II-6", "label": "II-6 · Plan and Manage Finance", "nav": "II-6 Plan and Manage Finance", "title": "Plan and Manage Finance", "prose": "<p><strong>🎯 Why this matters.<\/strong> PMBOK 8 widened \"cost\" to <strong>Finance<\/strong>: funding needs, contingency and reserves, spend tracking, financial reporting, forecasting challenges, and governance over variances.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Analyze project financial needs • Quantify risk and contingency allocations • Plan spend tracking through the life cycle • Plan financial reporting • Anticipate future finance challenges • Monitor financial variations and work with governance • Manage financial reserves.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>From estimates to budget:<\/strong> estimate costs (same techniques as II-1: analogous, parametric, bottom-up, three-point) → aggregate into the <strong>cost baseline<\/strong> (time-phased budget; the S-curve) → add <strong>management reserve<\/strong> to get total funding. Know the ranges: <strong>rough order of magnitude (ROM)<\/strong> −25/+75% early → definitive −5/+10% later.\n- <strong>Reserves (a must-know pair):<\/strong>\n  - <strong>Contingency reserve<\/strong> — for <strong>identified (known-unknown) risks<\/strong>, quantified from risk analysis (e.g., EMV); <strong>inside the cost baseline<\/strong>; PM-controlled.\n  - <strong>Management reserve<\/strong> — for <strong>unidentified (unknown-unknown) work<\/strong>; <strong>outside the baseline<\/strong> (inside total budget); released via management approval and change control.\n- <strong>Funding &amp; spend planning:<\/strong> funding often arrives in tranches — reconcile spend plan with funding limits (funding-limit reconciliation may resequence work); plan the tracking system (cost codes, timesheets, accrual points, procurement commitments) before spending starts.\n- <strong>Earned Value Management (EVM) — the exam's favorite math:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Measure<\/th>\n<th>Meaning<\/th>\n<th>Formula<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PV<\/td>\n<td>Planned value — budgeted cost of scheduled work<\/td>\n<td>from baseline<\/td>\n<\/tr>\n<tr>\n<td>EV<\/td>\n<td>Earned value — budgeted cost of work actually done<\/td>\n<td>% complete × BAC<\/td>\n<\/tr>\n<tr>\n<td>AC<\/td>\n<td>Actual cost of work done<\/td>\n<td>from actuals<\/td>\n<\/tr>\n<tr>\n<td><strong>CV<\/strong><\/td>\n<td>Cost variance<\/td>\n<td><strong>EV − AC<\/strong> (negative = over budget)<\/td>\n<\/tr>\n<tr>\n<td><strong>SV<\/strong><\/td>\n<td>Schedule variance<\/td>\n<td><strong>EV − PV<\/strong> (negative = behind)<\/td>\n<\/tr>\n<tr>\n<td><strong>CPI<\/strong><\/td>\n<td>Cost efficiency<\/td>\n<td><strong>EV / AC<\/strong> (&lt;1 = over budget)<\/td>\n<\/tr>\n<tr>\n<td><strong>SPI<\/strong><\/td>\n<td>Schedule efficiency<\/td>\n<td><strong>EV / PV<\/strong> (&lt;1 = behind)<\/td>\n<\/tr>\n<tr>\n<td>BAC<\/td>\n<td>Budget at completion<\/td>\n<td>total baseline<\/td>\n<\/tr>\n<tr>\n<td><strong>EAC<\/strong><\/td>\n<td>Estimate at completion<\/td>\n<td><strong>BAC / CPI<\/strong> (typical variance) · AC + (BAC − EV) (variance atypical) · AC + (BAC − EV)/(CPI×SPI) (schedule pressure persists)<\/td>\n<\/tr>\n<tr>\n<td><strong>ETC<\/strong><\/td>\n<td>Estimate to complete<\/td>\n<td>EAC − AC<\/td>\n<\/tr>\n<tr>\n<td><strong>VAC<\/strong><\/td>\n<td>Variance at completion<\/td>\n<td>BAC − EAC<\/td>\n<\/tr>\n<tr>\n<td><strong>TCPI<\/strong><\/td>\n<td>Efficiency needed to finish on target<\/td>\n<td>(BAC − EV)/(BAC − AC), or /(EAC − AC)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Memory hooks: <strong>EV comes first<\/strong> in every variance/index; <strong>variance = subtraction, index = division<\/strong>; CPI uses <strong>AC<\/strong> (cost), SPI uses <strong>PV<\/strong> (plan).\n- <strong>Financial reporting &amp; governance:<\/strong> report burn vs. plan, variances, forecasts (EAC/VAC), reserve status — at the cadence and thresholds governance defines (III-1); breaching a variance threshold triggers analysis, corrective options, and possibly change control or escalation.\n- <strong>Anticipate challenges:<\/strong> currency exposure, inflation (FP-EPA link), funding cycle gaps, cash-flow timing vs. big procurements, rate changes — surface early with mitigation options.\n- <strong>Agile finance:<\/strong> fund stable <strong>teams/value streams<\/strong> per period rather than detailed task budgets; burn rate × sprints = cost forecast; re-justify continued funding by delivered value each increment (incremental funding).<\/p>\n<\/blockquote>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Calculations are usually one or two steps — write the formula, plug in, watch for which EAC variant the stem implies (\"variance is typical/atypical/continue at current performance\").\n- <strong>CPI 0.9, SPI 1.1<\/strong> → over budget, ahead of schedule: interpret before choosing an action answer.\n- Using management reserve → <strong>needs approval/change control<\/strong>; using contingency for its identified risk → PM authority.\n- \"Unexpected necessary work found\" that no risk covered → management reserve request, not silent absorption.<\/p>", "cards": [{"front": "Cost baseline", "back": "Time-phased approved budget (excludes management reserve)"}, {"front": "Contingency vs. management reserve", "back": "Known-unknowns, in baseline, PM / unknown-unknowns, outside, mgmt approval"}, {"front": "CV, SV", "back": "EV − AC, EV − PV"}, {"front": "CPI, SPI", "back": "EV/AC, EV/PV"}, {"front": "EAC (typical)", "back": "BAC / CPI"}, {"front": "TCPI", "back": "Required efficiency: (BAC−EV)/(BAC−AC)"}, {"front": "ROM estimate", "back": "−25% to +75% early-stage range"}, {"front": "Burn rate", "back": "Cost per iteration/period — agile forecasting basis"}], "prompts": ["BAC $400k; 40% of work complete; AC $180k; PV $200k. Compute EV, CV, SV, CPI, SPI, EAC (typical), VAC. <em>(EV160k; CV −20k; SV −40k; CPI 0.89; SPI 0.8; EAC ≈ 450k; VAC ≈ −50k.)<\/em>", "Which reserve covers which unknowns, and who releases each?", "TCPI comes out at 1.25 — say in plain words what that means and whether it's realistic.", "How is an agile project's cost forecast built?"], "questions": [{"stem": "Your project reports CPI = 0.83 and SPI = 1.05. The sponsor asks for an EAC assuming current cost performance continues. BAC is $600,000. The EAC is approximately:", "options": ["$600,000", "$630,000", "$723,000", "$498,000"], "answer": 2, "rationale": "EAC = BAC / CPI = 600,000 / 0.83 ≈ $722,900. The schedule index is a distractor for this variant."}, {"stem": "A risk in the register materializes and its planned response costs $25,000, which was quantified in the contingency reserve. What should the PM do?", "options": ["Submit a change request to access management reserve", "Execute the planned response using contingency reserve, update the risk register and financial tracking, and inform stakeholders per the plan", "Absorb the cost by cutting quality activities", "Escalate to the steering committee for funding approval"], "answer": 1, "rationale": "Contingency exists exactly for identified risks and sits within the PM's baseline authority; document and communicate. A/D confuse reserve types; C damages quality to hide a planned cost."}, {"stem": "Halfway through, previously unknown ground contamination requires remediation work no risk contemplated. The BEST course is to:", "options": ["Use remaining contingency reserve since it's available", "Request management reserve through the appropriate approval/change process, with impact analysis", "Fast-track other activities to absorb the cost", "Defer remediation to a follow-on project"], "answer": 1, "rationale": "<p>Unknown-unknown → management reserve, which requires approval and formal process. A misuses funds earmarked for identified risks; C confuses schedule technique with funding; D likely violates compliance (see III-2).<\/p>\n<hr />"}]}, {"id": "II_7", "kind": "task", "dom": "d2", "code": "II-7", "label": "II-7 · Plan and Optimize Quality of Products/Deliverables", "nav": "II-7 Plan and Optimize Quality of Products/Deliverables", "title": "Plan and Optimize Quality of Products/Deliverables", "prose": "<p><strong>🎯 Why this matters.<\/strong> Quality is conformance to requirements and fitness for use — built in, not inspected in. 2026 adds explicit links to regulatory compliance and <strong>sustainability within cost of quality<\/strong>.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Gather quality requirements • Plan quality processes and tools • Execute the quality management plan • Help ensure regulatory compliance • Manage cost of quality (CoQ) and sustainability • Conduct ongoing quality reviews • Implement continuous improvement.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Quality vs. grade:<\/strong> quality = degree requirements are met; grade = category of features. Low grade can be fine; low quality never is.\n- <strong>Gather quality requirements<\/strong> from stakeholders, standards, and regulation → define <strong>metrics<\/strong> (defect density, availability, response time, tolerance bands) and acceptance criteria; plan the processes and tools to achieve and verify them (<strong>quality management plan<\/strong>).\n- <strong>Two complementary activities:<\/strong>\n  - <strong>Manage quality / quality assurance<\/strong> — process-focused, preventive: are we <em>working the right way<\/em>? Audits, process analysis, design reviews.\n  - <strong>Control quality<\/strong> — product-focused, detective: does the <em>deliverable conform<\/em>? Inspection, testing, measurement against metrics.\n  - PMI bias: <strong>prevention over inspection<\/strong> (cheaper to prevent than to find; cheapest of all vs. customer-found).\n- <strong>Cost of Quality (CoQ):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Cost of conformance<\/th>\n<th>Cost of nonconformance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Prevention<\/strong> (training, good design, standards)<\/td>\n<td><strong>Internal failure<\/strong> (rework, scrap before delivery)<\/td>\n<\/tr>\n<tr>\n<td><strong>Appraisal<\/strong> (testing, inspection, audits)<\/td>\n<td><strong>External failure<\/strong> (warranty, recalls, liabilities, lost reputation)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Nonconformance costs dwarf conformance costs over the product's life — and 2026 explicitly folds <strong>sustainability<\/strong> into CoQ thinking: environmental waste, energy in rework, disposal, and social costs of failures are quality costs too.\n- <strong>Regulatory compliance:<\/strong> quality planning must embed regulatory requirements (validation protocols, traceability, documentation) — nonconformance here is a compliance event (III-2), not just rework.\n- <strong>The classic seven tools (recognize on sight):<\/strong> cause-and-effect/<strong>fishbone/Ishikawa<\/strong> (root causes), <strong>Pareto chart<\/strong> (80/20 — vital few causes), <strong>control chart<\/strong> (process stability: control limits, <strong>rule of seven<\/strong> — seven consecutive points one side of the mean = out of control/investigate), histogram, scatter diagram (correlation), flowchart, check sheet.\n- <strong>Ongoing reviews &amp; continuous improvement:<\/strong> peer reviews, test cycles, audits during the project — not one big inspection at the end; feed findings into <strong>PDCA (plan–do–check–act)<\/strong> / kaizen improvement loops (ties to III-6).\n- <strong>Agile quality:<\/strong> built-in via <strong>definition of done<\/strong>, automated testing/CI, pair programming, review of every increment, retrospectives improving the process each sprint.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Defects keep recurring\" → <strong>root-cause analysis (fishbone/5 Whys) and process fix<\/strong> — not more inspectors, not blame.\n- Control chart with points inside limits but seven in a row above the mean → <strong>investigate — the process shows non-random behavior<\/strong>.\n- Pressure to \"skip testing to hit the date\" → never silently cut quality; present impact/options (CoQ logic) and route any baseline change properly.<\/p>", "cards": [{"front": "Quality vs. grade", "back": "Meets requirements vs. feature category"}, {"front": "Manage quality (QA) vs. control quality (QC)", "back": "Right process (prevent) vs. conforming product (detect)"}, {"front": "Cost of quality", "back": "Prevention + appraisal vs. internal + external failure (+ sustainability impacts)"}, {"front": "Fishbone / Ishikawa", "back": "Structured root-cause branching diagram"}, {"front": "Pareto", "back": "Rank causes; attack the vital few (80/20)"}, {"front": "Control chart / rule of seven", "back": "Stability over time; 7 same-side points = investigate"}, {"front": "Definition of done", "back": "Agile's built-in quality gate per increment"}, {"front": "PDCA", "back": "Plan–Do–Check–Act improvement cycle"}], "prompts": ["Sort into CoQ quadrants: training, warranty claim, unit testing, scrap, certification audit, product recall.", "QA vs. QC — object, timing, example technique of each.", "Why does PMI prefer prevention economically? Add the sustainability angle.", "What does the rule of seven signal, and what do you do?"], "questions": [{"stem": "Integration testing keeps finding the same category of interface defect sprint after sprint. What should the PM/team do?", "options": ["Add a dedicated testing sprint before release", "Perform root-cause analysis (e.g., fishbone) on the defect category and change the process — e.g., interface standards and automated contract tests — then verify recurrence stops", "Assign defects to the responsible developers' performance reviews", "Raise acceptance thresholds so minor interface defects pass"], "answer": 1, "rationale": "Recurring defects are a process problem: root cause → preventive process change → verify. A inspects more instead of preventing; C blames individuals for systemic issues; D lowers quality by definition."}, {"stem": "The sponsor proposes cutting the certification test cycle to recover two weeks of schedule on a medical device project. The BEST response is:", "options": ["Agree — the schedule baseline takes priority", "Refuse and escalate to the regulator", "Explain the cost-of-quality and compliance consequences (external failure, regulatory exposure), and present schedule-recovery alternatives (crashing, fast-tracking other paths) through proper change control", "Quietly compress other testing instead"], "answer": 2, "rationale": "<p>Quality/compliance can't be silently traded; educate with CoQ logic and offer legitimate alternatives via process. A and D cut quality (D also hides it); B escalates outside before managing inside.<\/p>\n<hr />"}]}, {"id": "II_8", "kind": "task", "dom": "d2", "code": "II-8", "label": "II-8 · Plan and Manage Schedule", "nav": "II-8 Plan and Manage Schedule", "title": "Plan and Manage Schedule", "prose": "<p><strong>🎯 Why this matters.<\/strong> The schedule turns scope into a time-sequenced commitment — and is the most visible promise you make. 2026 emphasizes approach-appropriate s
