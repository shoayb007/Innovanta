<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP 2026 Study Companion</title>
<style>
:root{
  --ink:#22303B; --muted:#5B6B75; --paper:#F2F5F5; --card:#FFFFFF;
  --petrol:#0E4B5A; --petrol-soft:#E3EDEF;
  --d1:#8C4A73; --d1-soft:#F5EAF0; --d2:#0E6B57; --d2-soft:#E4F1EC; --d3:#9A6210; --d3-soft:#F6EEDD;
  --d0:#0E4B5A; --d0-soft:#E3EDEF;
  --good:#1E7A4A; --good-soft:#E2F2E8; --bad:#AE3B3F; --bad-soft:#F8E7E7;
  --line:#D9E1E2; --radius:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Avenir,Corbel,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.65}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--petrol);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
header{grid-column:1/-1;position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:10px 20px}
header h1{font-family:var(--serif);font-size:19px;margin:0;color:var(--petrol);letter-spacing:.2px;white-space:nowrap}
header h1 small{font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);display:block;letter-spacing:.12em;text-transform:uppercase}
#progressWrap{flex:1;max-width:520px}
#progressLabel{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:4px}
#progressBar{height:8px;background:var(--petrol-soft);border-radius:99px;overflow:hidden}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--d1),var(--petrol) 55%,var(--d2));border-radius:99px;transition:width .5s ease}
#scoreChip{font-size:12.5px;font-weight:600;color:var(--petrol);background:var(--petrol-soft);padding:5px 12px;border-radius:99px;white-space:nowrap}
#menuBtn{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.brand-logo-link{display:flex;align-items:center;flex:none;border-radius:8px}
.brand-logo-link:focus-visible{outline:3px solid var(--petrol);outline-offset:2px}
.brand-logo{width:32px;height:32px;display:block;flex:none}
@media (max-width:560px){.brand-logo{width:26px;height:26px}}


/* ---------- sidebar (the WBS) ---------- */
nav{border-right:1px solid var(--line);background:var(--card);padding:14px 0 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.navgroup{margin:14px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.navgroup .dot{width:9px;height:9px;border-radius:3px;flex:none}
nav a{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 20px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav a:hover{background:var(--paper)}
nav a.active{border-left-color:var(--acc,var(--petrol));background:var(--soft,var(--petrol-soft));font-weight:600}
nav a .tick{width:16px;height:16px;flex:none;border:1.6px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff}
nav a.done .tick{background:var(--good);border-color:var(--good)}
nav a .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:30px}

/* ---------- main ---------- */
main{padding:34px clamp(20px,5vw,64px) 90px;max-width:960px}
section.page{display:none;animation:fadein .35s ease}
section.page.visible{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.spine{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}
.spine .tab{font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;background:var(--acc,var(--petrol));
  padding:6px 10px;border-radius:6px;letter-spacing:.05em;margin-top:8px;flex:none}
h2.pagetitle{font-family:var(--serif);font-size:clamp(26px,3.4vw,34px);line-height:1.2;margin:0 0 4px;color:var(--ink)}
.pagekicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc,var(--petrol));margin:0 0 2px}

/* prose */
.prose{max-width:76ch}
.prose h1,.prose h2,.prose h3{font-family:var(--serif);color:var(--ink);line-height:1.25;margin:1.6em 0 .5em}
.prose h2{font-size:24px}.prose h3{font-size:19px}
.prose strong{color:var(--ink)}
.prose blockquote{margin:1.2em 0;padding:12px 18px;background:var(--soft,var(--petrol-soft));border-left:4px solid var(--acc,var(--petrol));border-radius:0 var(--radius) var(--radius) 0}
.prose blockquote p{margin:.2em 0}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:14.5px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(34,48,59,.07)}
.prose th{background:var(--acc,var(--petrol));color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:13px;letter-spacing:.03em}
.prose td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.prose tr:nth-child(even) td{background:color-mix(in srgb,var(--soft,var(--petrol-soft)) 40%,white)}
.prose code{font-family:var(--mono);font-size:.9em;background:var(--petrol-soft);padding:1px 5px;border-radius:4px}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.prose ul,.prose ol{padding-left:1.4em}
.prose li{margin:.35em 0}
.prose a{color:var(--petrol)}

/* block headers inside a task */
.blockhead{display:flex;align-items:center;gap:10px;margin:2.2em 0 .8em;font-family:var(--serif);font-size:20px}
.blockhead::after{content:"";flex:1;height:1px;background:var(--line)}
.blockhead .bicon{font-size:18px}

/* ---------- flashcards: the signature ---------- */
.deckbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.deckbar .hint{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--petrol)}
.btn:hover{border-color:var(--petrol);background:var(--petrol-soft)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.fcard{perspective:1200px;min-height:150px}
.fcard button.inner{position:relative;width:100%;height:100%;min-height:150px;border:0;background:none;padding:0;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);text-align:left;display:block}
.fcard.flipped button.inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);padding:16px 16px 14px;
  box-shadow:0 1px 3px rgba(34,48,59,.14),0 6px 14px -8px rgba(34,48,59,.18);display:flex;flex-direction:column;justify-content:center}
.face.front{background:
  linear-gradient(to bottom,transparent 26px,transparent 26px) ,
  repeating-linear-gradient(to bottom,#fff 0 27px,#E8F0F2 27px 28px);
  background-color:#fff;border-top:9px solid var(--acc,var(--petrol))}
.face.front::before{content:"";position:absolute;top:0;bottom:0;left:22px;width:1px;background:#E6B8B8}
.face.front .term{font-family:var(--serif);font-size:18px;line-height:1.3;padding-left:14px;color:var(--ink)}
.face.front .flipnote{position:absolute;bottom:8px;right:12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.face.back{background:var(--acc,var(--petrol));color:#fff;transform:rotateY(180deg);font-size:14.5px;line-height:1.5}
.face.back strong{color:#fff}

/* ---------- self-quiz ---------- */
.sq{list-style:none;counter-reset:sq;padding:0;max-width:76ch}
.sq li{counter-increment:sq;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 16px;margin:10px 0}
.sq li::before{content:counter(sq);font-family:var(--serif);font-weight:700;font-size:17px;color:var(--acc,var(--petrol));
  background:var(--soft,var(--petrol-soft));width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.sq .q{flex:1}
.sq .recall{flex:none;border:1.6px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sq .recall[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.sqnote{font-size:13px;color:var(--muted);margin:4px 0 12px}

/* ---------- practice questions ---------- */
.pq{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:18px 0;max-width:80ch;
  box-shadow:0 1px 2px rgba(34,48,59,.06)}
.pq .stem{font-weight:600;margin:0 0 12px}
.pq .stem .qn{font-family:var(--mono);color:var(--acc,var(--petrol));margin-right:8px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);
  border-radius:8px;padding:10px 13px;font-size:15px;line-height:1.5;transition:border-color .15s,background .15s}
.opt .letter{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--petrol)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .letter{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{color:var(--bad)}
.opt.dim{opacity:.55}
.verdict{font-weight:700;margin:12px 0 0;font-size:14px}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.rationale{display:none;margin-top:10px;padding:13px 16px;background:var(--paper);border-left:4px solid var(--acc,var(--petrol));border-radius:0 8px 8px 0;font-size:14.5px}
.pq.answered .rationale{display:block}
.pq .reset{margin-top:12px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.secscore{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}

/* ---------- study footer / pager ---------- */
.pagefoot{display:flex;gap:12px;align-items:center;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.markbtn{border:1.6px solid var(--good);color:var(--good);background:var(--card);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px}
.markbtn[aria-pressed="true"]{background:var(--good);color:#fff}
.pager{margin-left:auto;display:flex;gap:10px}
.pager .btn{max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- mock exam ---------- */
#mockStage .pq{max-width:84ch}
.mockmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.mockbar{height:6px;background:var(--petrol-soft);border-radius:99px;overflow:hidden;margin-bottom:22px}
.mockbar div{height:100%;background:var(--petrol);transition:width .3s}
.scorecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;text-align:center;max-width:560px}
.scorecard .big{font-family:var(--serif);font-size:52px;color:var(--petrol);margin:6px 0}
.review .pq{opacity:.98}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;letter-spacing:.05em}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

.footer-credit{margin-top:60px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:76ch}

@media (max-width:880px){
  #app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:57px;bottom:0;width:290px;transform:translateX(-100%);transition:transform .25s;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.12)}
  nav.open{transform:none}
  #menuBtn{display:block}
  main{padding:24px 18px 80px}
}
</style>
</head>

<script id="DATA" type="application/json">{"sections": [{"id": "howto", "kind": "prose", "dom": "d0", "label": "How to Use This Guide", "nav": "How to Use This Guide", "html": "<p>This guide is engineered around three findings from learning science:<\/p>\n<ol>\n<li><strong>Retrieval practice beats re-reading.<\/strong> Every section ends with <strong>Self-Quiz Prompts<\/strong> (answer from memory <em>before<\/em> looking back) and <strong>Flashcard Key Terms<\/strong> (cover the right column, recall the definition).<\/li>\n<li><strong>Testing with feedback cements learning.<\/strong> Every task includes <strong>Practice Questions with full rationales<\/strong> — including why the wrong answers are wrong, which is where most PMP learning actually happens.<\/li>\n<li><strong>Organization aids memory.<\/strong> Each domain opens with an <strong>advance organizer<\/strong> (a map of what's coming and why), and each task follows the identical structure below, so your brain always knows where it is.<\/li>\n<\/ol>\n<p><strong>The structure of every task chapter:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>🎯 Why this matters<\/td>\n<td>Connects the task to the exam and real work<\/td>\n<\/tr>\n<tr>\n<td>📋 ECO Enablers<\/td>\n<td>The exact behaviors PMI tests<\/td>\n<\/tr>\n<tr>\n<td>🧠 Core Concepts<\/td>\n<td>The knowledge, explained plainly with examples<\/td>\n<\/tr>\n<tr>\n<td>⚖️ Predictive vs. Agile/Hybrid Lens<\/td>\n<td>How the task changes by approach (60% of exam items are agile/hybrid!)<\/td>\n<\/tr>\n<tr>\n<td>💡 Exam Intelligence<\/td>\n<td>How PMI writes questions on this task; traps to avoid<\/td>\n<\/tr>\n<tr>\n<td>🗂️ Flashcard Key Terms<\/td>\n<td>Cover-and-recall vocabulary<\/td>\n<\/tr>\n<tr>\n<td>✅ Self-Quiz Prompts<\/td>\n<td>Free-recall questions; answer aloud or in writing<\/td>\n<\/tr>\n<tr>\n<td>📝 Practice Questions<\/td>\n<td>Scenario questions with answer rationales<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Suggested study cycle per task (≈45–60 min):<\/strong>\n1. Read Core Concepts once, actively (highlight sparingly).\n2. Close the guide. Answer the Self-Quiz Prompts from memory.\n3. Check yourself, re-read only what you missed.\n4. Do the Practice Questions. Read <em>every<\/em> rationale, even for questions you got right.\n5. Two days later: redo only the Self-Quiz Prompts (spaced retrieval).<\/p>"}, {"id": "exam", "kind": "prose", "dom": "d0", "label": "The Exam: What You Are Facing", "nav": "The Exam: What You Are Facing", "html": "<h2>1.1 Exam Blueprint (July 2026 ECO)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Weight<\/th>\n<th>Tasks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I. People<\/td>\n<td><strong>33%<\/strong><\/td>\n<td>8 tasks<\/td>\n<\/tr>\n<tr>\n<td>II. Process<\/td>\n<td><strong>41%<\/strong><\/td>\n<td>10 tasks<\/td>\n<\/tr>\n<tr>\n<td>III. Business Environment<\/td>\n<td><strong>26%<\/strong><\/td>\n<td>8 tasks<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Approach mix:<\/strong> ~<strong>40% predictive<\/strong>, ~<strong>60% adaptive/agile and hybrid<\/strong> — spread across <em>all<\/em> domains and tasks, not isolated in any one section. You must be bilingual: fluent in both the plan-driven and the change-driven way of working.<\/p>\n<h2>1.2 What the ECO Language Means<\/h2>\n<ul>\n<li><strong>Domain<\/strong> = high-level knowledge area essential to practice.<\/li>\n<li><strong>Task<\/strong> = a responsibility of the project manager within the domain.<\/li>\n<li><strong>Enabler<\/strong> = illustrative example of work within the task (not exhaustive).<\/li>\n<\/ul>\n<p>Every exam form covers <strong>all tasks<\/strong> in every domain, at the stated domain percentages.<\/p>\n<h2>1.3 The 2026 Definition of Project Success<\/h2>\n<p>The 2026 ECO aligns with PMI's reframed view of success: beyond the classic schedule–budget–scope triple, a project succeeds when it <strong>delivers value worth the effort and expense<\/strong> — encompassing stakeholder value and desired outcomes. Expect questions where the \"on time, on budget\" answer loses to the \"delivers the intended value/outcome\" answer.<\/p>\n<h2>1.4 New Emphasis Areas in 2026<\/h2>\n<p>The Job Task Analysis added trends now woven through questions:\n- <strong>Artificial intelligence (AI)<\/strong> — as a tool for planning, estimating, analysis; and as a source of risk/compliance concerns.\n- <strong>Sustainability<\/strong> — appears explicitly in integrated planning (\"critical information requirements, e.g., sustainability\"), quality (cost of quality <em>and sustainability<\/em>), compliance, and risk.\n- <strong>Value-based delivery<\/strong> — its own Process task (II.3), reflecting the outcome-over-output shift.<\/p>\n<h2>1.5 The PMBOK® Guide 8th Edition Map (Your Content Backbone)<\/h2>\n<p>The exam is written to the <strong>ECO<\/strong>, but the <em>knowledge<\/em> it assumes lives largely in the PMBOK 8 architecture:<\/p>\n<p><strong>The Standard for Project Management:<\/strong>\n- A <strong>system for value delivery<\/strong> (portfolios → programs → projects → operations, all serving strategy).\n- <strong>Six Principles<\/strong> (the project management mindset):\n  1. Adopt a <strong>holistic view<\/strong>\n  2. Focus on <strong>value<\/strong>\n  3. <strong>Embed quality<\/strong> into processes and deliverables\n  4. Be an <strong>accountable leader<\/strong>\n  5. Integrate <strong>sustainability<\/strong> within all project areas\n  6. Build an <strong>empowered culture<\/strong>\n- <strong>Five Focus Areas<\/strong> (replacing the old Process Groups): <strong>Initiating, Planning, Executing, Monitoring &amp; Controlling, Closing<\/strong> — fundamental actions in <em>any<\/em> approach.\n- <strong>Development approaches:<\/strong> predictive, adaptive (agile), hybrid — chosen and tailored to context.<\/p>\n<p><strong>The Guide:<\/strong>\n- <strong>Seven Project Performance Domains<\/strong> with ~40 processes: <strong>Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk.<\/strong>\n- <strong>Tailoring<\/strong>: deliberately adapting approach, processes, and artifacts to the project context. Tailoring is a recurring exam theme — the \"right\" answer usually fits the <em>context described<\/em>, not a universal rule.<\/p>\n<blockquote>\n<p><strong>Full architecture:<\/strong> Part 2A walks the six principles, all 40 processes across the seven domains, and the tailoring discipline; Part 2B covers the 2026 AI and sustainability spotlights in depth.<\/p>\n<p><strong>Memory hook — \"6 P's, 5 F's, 7 D's\":<\/strong> 6 Principles guide behavior, 5 Focus Areas describe when work happens, 7 Performance Domains describe what work is about.<\/p>\n<\/blockquote>\n<h2>1.6 The PMI Mindset — 12 Rules That Answer Half the Exam<\/h2>\n<p>PMP questions are scenario-based judgment tests. When two answers look plausible, the one matching the PMI mindset wins:<\/p>\n<ol>\n<li><strong>Value first.<\/strong> Choose the option that protects or delivers business value and outcomes, not just output.<\/li>\n<li><strong>The PM acts — proactively.<\/strong> \"Do nothing,\" \"wait,\" or \"escalate immediately\" are rarely right unless the scenario shows you've exhausted your authority.<\/li>\n<li><strong>Assess before acting.<\/strong> When something new happens (change, risk, issue, conflict), first <em>understand/analyze impact<\/em>, then act through the proper process.<\/li>\n<li><strong>Follow the process.<\/strong> Changes go through change control (predictive) or backlog reprioritization (agile). Never bypass, never gold-plate.<\/li>\n<li><strong>Servant leadership.<\/strong> Empower the team, remove impediments, facilitate — don't command, don't take over tasks, don't punish.<\/li>\n<li><strong>Face conflict collaboratively.<\/strong> Prefer problem-solving/collaboration over forcing, smoothing, avoiding.<\/li>\n<li><strong>Talk directly first.<\/strong> Address issues with the person involved before escalating to their manager or the sponsor.<\/li>\n<li><strong>Stakeholders early and often.<\/strong> Identify, analyze, and engage stakeholders continuously; most failures trace to disengaged stakeholders.<\/li>\n<li><strong>Transparency and honesty.<\/strong> Report true status. Never hide problems, never massage data, never violate ethics even under sponsor pressure.<\/li>\n<li><strong>Tailor to context.<\/strong> The right technique depends on the approach and environment described in the stem.<\/li>\n<li><strong>Team decides how (agile).<\/strong> In adaptive settings the team estimates, self-organizes, and commits; the PM/Scrum-Master-type role facilitates.<\/li>\n<li><strong>Root cause over symptom.<\/strong> Prefer answers that investigate and fix causes rather than patch effects.<\/li>\n<\/ol>\n<h2>1.7 Anatomy of a PMP Question — and How to Dissect It<\/h2>\n<p>Most items are situational: <em>context → trigger event → \"What should the project manager do next / first / best?\"<\/em><\/p>\n<p><strong>Dissection protocol:<\/strong>\n1. Read the <strong>last sentence first<\/strong> — identify what is being asked (NEXT? FIRST? BEST? EXCEPT?).\n2. Identify the <strong>approach<\/strong> in the stem (sprint/backlog/retrospective = agile; baseline/change request/WBS = predictive; both = hybrid).\n3. Strip distractors — names, industries, and numbers are usually noise unless it's a calculation.\n4. Eliminate answers that: skip analysis, bypass process, blame people, do nothing, or jump to escalation.\n5. If two remain, pick the one earlier in the logical sequence (assess → plan → act → communicate) for \"FIRST/NEXT\" questions, and the one with the greatest value/root-cause impact for \"BEST\" questions.<\/p>"}, {"id": "foundations", "kind": "task", "dom": "d0", "code": "P2", "label": "Foundations Primer", "nav": "Foundations primer", "title": "Foundations Primer", "prose": "<p><em>Experienced PMs: skim the tables and the Predictive-vs-Agile comparison; do not skip 2.5 (PMBOK 8 changed terminology you may know under older names).<\/em><\/p>\n<h2>2.1 Core Definitions<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Definition (PMBOK 8 framing)<\/th>\n<th>Everyday translation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Project<\/strong><\/td>\n<td>A temporary initiative in a unique context undertaken to create value<\/td>\n<td>Work with a start and end that produces something new<\/td>\n<\/tr>\n<tr>\n<td><strong>Program<\/strong><\/td>\n<td>Related projects/activities managed in a coordinated way for benefits not available individually<\/td>\n<td>A family of projects steered together<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfolio<\/strong><\/td>\n<td>Projects, programs, and operations grouped to achieve strategic objectives<\/td>\n<td>The organization's whole investment basket<\/td>\n<\/tr>\n<tr>\n<td><strong>Operations<\/strong><\/td>\n<td>Ongoing, repetitive work sustaining the business<\/td>\n<td>Business as usual<\/td>\n<\/tr>\n<tr>\n<td><strong>Value<\/strong><\/td>\n<td>The worth, importance, or usefulness of outcomes to stakeholders<\/td>\n<td>Was it worth the effort and expense?<\/td>\n<\/tr>\n<tr>\n<td><strong>Outcome<\/strong><\/td>\n<td>The end result or consequence a deliverable enables<\/td>\n<td>The change the output creates<\/td>\n<\/tr>\n<tr>\n<td><strong>Deliverable/Output<\/strong><\/td>\n<td>A unique, verifiable product, result, or capability<\/td>\n<td>The thing you hand over<\/td>\n<\/tr>\n<tr>\n<td><strong>Tailoring<\/strong><\/td>\n<td>Deliberate adaptation of approach, governance, and processes to the environment and work<\/td>\n<td>Fit the method to the project, not vice versa<\/td>\n<\/tr>\n<tr>\n<td><strong>OPAs<\/strong><\/td>\n<td>Organizational process assets — plans, processes, policies, templates, knowledge bases<\/td>\n<td>The organization's playbook and memory<\/td>\n<\/tr>\n<tr>\n<td><strong>EEFs<\/strong><\/td>\n<td>Enterprise environmental factors — internal/external conditions outside the team's control<\/td>\n<td>The weather you operate in (culture, regulation, market)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2.2 Key Roles<\/h2>\n<table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Accountability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sponsor<\/strong><\/td>\n<td>Owns the business case; provides funding, resources, and top-cover; champions the project<\/td>\n<\/tr>\n<tr>\n<td><strong>Project Manager<\/strong><\/td>\n<td>Leads the team to achieve objectives and deliver value; integrates everything<\/td>\n<\/tr>\n<tr>\n<td><strong>Product Owner (agile)<\/strong><\/td>\n<td>Owns the product backlog and value priorities; voice of the customer<\/td>\n<\/tr>\n<tr>\n<td><strong>Scrum Master / team facilitator<\/strong><\/td>\n<td>Servant leader; removes impediments; coaches the process<\/td>\n<\/tr>\n<tr>\n<td><strong>PMO<\/strong><\/td>\n<td>Standardizes governance, supports/controls/directs projects (supportive → controlling → directive)<\/td>\n<\/tr>\n<tr>\n<td><strong>Team<\/strong><\/td>\n<td>Does the work; in agile, self-organizes and estimates its own work<\/td>\n<\/tr>\n<tr>\n<td><strong>Steering committee / governance board<\/strong><\/td>\n<td>Decision authority above the PM: approves major changes, resolves escalations<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2.3 Development Approaches — The 40/60 Split You Must Master<\/h2>\n<table>\n<thead>\n<tr>\n<th>Dimension<\/th>\n<th><strong>Predictive (plan-driven)<\/strong><\/th>\n<th><strong>Adaptive/Agile (change-driven)<\/strong><\/th>\n<th><strong>Hybrid<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Requirements<\/td>\n<td>Defined up front; baselined<\/td>\n<td>Emerge; refined continuously in a backlog<\/td>\n<td>Some fixed, some evolving<\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>Usually single delivery at end (or phased)<\/td>\n<td>Frequent small increments each iteration<\/td>\n<td>Mixed cadence<\/td>\n<\/tr>\n<tr>\n<td>Change<\/td>\n<td>Controlled via formal change control<\/td>\n<td>Welcomed; reprioritize the backlog<\/td>\n<td>Depends on component<\/td>\n<\/tr>\n<tr>\n<td>Scope<\/td>\n<td>Fixed early; time/cost estimated to fit<\/td>\n<td>Time/cost fixed (timebox); scope flexes<\/td>\n<td>Mixed<\/td>\n<\/tr>\n<tr>\n<td>Key artifacts<\/td>\n<td>Charter, PM plan, baselines, WBS, Gantt/CPM<\/td>\n<td>Backlog, user stories, definition of done, burndown/burnup, kanban board<\/td>\n<td>Both<\/td>\n<\/tr>\n<tr>\n<td>Key events<\/td>\n<td>Kickoff, phase gates, status meetings<\/td>\n<td>Sprint planning, daily standup, review, retrospective<\/td>\n<td>Both<\/td>\n<\/tr>\n<tr>\n<td>Leadership<\/td>\n<td>PM directs and integrates<\/td>\n<td>Servant leadership; team self-organizes<\/td>\n<td>Situational<\/td>\n<\/tr>\n<tr>\n<td>Best when<\/td>\n<td>Stable requirements, high change cost, regulatory<\/td>\n<td>High uncertainty, fast feedback possible, evolving product<\/td>\n<td>Parts differ in uncertainty<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam reflex:<\/strong> first classify the scenario's approach from vocabulary clues, then apply that world's rules.<\/p>\n<\/blockquote>\n<h2>2.4 The Five Focus Areas (What Happens on Every Project)<\/h2>\n<p>Regardless of approach, five kinds of action recur:\n- <strong>Initiating<\/strong> — authorize the work, define purpose, identify stakeholders (charter; project vision).\n- <strong>Planning<\/strong> — define scope, approach, resources, schedule, budget, risk responses; in agile, planning is continuous and multi-level (roadmap → release → iteration → daily).\n- <strong>Executing<\/strong> — perform the work, engage people, manage quality and communications.\n- <strong>Monitoring &amp; Controlling<\/strong> — measure against plan/expectations, manage changes, keep risks and issues in check.\n- <strong>Closing<\/strong> — confirm acceptance, transition the deliverable, capture lessons, release resources.<\/p>\n<p>In predictive work these lean sequential with feedback loops; in adaptive work all five cycle <em>within every iteration<\/em>.<\/p>\n<h2>2.5 Translation Table — Older Vocabulary → PMBOK 8<\/h2>\n<table>\n<thead>\n<tr>\n<th>If you learned…<\/th>\n<th>PMBOK 8 says…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>49 processes in 10 Knowledge Areas<\/td>\n<td>~40 processes in <strong>7 Performance Domains<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5 Process Groups<\/td>\n<td><strong>5 Focus Areas<\/strong> (same five names, reframed as fundamental actions)<\/td>\n<\/tr>\n<tr>\n<td>12 Principles (7th ed.)<\/td>\n<td><strong>6 Principles<\/strong> (consolidated, actionable)<\/td>\n<\/tr>\n<tr>\n<td>Cost Management<\/td>\n<td><strong>Finance Performance Domain<\/strong> (broader: funding, financial reporting, reserves)<\/td>\n<\/tr>\n<tr>\n<td>\"Triple constraint\" success<\/td>\n<td><strong>Value worth the effort and expense<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "cards": [{"front": "System for value delivery", "back": "Portfolios, programs, projects, and operations working together to create value aligned to strategy"}, {"front": "Timebox", "back": "Fixed period in which work occurs (e.g., 2-week sprint); scope flexes, time doesn't"}, {"front": "Increment", "back": "Usable, potentially releasable piece of the product delivered each iteration"}, {"front": "Baseline", "back": "Approved version of a plan (scope/schedule/cost), changed only via change control"}, {"front": "Backlog", "back": "Ordered, evolving list of work items prioritized by value"}, {"front": "Phase gate", "back": "Review at phase end to decide continue/change/stop"}, {"front": "Servant leadership", "back": "Leading by serving the team: removing obstacles, enabling, coaching"}, {"front": "Progressive elaboration", "back": "Plans become more detailed as better information emerges"}], "prompts": ["From memory: name the 6 principles, 5 focus areas, and 7 performance domains.", "Explain to an imaginary junior colleague the difference between output, outcome, and value using one example.", "Your scenario mentions a \"sprint review with the product owner.\" Which approach rules apply, and name three artifacts you'd expect to see.", "When does hybrid beat pure agile or pure predictive? Give a concrete example project.", "What's the difference between an OPA and an EEF? Give two examples of each."], "questions": []}, {"id": "pmbok", "kind": "task", "dom": "d0", "code": "P2A", "label": "PMBOK 8 Deep Dive", "nav": "PMBOK 8 Deep Dive", "title": "PMBOK 8 Deep Dive", "prose": "<p><em>This chapter completes your PMBOK® Guide — Eighth Edition coverage: the six principles in working depth, the seven Performance Domains with all 40 processes, the development-approach spectrum, and the tailoring discipline. The ECO tells you what the exam tests; this is the knowledge architecture behind it.<\/em><\/p>\n<p><strong>🎯 Why this matters.<\/strong> Exam items rarely name PMBOK sections, but the credited answers are built from this architecture: a principle applied, a process respected, a tailoring judgment made. Knowing the map lets you recognize <em>which<\/em> rulebook a scenario is invoking.<\/p>\n<p><strong>🧠 Core Concepts<\/strong><\/p>\n<p><strong>The Six Principles — in working depth (The Standard, Section 3).<\/strong> Principles are the project management <em>mindset<\/em>: they guide behavior in every situation the processes don't explicitly cover.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Principle<\/th>\n<th>What it demands of you<\/th>\n<th>Exam behaviors it produces<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Adopt a holistic view<\/strong><\/td>\n<td>See the project as a system inside larger systems (program, portfolio, organization, society); decisions ripple — think in interactions, not silos<\/td>\n<td>Integration answers: assess cross-impacts before acting; consult affected workstreams; check strategy alignment<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Focus on value<\/strong><\/td>\n<td>Outputs are means; outcomes and benefits are the point; keep testing \"is this still worth the effort and expense?\"<\/td>\n<td>Prioritize by value; re-validate the business case; recommend stopping value-dead work<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Embed quality into processes and deliverables<\/strong><\/td>\n<td>Build quality in from the start — prevention over inspection, in both <em>how<\/em> you work and <em>what<\/em> you deliver<\/td>\n<td>Root-cause fixes; never silently cut quality; definition of done discipline<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>Be an accountable leader<\/strong><\/td>\n<td>Own outcomes, model ethics, lead by example; accountability is not delegable even when tasks are<\/td>\n<td>Honest reporting under pressure; taking responsibility for team results; ethics over convenience<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>Integrate sustainability within all project areas<\/strong><\/td>\n<td>Meet present needs without compromising future generations — people, planet, society, and value in every phase (see Part 2B for full depth)<\/td>\n<td>Consider environmental/social impacts in options analysis; include sustainability KPIs; raise impacts even when documents are silent<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>Build an empowered culture<\/strong><\/td>\n<td>Create psychological safety; give teams authority with accountability; grow capability<\/td>\n<td>Team decides how; leader unblocks; mistakes become learning, not punishment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Memory hook — \"HV-QALSE\" won't stick; try the story instead:<\/strong> <em>A leader (4) with a holistic view (1) empowers the culture (6) to embed quality (3) so the project delivers value (2) sustainably (5).<\/em><\/p>\n<\/blockquote>\n<p><strong>The Seven Performance Domains and all 40 processes (The Guide, Section 2).<\/strong> PMBOK 8 reorganized project work into seven domains, each with defined processes (inputs → tools &amp; techniques → outputs). You don't memorize ITTOs anymore — but you should recognize every process name and its home domain:<\/p>\n<table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Processes<\/th>\n<th>Notice<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Governance<\/strong> (9)<\/td>\n<td>Initiate Project or Phase · Integrate and Align Project Plans · Plan Sourcing Strategy · Manage Project Execution · Manage Quality Assurance · Manage Project Knowledge · Monitor and Control Project Performance · Assess and Implement Changes · Close Project or Phase<\/td>\n<td>The integrative spine: initiation, integration, execution, QA, knowledge, change control, and closure all live <em>here<\/em> — including procurement strategy<\/td>\n<\/tr>\n<tr>\n<td><strong>Scope<\/strong> (6)<\/td>\n<td>Plan Scope Management · Elicit and Analyze Requirements · Define Scope · Develop Scope Structure · Monitor and Control Scope · Validate Scope<\/td>\n<td>\"Develop Scope Structure\" = WBS/backlog breakdown in 8th-edition language<\/td>\n<\/tr>\n<tr>\n<td><strong>Schedule<\/strong> (3)<\/td>\n<td>Plan Schedule Management · Develop Schedule · Monitor and Control Schedule<\/td>\n<td>Leanest domain — three processes covering the II-8 toolset<\/td>\n<\/tr>\n<tr>\n<td><strong>Finance<\/strong> (4)<\/td>\n<td>Plan Financial Management · Estimate Costs · Develop Budget · Monitor and Control Finances<\/td>\n<td>\"Finance,\" not \"Cost\": funding, reserves, and financial reporting included<\/td>\n<\/tr>\n<tr>\n<td><strong>Stakeholders<\/strong> (7)<\/td>\n<td>Identify Stakeholders · Plan Stakeholder Engagement · Plan Communications Management · Manage Stakeholder Engagement · Manage Communications · Monitor Stakeholder Engagement · Monitor Communications<\/td>\n<td>Stakeholders and communications merged into one domain — engagement and information flow are one system<\/td>\n<\/tr>\n<tr>\n<td><strong>Resources<\/strong> (5)<\/td>\n<td>Plan Resource Management · Estimate Resources · Acquire Resources · Lead the Team · Monitor and Control Resourcing<\/td>\n<td>\"Lead the Team\" is a <em>process<\/em> here — leadership is work, planned and performed<\/td>\n<\/tr>\n<tr>\n<td><strong>Risk<\/strong> (6)<\/td>\n<td>Plan Risk Management · Identify Risks · Perform Risk Analysis · Plan Risk Responses · Implement Risk Responses · Monitor Risks<\/td>\n<td>One analysis process (qualitative + quantitative combined)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Count check: 9 + 6 + 3 + 4 + 7 + 5 + 6 = <strong>40 processes<\/strong>.<\/p>\n<p><strong>How domains, focus areas, and principles interlock:<\/strong> Principles guide <em>judgment<\/em>; Performance Domains organize <em>what<\/em> the work is about; Focus Areas (Initiating, Planning, Executing, Monitoring &amp; Controlling, Closing) describe <em>when<\/em> fundamental actions occur — cycling once across a predictive life cycle, and within every iteration in adaptive delivery. One scenario can invoke all three layers: a mid-sprint compliance discovery touches the Risk and Governance domains, the Monitoring &amp; Controlling focus area, and the accountable-leader principle simultaneously.<\/p>\n<p><strong>The development-approach spectrum (The Standard, Section 4).<\/strong> PMBOK 8 presents predictive ↔ hybrid ↔ adaptive as a <em>spectrum<\/em>, not three boxes: hybrids include adaptive development followed by predictive rollout, predictive projects with an adaptive component, and adaptive projects with predictive components. Delivery cadence (single, multiple, periodic, continuous) is chosen separately from the development approach — a predictive build can still deliver incrementally.<\/p>\n<p><strong>Tailoring (The Guide, Section 3) — the discipline, not the shortcut.<\/strong> Tailoring is the deliberate adaptation of approach, governance, and processes to the context. The process: <strong>(1) select the initial development approach → (2) tailor for the organization<\/strong> (governance expectations, OPAs, culture may require review/approval of the tailored design) <strong>→ (3) tailor for the project<\/strong> (size, criticality, team, complexity) <strong>→ (4) implement ongoing improvement<\/strong> — tailoring continues as you learn (retrospectives, reviews, <strong>diagnostics<\/strong>: recurring symptoms like missed handoffs or slow decisions signal that the tailored process needs adjusting). What gets tailored: processes and their rigor, life cycle and cadence, engagement methods, tools, and artifacts. Tailor <em>everything to context<\/em>, never to convenience — dropping change control because it's \"overhead\" is not tailoring, it's negligence.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- The 40 processes are approach-neutral: <em>Develop Schedule<\/em> produces a CPM network in predictive work and release/iteration plans in adaptive work; <em>Validate Scope<\/em> is a formal acceptance review or a sprint review. The exam expects you to recognize the same process wearing different clothes.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"Which principle does this behavior violate/embody?\" → match the behavior to the six-principle table; accountable-leader and focus-on-value items are the most frequent.\n- Odd-one-out process questions: remember QA and change control live in <strong>Governance<\/strong>; communications lives with <strong>Stakeholders<\/strong>; <em>Lead the Team<\/em> is in <strong>Resources<\/strong>.\n- Tailoring stems: the credited answer adapts process depth to context <em>and keeps governance informed<\/em> — never silently deletes controls.<\/p>", "cards": [{"front": "Six principles", "back": "Holistic view · Value · Embed quality · Accountable leader · Sustainability · Empowered culture"}, {"front": "Seven performance domains", "back": "Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk — 40 processes total"}, {"front": "Governance domain", "back": "Home of initiation, integration, execution management, QA, knowledge, performance control, change control, closure"}, {"front": "Develop Scope Structure", "back": "8th-edition name for breaking scope down (WBS / backlog)"}, {"front": "Lead the Team (process)", "back": "Leadership as planned, performed work in the Resources domain"}, {"front": "Focus areas", "back": "Initiating, Planning, Executing, Monitoring &amp; Controlling, Closing — cycle within every adaptive iteration"}, {"front": "Delivery cadence", "back": "Single, multiple, periodic, or continuous delivery — chosen independently of approach"}, {"front": "Tailoring process", "back": "Select approach → tailor for organization → tailor for project → continuous improvement"}, {"front": "Diagnostics (tailoring)", "back": "Recurring delivery symptoms signaling the tailored process needs adjustment"}], "prompts": ["Recite the six principles and give one exam-style behavior each produces.", "From memory, name all seven domains with their process counts summing to 40.", "Which domain hosts quality assurance? Change control? Communications? Leading the team?", "Walk the four tailoring steps and give an example of a diagnostic symptom.", "Explain how one scenario can involve a principle, a domain, and a focus area at once — invent an example."], "questions": [{"stem": "A PM discovers the organization's methodology mandates twelve formal deliverable documents, but her three-person, four-week internal project would spend a third of its effort producing them. What does PMBOK 8 tailoring discipline direct her to do?", "options": ["Follow the methodology exactly — consistency protects governance", "Skip the documents and explain later if asked", "Tailor the artifact set to the project's size and risk, and confirm the tailored approach with the appropriate governance/PMO channel", "Reclassify the work as operations to escape the methodology"], "answer": 2, "rationale": "Tailoring is deliberate adaptation <em>for the organization and the project<\/em> — proportionate rigor, transparently agreed. A wastes a third of a small project on ceremony; B is unilateral control-dropping; D games classification."}, {"stem": "During execution, a sponsor asks the PM to soften a status report so a board committee \"doesn't overreact\" to a genuine schedule risk. Which principle most directly governs the PM's response?", "options": ["Adopt a holistic view", "Focus on value", "Be an accountable leader", "Build an empowered culture"], "answer": 2, "rationale": "Accountable leadership demands honest reporting and ethical behavior under pressure; the PM reports accurately (and can help frame context and responses). The other principles are real but not the direct governor of truthful reporting."}, {"stem": "In PMBOK 8's process architecture, \"Assess and Implement Changes\" and \"Manage Quality Assurance\" both belong to which performance domain?", "options": ["Scope", "Governance", "Resources", "Risk"], "answer": 1, "rationale": "<p>The Governance domain holds the integrative processes — initiation, plan integration, execution management, QA, knowledge, performance monitoring, change control, and closure. This placement is a favorite recognition test.<\/p>\n<hr />"}]}, {"id": "spotlight", "kind": "task", "dom": "d0", "code": "P2B", "label": "AI & Sustainability Spotlight", "nav": "AI & Sustainability Spotlight", "title": "AI & Sustainability Spotlight", "prose": "<p><em>The two themes PMI wove through the 2026 ECO now get the dedicated treatment they carry in the exam. Source depth: PMBOK 8 Appendix X3 (Artificial Intelligence) and Principle 3.7 (Integrate Sustainability Within All Project Areas).<\/em><\/p>\n<p><strong>🎯 Why this matters.<\/strong> The 2026 Job Task Analysis added AI and sustainability as cross-cutting exam threads: they surface inside People, Process, <em>and<\/em> Business Environment questions — an AI-assisted estimate here, a sustainability KPI there, an ESG compliance risk in a scenario stem. Treat them as lenses you can apply to any task, not as one more topic.<\/p>\n<h2>Section A — Artificial Intelligence in Projects<\/h2>\n<p><strong>🧠 Core Concepts<\/strong><\/p>\n<ul>\n<li><strong>Know the technology family (recognition level):<\/strong> <strong>AI<\/strong> is the broad set of technologies that simulate human reasoning, learning, and autonomous action; <strong>machine learning (ML)<\/strong> is the data-trained subset; <strong>deep learning (DL)<\/strong> uses multilayer neural networks; <strong>generative AI (GenAI)<\/strong> applies large language models (LLMs) to create new content — text, images, audio, code. Each nests inside the previous (AI ⊃ ML ⊃ DL ⊃ GenAI).<\/li>\n<li><strong>The adoption ladder — match AI involvement to task complexity (PMBOK's three strategies):<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Strategy<\/th>\n<th>Task profile<\/th>\n<th>Human role<\/th>\n<th>Project examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Automation<\/strong><\/td>\n<td>Low complexity, little judgment in the output<\/td>\n<td>Set up, then spot-check<\/td>\n<td>Status report generation, document analysis, meeting transcription/minutes, compliance checks, reminders/task tracking<\/td>\n<\/tr>\n<tr>\n<td><strong>Assistance<\/strong><\/td>\n<td>Medium complexity; iterative co-building<\/td>\n<td>Review and refine every output before use<\/td>\n<td>First-draft risk register, schedule with buffers, stakeholder communication drafts, categorizing brainstorm input<\/td>\n<\/tr>\n<tr>\n<td><strong>Augmentation<\/strong><\/td>\n<td>Strategic, complex analysis<\/td>\n<td>AI as brainstorming partner across iterations; human owns the judgment<\/td>\n<td>Portfolio trade-off/balance analysis, risk forecasting from external variables, baseline optimization across scope–schedule–cost<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>The rule that answers most AI exam items: <strong>the more complex and consequential the task, the more human oversight is required — and accountability never transfers to the tool.<\/strong>\n- <strong>High-value use cases by domain (from PMBOK Table X3-1):<\/strong> idea generation for business cases and charters; predictive analytics for timelines, resources, and bottlenecks; real-time monitoring with deviation alerts; <strong>early-warning signaling<\/strong> — pattern recognition flagging trouble even when EVM/burndown still looks green; automated reporting and AI-enhanced dashboards/information radiators; chatbots for routine queries; risk identification and assessment from historical data and benchmarks; suggested (even automated) mitigation actions; knowledge management — making tacit and dispersed project knowledge searchable and accessible (a direct amplifier for Task I-7).\n- <strong>Responsible use — the ethics and governance dimension:<\/strong>\n  - <strong>Bias:<\/strong> models trained on skewed data produce skewed recommendations; mitigate with diverse data sets, periodic bias testing, and diverse teams involved in development and review.\n  - <strong>Data privacy &amp; IP:<\/strong> know where prompts and project data go — consumer-grade free tools may retain data for model training; enterprise/paid tiers typically allow restricting it. Feeding confidential project data into unapproved tools is a <strong>compliance event<\/strong> (III-2), not a productivity hack.\n  - <strong>Accuracy &amp; hallucination:<\/strong> GenAI asserts confidently whether right or wrong — validate outputs against source data before decisions ride on them.\n  - <strong>Human-in-the-loop accountability:<\/strong> the accountable-leader principle applies unchanged — AI recommends, humans decide, the PM owns the outcome.\n  - <strong>Transparency:<\/strong> stakeholders should know where AI materially contributes to analyses and reports feeding their decisions.\n- <strong>AI as a risk source, not just a tool:<\/strong> model errors, vendor lock-in, regulatory exposure (AI regulation is moving — an III-8 scanning item), workforce impacts, and security of AI integrations all belong in the risk register with owners and responses.<\/p>\n<\/blockquote>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"The team wants to adopt an AI tool\" → credited answer = <strong>pilot as decision support: validate against historical data, keep human accountability, address privacy/compliance<\/strong> — never blanket prohibition, never uncritical full adoption.\n- \"AI-generated estimate/analysis looks off\" → <strong>validate against actuals and judgment before use<\/strong>; the PM never outsources accountability.\n- \"Team member pasted confidential data into a public AI tool\" → treat as a <strong>compliance/security incident<\/strong>: assess, contain, notify per policy — the III-2 pattern.<\/p>\n<h2>Section B — Sustainability &amp; ESG in Projects<\/h2>\n<p><strong>🧠 Core Concepts<\/strong><\/p>\n<ul>\n<li><strong>The principle (verbatim spirit):<\/strong> <em>meet present needs without compromising the ability of future generations to meet their own<\/em> — integrating <strong>people, planet, society, and value<\/strong> into project activities across every phase, at tactical, operational, and strategic levels. Accountability is <strong>joint<\/strong>: project managers, teams, <em>and<\/em> sponsors.<\/li>\n<li><strong>The Sustainability Pyramid — response hierarchy for negative externalities (least → most desirable):<\/strong>\n  1. <strong>Compensate/offset<\/strong> the negative outcomes generated →\n  2. <strong>Restore<\/strong> the impacts →\n  3. <strong>Minimize<\/strong> the outcomes →\n  4. <strong>Avoid<\/strong> them altogether.\n  Structurally identical logic to risk responses: prevention beats remediation — expect matching questions.<\/li>\n<li><strong>Triple bottom line:<\/strong> social equity + environmental stewardship + economic prosperity. ESG (Environmental, Social, Governance) is the organizational reporting frame your project's data may feed.<\/li>\n<li><strong>Making sustainability operational (this is what gets tested):<\/strong><\/li>\n<li><strong>Charter &amp; business case:<\/strong> sustainability goals and <strong>KPIs written into formal authorizing documents<\/strong> (charter, scope statement, business case, contracts) and confirmed by the sponsor; where documents are silent, the PM still <em>raises sustainability impacts in discussions<\/em> — the principle doesn't switch off.<\/li>\n<li><strong>Planning:<\/strong> sustainability as a critical information requirement (II-1); lifecycle thinking — design decisions weighed across the <strong>process, deliverable, and outcomes life cycles<\/strong>, including operation, decommissioning, and disposal, not just delivery day.<\/li>\n<li><strong>Quality:<\/strong> environmental waste, rework energy, and disposal are <strong>cost-of-quality<\/strong> components (II-7).<\/li>\n<li><strong>Compliance:<\/strong> environmental and social obligations are compliance categories with methods and metrics (III-2).<\/li>\n<li><strong>Risk:<\/strong> sustainability risks arise when projects fail to balance societal, economic, and environmental considerations — cost prioritized over stewardship, community impacts ignored, sustainability-linked regulation underestimated; consequences include stakeholder backlash and long-term reputational harm (III-5).<\/li>\n<li><strong>Benefits &amp; reporting:<\/strong> sustainability outcomes belong in the benefits measurement system and in value reporting to executives and boards (II-3, I-8) — outputs → outcomes → benefits applies to ESG value exactly as to financial value.<\/li>\n<li><strong>The honest challenges (PMBOK names them):<\/strong> integrating sustainability <strong>broadens scope, time horizon, and the stakeholder set<\/strong> — which can raise cost and complexity; success is hard to assess because <strong>no universal sustainability criteria exist<\/strong> — each project tailors its measures; the team needs access to tools/information to actually manage sustainability, not just report it.<\/li>\n<li><strong>Organizational payoff:<\/strong> employee satisfaction and retention, stronger stakeholder relationships, optimized risk responses, resilience, and better decision-making — sustainability is a value play, not a tax.<\/li>\n<\/ul>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Options analysis stems with an environmental/social angle → credited answers <strong>surface and weigh the sustainability impact<\/strong> (and prefer avoid &gt; minimize &gt; restore &gt; offset) rather than optimizing cost/schedule alone.\n- \"Sustainability isn't in the business case; should the PM bother?\" → <strong>yes: encourage the discussion and propose goals/KPIs to the sponsor<\/strong> — silence in documents doesn't suspend the principle.\n- \"How do we prove ESG value?\" → same machinery as any benefit: <strong>baseline, KPI, owner, measurement plan<\/strong> (II-3).<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Adaptive:<\/em> AI accelerates backlog analytics and forecasting; sustainability criteria enter the <strong>definition of done<\/strong> and story acceptance criteria; every increment is a chance to measure and adjust ESG impact.\n- <em>Predictive:<\/em> AI supports estimating, monitoring, and early warning against baselines; sustainability KPIs ride the charter, gate reviews, and benefits plan.<\/p>", "cards": [{"front": "AI ⊃ ML ⊃ DL ⊃ GenAI", "back": "Nested technology family; GenAI = LLM-driven content creation"}, {"front": "Automation / Assistance / Augmentation", "back": "AI adoption ladder — human oversight rises with task complexity"}, {"front": "Human-in-the-loop", "back": "AI recommends, humans decide; accountability never transfers"}, {"front": "AI early-warning signaling", "back": "Pattern recognition flags risk before baseline metrics show it"}, {"front": "AI bias mitigation", "back": "Diverse data sets, periodic bias testing, diverse teams"}, {"front": "Sustainability principle", "back": "Meet present needs without compromising future generations — people, planet, society, value"}, {"front": "Sustainability Pyramid", "back": "Offset → Restore → Minimize → Avoid (increasingly desirable)"}, {"front": "Triple bottom line", "back": "Social equity, environmental stewardship, economic prosperity"}, {"front": "ESG", "back": "Environmental, Social, Governance — the organizational value/reporting frame"}, {"front": "Lifecycle thinking", "back": "Weigh impacts across process, deliverable, and outcomes life cycles incl. decommissioning"}, {"front": "Sustainability KPI", "back": "Measurable goal embedded in charter/business case/contract, sponsor-confirmed"}], "prompts": ["Recite the AI adoption ladder with one project example per rung, and state the oversight rule.", "Name four AI ethical/governance concerns and one mitigation each.", "Rebuild the Sustainability Pyramid from least to most desirable, and connect it to risk-response logic.", "Where, concretely, does sustainability enter a project's formal documents and plans? Name five insertion points.", "Why does integrating sustainability increase complexity, and what does PMBOK say about missing universal criteria?", "A stakeholder asks whether AI wrote your risk analysis — what does responsible practice require?"], "questions": [{"stem": "A PM uses a GenAI tool to draft the initial risk register, which looks comprehensive. According to PMBOK 8's AI adoption strategies, what should the PM do NEXT?", "options": ["Import the register into the plan — the tool was trained on thousands of projects", "Treat this as AI <em>assistance<\/em>: review, validate, and refine every entry with the team and experts before the register informs decisions", "Reject the draft — risk identification must be fully human", "Escalate the register to the sponsor for approval as-is"], "answer": 1, "rationale": "Drafting a risk register is the textbook <em>assistance<\/em> use case — iterative co-building where outputs are incomplete until humans review and refine them. A abdicates accountability to the tool; C forfeits legitimate productivity; D routes an unvalidated artifact to governance."}, {"stem": "During options analysis for a plant upgrade, Option 1 is cheapest but produces significant chemical waste requiring offset payments; Option 2 costs 8% more and redesigns the process so the waste is never created. Applying PMBOK 8's sustainability principle, the PM's recommendation logic should:", "options": ["Choose Option 1 — cost is objective, sustainability is not", "Prefer Option 2, since avoiding negative outcomes ranks above compensating for them on the sustainability hierarchy, and present the value case (risk, compliance, reputation, lifecycle cost) to the sponsor", "Choose Option 1 and buy carbon offsets to neutralize criticism", "Defer the decision to the sustainability department"], "answer": 1, "rationale": "The Sustainability Pyramid ranks <em>avoid<\/em> above <em>offset<\/em>; the PM quantifies the fuller value picture and recommends through the sponsor. A and C anchor to the least desirable rung; D abdicates the PM's integration duty."}, {"stem": "A team member reveals they've been pasting the client's confidential requirements into a free public AI chatbot to \"speed up analysis.\" What should the PM do FIRST?", "options": ["Praise the initiative and license the tool for everyone", "Treat it as a data-privacy/compliance incident: assess what was exposed, contain further use, and notify per organizational and contractual obligations — then establish approved-tool guidance", "Quietly delete the chat history and move on", "Ban all AI tools on the project permanently"], "answer": 1, "rationale": "Free-tier tools may retain data for training; confidential client data exposure is a compliance event demanding the assess–contain–notify pattern (III-2), followed by preventive governance. A compounds exposure; C conceals a breach; D swings to prohibition instead of governance."}, {"stem": "The sponsor removed the sustainability KPIs from the draft charter, saying \"they're not our problem on this project.\" Per PMBOK 8's sustainability principle, the PM should:", "options": ["Accept the removal — the sponsor owns the charter", "Reinsert the KPIs without telling the sponsor", "Present the case for including sustainability goals (compliance exposure, stakeholder expectations, lifecycle costs, organizational strategy) and, regardless of the outcome, continue to raise sustainability impacts in project discussions", "Escalate the sponsor to the PMO for a principle violation"], "answer": 2, "rationale": "<p>PMBOK is explicit: sustainability goals <em>should<\/em> be in formal documents confirmed by the sponsor, and where they aren't, the PM still encourages discussion of impacts — joint accountability without insubordination. A goes silent; B is deceptive; D escalates before persuading.<\/p>\n<hr />"}]}, {"id": "domI", "kind": "prose", "dom": "d1", "label": "Domain I — People", "nav": "Domain I overview", "html": "<h2>Advance Organizer — The Story of This Domain<\/h2>\n<p>People questions test whether you lead like a modern PM: you create a <strong>shared vision<\/strong> (Task 1), keep the team healthy through <strong>conflict<\/strong> (2) and <strong>leadership<\/strong> (3), and manage the human ecosystem around the project — <strong>engaging stakeholders<\/strong> (4), <strong>aligning<\/strong> (5) and <strong>managing<\/strong> (6) their expectations, ensuring <strong>knowledge transfer<\/strong> (7), and running <strong>communication<\/strong> (8). Notice the arc: <em>vision → team → stakeholders → information flow.<\/em> Almost every People answer reduces to: understand the human situation first, collaborate, communicate transparently, empower.<\/p>"}, {"id": "I_1", "kind": "task", "dom": "d1", "code": "I-1", "label": "I-1 · Develop a Common Vision", "nav": "I-1 Develop a Common Vision", "title": "Develop a Common Vision", "prose": "<p><strong>🎯 Why this matters.<\/strong> New as a headline task in 2026. A project without a shared vision fragments: stakeholders pull in different directions and the team optimizes locally. Vision is the alignment tool that makes every later decision cheaper.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Help ensure a shared vision with key stakeholders • Promote the shared vision • Keep the vision current • Break down situations to identify the root cause of a misunderstanding of the vision.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>What a vision is:<\/strong> a concise, compelling statement of the future state the project creates and why it's worth it. It answers <em>why<\/em> and <em>for whom<\/em>, not <em>how<\/em>.\n- <strong>Co-creation beats broadcast.<\/strong> A vision imposed by the sponsor gets compliance; a vision built <em>with<\/em> key stakeholders gets commitment. Facilitate visioning workshops; in agile, craft a <strong>product vision<\/strong> with the product owner and team (e.g., an elevator-pitch template: <em>For [customer] who [need], the [product] is a [category] that [benefit], unlike [alternative]…<\/em>).\n- <strong>Promote it relentlessly:<\/strong> open kickoffs and sprint reviews with it, tie backlog priorities and decisions to it, make it visible (information radiators, charter, roadmap).\n- <strong>Keep it current:<\/strong> revisit when strategy, market, or sponsor changes; a stale vision is worse than none because it legitimizes obsolete work.\n- <strong>Diagnose misunderstanding at the root:<\/strong> when behavior diverges from the vision, don't correct the symptom — use root-cause techniques (5 Whys, fishbone, active listening in 1:1s) to find whether the cause is wording, translation across cultures/functions, conflicting incentives, or genuine disagreement.<\/p>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Predictive:<\/em> vision lives in the <strong>charter<\/strong> and business case; reaffirmed at phase gates.\n- <em>Agile:<\/em> <strong>product vision<\/strong> + <strong>product goal<\/strong> steer the backlog; re-anchored every sprint review; the roadmap shows the path toward it.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Trigger phrases: \"team members interpret the goal differently,\" \"stakeholder questions why the project exists.\" Best answers <strong>facilitate a session to (re)align on the vision<\/strong> or <strong>investigate the root cause of the misalignment<\/strong> — not \"send the charter again\" or \"escalate to the sponsor.\"\n- If the vision has genuinely changed (new strategy), the answer is to <strong>update and re-communicate<\/strong>, then reflect impacts through the proper process.<\/p>", "cards": [{"front": "Project vision", "back": "Compelling picture of the future state and its value; the \"why\""}, {"front": "Product goal (agile)", "back": "Long-term objective for the product; backlog's north star"}, {"front": "Visioning workshop", "back": "Facilitated co-creation of the vision with key stakeholders"}, {"front": "Information radiator", "back": "Highly visible display keeping vision/status in everyone's sight"}, {"front": "5 Whys", "back": "Root-cause technique: ask \"why\" repeatedly to pass symptoms"}], "prompts": ["Recall the four enabler behaviors for this task.", "Why does co-created vision outperform a broadcast vision? (Use the words commitment vs. compliance.)", "Two team members are building conflicting interpretations of \"improve customer onboarding.\" What do you do first, and which technique?", "Where does the vision live in predictive vs. agile projects?"], "questions": [{"stem": "Midway through a hybrid project, the PM notices two workstreams have made conflicting design choices, each claiming alignment to project goals. What should the PM do FIRST?", "options": ["Escalate to the steering committee for a design ruling", "Facilitate a session with both workstreams to revisit the shared vision and identify where understanding diverged", "Direct both teams to follow the original charter wording", "Log a change request to clarify the design standard"], "answer": 1, "rationale": "The root issue is divergent understanding of the vision — the ECO explicitly expects the PM to break down the situation to find the root cause of misunderstanding and re-align. Escalation (A) skips the PM's own facilitation duty; C treats a symptom with authority rather than understanding; D misuses change control — nothing baselined has changed yet."}, {"stem": "A new sponsor joins and announces a strategic pivot. The team continues delivering against the original product vision. What should the PM do?", "options": ["Continue as planned; the vision was approved at kickoff", "Ask the team to pause all work until a new charter is issued", "Work with the sponsor and key stakeholders to refresh the vision, then re-communicate it and assess impacts on the plan/backlog", "Instruct the product owner to rewrite the backlog immediately"], "answer": 2, "rationale": "<p>\"Keep the vision current\" is the enabler: refresh collaboratively, promote it, then flow impacts through planning/backlog. A ignores changed strategy; B overreacts and destroys momentum; D acts on outputs before realigning the \"why.\"<\/p>\n<hr />"}]}, {"id": "I_2", "kind": "task", "dom": "d1", "code": "I-2", "label": "I-2 · Manage Conflicts", "nav": "I-2 Manage Conflicts", "title": "Manage Conflicts", "prose": "<p><strong>🎯 Why this matters.<\/strong> Conflict is inevitable and, handled well, productive — it surfaces better options. Handled badly, it destroys psychological safety and velocity. PMI tests whether you treat conflict as a problem to <em>solve with people<\/em>, not a battle to win or a mess to hide.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Identify conflict sources • Analyze the context • Implement an agreed-on resolution strategy • Communicate conflict-management principles to team and external stakeholders • Establish an environment fostering adherence to common ground rules • Manage and rectify ground-rule violations.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Common sources:<\/strong> schedules, priorities, resources, technical opinions, process, personalities (personality clashes are the least common despite appearances — look for the structural cause underneath).\n- <strong>Analyze context before intervening:<\/strong> How intense is it? Who's involved? Time pressure? Importance of the relationship vs. the issue? Is it healthy task conflict (about the work) or harmful relationship conflict (about persons)?\n- <strong>Five resolution approaches<\/strong> (know them cold):<\/p>\n<table>\n<thead>\n<tr>\n<th>Approach<\/th>\n<th>What it looks like<\/th>\n<th>When appropriate<\/th>\n<th>Outcome<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Collaborate / Problem-solve<\/strong><\/td>\n<td>Openly examine all views; find a solution meeting everyone's needs<\/td>\n<td>Time available; relationship and issue both matter<\/td>\n<td><strong>Win–win<\/strong> (PMI's default best)<\/td>\n<\/tr>\n<tr>\n<td><strong>Compromise / Reconcile<\/strong><\/td>\n<td>Each side gives something<\/td>\n<td>Equal power; time pressure; temporary fix<\/td>\n<td>Lose–lose (partial)<\/td>\n<\/tr>\n<tr>\n<td><strong>Smooth / Accommodate<\/strong><\/td>\n<td>Emphasize agreement, downplay difference<\/td>\n<td>Harmony matters more; you're wrong; stakes low<\/td>\n<td>Yield<\/td>\n<\/tr>\n<tr>\n<td><strong>Force / Direct<\/strong><\/td>\n<td>Impose a decision<\/td>\n<td>Emergency, safety, ethics; when authority must decide now<\/td>\n<td>Win–lose<\/td>\n<\/tr>\n<tr>\n<td><strong>Withdraw / Avoid<\/strong><\/td>\n<td>Postpone or step away<\/td>\n<td>Cooling-off needed; issue trivial; no chance of resolution now<\/td>\n<td>Lose–lose (deferred)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Ground rules<\/strong> (team charter / working agreements): co-created norms — meeting behavior, communication channels, decision rules, definition of respect. Because the <em>team<\/em> wrote them, the <em>team<\/em> enforces them; the PM's job is to make violations discussable and rectified early, privately first.<\/li>\n<li><strong>Process:<\/strong> address conflict early and directly, usually <strong>in private<\/strong> with those involved; keep it about issues, not persons; escalate only when direct resolution fails or the conflict exceeds team authority.<\/li>\n<\/ul>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> retrospectives are the built-in forum for surfacing friction; the scrum-master-type role coaches the team to resolve its own conflicts (self-management) rather than adjudicating.\n- <em>Predictive:<\/em> the PM more often mediates directly, but the collaborate-first hierarchy is identical.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- \"What should the PM do?\" after a heated dispute → almost always <strong>meet with those involved to understand the conflict<\/strong> (analyze context) before choosing a technique. Not \"escalate,\" not \"separate them,\" not \"report to HR\" (unless harassment/ethics).\n- Forcing is only right for <strong>safety, compliance, ethics, or true emergencies<\/strong>.\n- A ground-rule violation → <strong>address it with the individual privately, referencing the team's agreed norms<\/strong>; repeated violations → involve the team in revisiting the working agreement.<\/p>", "cards": [{"front": "Team charter / working agreements", "back": "Co-created ground rules and norms; basis for self-policing"}, {"front": "Collaborating", "back": "Win–win problem-solving; PMI's preferred approach"}, {"front": "Compromising", "back": "Both sides give up something; partial satisfaction"}, {"front": "Forcing", "back": "Imposed win–lose; reserve for emergencies/safety/ethics"}, {"front": "Smoothing", "back": "De-emphasize differences to preserve harmony"}, {"front": "Withdrawing", "back": "Retreat/postpone; can be tactical cooling-off"}, {"front": "Task vs. relationship conflict", "back": "About the work (often healthy) vs. about persons (harmful)"}], "prompts": ["List the five conflict approaches and the outcome type of each (win–win, etc.).", "Which two situations justify forcing?", "What makes ground rules enforceable — who creates them and why does that matter?", "A conflict erupts publicly in a sprint review. Sequence your first three moves."], "questions": [{"stem": "Two senior engineers repeatedly clash over architecture in team meetings, and the team's velocity is dropping. What should the PM do FIRST?", "options": ["Reassign one engineer to another workstream", "Meet with both engineers to understand the sources and context of the disagreement", "Impose the architecture recommended by the enterprise architect", "Raise the conflict at the next steering committee"], "answer": 1, "rationale": "Analyze before acting — identify sources and context, then facilitate an agreed resolution (collaboration first). A avoids and loses expertise; C forces without an emergency; D escalates prematurely."}, {"stem": "During a retrospective, a team member says another member routinely interrupts and dismisses ideas, violating the team's working agreement. What is the BEST response by the servant leader?", "options": ["Publicly reprimand the interrupting member to signal seriousness", "Remove the interrupting member from retrospectives", "Facilitate the team in revisiting its working agreements and agreeing on how violations will be handled, then follow up privately with the individual", "Update the RACI to reduce interaction between the two members"], "answer": 2, "rationale": "Ground rules belong to the team; reinforce collective ownership and rectify the violation respectfully (private follow-up). A humiliates (relationship damage); B avoids; D is a structural dodge of a behavioral issue."}, {"stem": "A vendor's project lead and your procurement manager are deadlocked over an interpretation of deliverable acceptance criteria, and a milestone payment is due in two days. Time is short and both parties hold power. Which resolution approach fits BEST right now?", "options": ["Withdraw until emotions settle", "Compromise on an interim interpretation while a joint working group resolves the definition", "Force your organization's interpretation using the contract", "Smooth over the difference and release the payment"], "answer": 1, "rationale": "<p>Equal power + time pressure + need for a workable temporary fix is the textbook compromise scenario, paired with a collaborative path to a durable fix. A misses the deadline; C damages the vendor relationship and may breach good faith; D concedes acceptance criteria — a scope/quality integrity problem.<\/p>\n<hr />"}]}, {"id": "I_3", "kind": "task", "dom": "d1", "code": "I-3", "label": "I-3 · Lead the Project Team", "nav": "I-3 Lead the Project Team", "title": "Lead the Project Team", "prose": "<p><strong>🎯 Why this matters.<\/strong> The heaviest People task in practice. PMI's model leader is a <strong>servant leader<\/strong> who sets expectations, empowers, unblocks, represents the team, includes every perspective, and flexes style to the situation.<\/p>\n<p><strong>📋 ECO Enablers<\/strong>\n- Establish expectations at team level • Empower the team • Solve problems • Represent the voice of the team • Support the team's varied experiences, skills, and perspectives • Determine an appropriate leadership style • Establish clear roles and responsibilities.<\/p>\n<p><strong>🧠 Core Concepts<\/strong>\n- <strong>Set expectations:<\/strong> co-develop the team charter (norms, quality bar/definition of done, communication cadence, decision rights). Clear expectations prevent most \"performance problems.\"\n- <strong>Empower:<\/strong> delegate outcomes with authority to decide <em>how<\/em>; trust the team's estimates; protect focus by shielding from interruptions; celebrate initiative. Empowerment requires <strong>psychological safety<\/strong> — people can raise problems, dissent, and admit mistakes without punishment (this is also PMBOK 8 Principle 6, <em>build an empowered culture<\/em>).\n- <strong>Solve problems / remove blockers:<\/strong> the servant leader owns impediments the team can't clear (cross-department dependencies, tooling, approvals).\n- <strong>Voice of the team:<\/strong> defend realistic estimates to sponsors; buffer unreasonable pressure; give the team credit upward, take criticism yourself.\n- <strong>Inclusion:<\/strong> actively draw on varied experiences and perspectives; structure discussions so quieter members contribute (round-robins, silent writing); watch for bias in assignments.\n- <strong>Leadership styles — match to situation<\/strong> (situational leadership):<\/p>\n<table>\n<thead>\n<tr>\n<th>Style<\/th>\n<th>Essence<\/th>\n<th>Fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Directing/Telling<\/td>\n<td>Give specific instructions<\/td>\n<td>Novice team, crisis, safety-critical<\/td>\n<\/tr>\n<tr>\n<td>Coaching<\/td>\n<td>Explain + develop skills<\/td>\n<td>Growing competence, willing learners<\/td>\n<\/tr>\n<tr>\n<td>Supporting/Participating<\/td>\n<td>Facilitate; share decisions<\/td>\n<td>Competent team needing confidence<\/td>\n<\/tr>\n<tr>\n<td>Delegating<\/td>\n<td>Hand over decisions<\/td>\n<td>Highly competent, motivated team<\/td>\n<\/tr>\n<tr>\n<td>Servant<\/td>\n<td>Serve needs, remove obstacles<\/td>\n<td>Default in agile; healthy anywhere<\/td>\n<\/tr>\n<tr>\n<td>Transformational<\/td>\n<td>Inspire via vision and challenge<\/td>\n<td>Change-heavy, innovative projects<\/td>\n<\/tr>\n<tr>\n<td>Laissez-faire<\/td>\n<td>Hands-off<\/td>\n<td>Expert self-directed teams (use sparingly)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Motivation refreshers<\/strong> (still examined as background): intrinsic motivators — <strong>autonomy, mastery, purpose<\/strong> — outperform carrots and sticks for knowledge work; Maslow (needs hierarchy), Herzberg (hygiene factors prevent dissatisfaction; motivators create satisfaction), McGregor (Theory X control vs. Theory Y trust), Tuckman's team stages (<strong>forming → storming → norming → performing → adjourning<\/strong> — conflict spikes in storming; coach through it, don't panic).<\/li>\n<li><strong>Roles &amp; responsibilities:<\/strong> make them explicit with a <strong>RACI<\/strong> (Responsible, Accountable, Consulted, Informed — exactly <strong>one A<\/strong> per activity); in agile, respect role boundaries (product owner owns priorities; team owns how).<\/li>\n<\/ul>\n<p><strong>⚖️ Predictive vs. Agile Lens<\/strong>\n- <em>Agile:<\/em> team is self-organizing — leader facilitates, never assigns tasks person-by-person; growth via coaching and retrospectives.\n- <em>Predictive:<\/em> PM has more directive latitude, but empowerment and inclusion remain the tested ideal.<\/p>\n<p><strong>💡 Exam Intelligence<\/strong>\n- Underperformance scenario → first <strong>talk privately to understand causes<\/strong> (skill gap? unclear expectation? personal issue? impediment?) — never straight to formal HR action or public feedback.\n- Team misses estimates → improve estimation together (e.g., add refinement, use relative estimating), don't impose your numbers.\n- \"Team disagrees with your solution\" → as servant leader, let the empowered team try its approach within guardrails, unless safety/compliance is at stake.<\/p>", "cards": [{"front": "Psychological safety", "back": "Shared belief it's safe to take interpersonal risks — dissent, questions, mistakes"}, {"front": "Servant leadership", "back": "Leader exists to serve/enable the team; hallmark of agile leadership"}, {"front": "RACI", "back": "Responsibility matrix; one Accountable per task"}, {"front": "Tuckman stages", "back": "Forming, storming, norming, performing, adjourning"}, {"front": "Herzberg two-factor", "back": "Hygiene prevents dissatisfactio
